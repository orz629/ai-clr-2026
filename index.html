磨牙習慣又有動搖度：控制發炎後製作咬合板","第 IV 期的臨界支台齒：牙周、補綴、齒顎矯正跨科評估後再決定保留或拔除"],"cases":[{"h":"大臼齒 Class II 根岔侵犯（教學模擬）","b":"45 歲女性，第 III 期 B 級，16 頰側 PPD 7 mm、出血、Class II 根岔侵犯、骨喪失 40%，初診 Questionable。牙根整平並教導單束刷、牙間刷清潔根岔，再評估 PPD 3 mm、不出血，預後調升為 Favorable（Kwok & Caton 2007；Helal 2019）。"},{"h":"重度吸菸又不規則回診（教學模擬）","b":"50 歲男性每天 20 支，第 III 期 C 級，多處殘留 PPD 5–6 mm 且出血。現吸菸 RR 1.41（Chen 2026）、不依從維護 OR 1.51（Helal 2019）；全口預後調降、戒菸轉介、SPT 縮短為每 2 個月。"},{"h":"第 IV 期的臨界支台齒（教學模擬）","b":"55 歲糖尿病（HbA1c 7.8%），46 為右下最後支台齒，PPD 6 mm、Class II 根岔、骨喪失 55%。先會同內科控制血糖，非手術與再生治療後若達到牙周穩定，就保留作固定假牙支台齒；由牙周與補綴跨科評估（Herrera 2022；Orishko 2024）。"}]},"debates":["Chen 2026 的劑量反應：輕度 RR 1.59、重度 RR 1.57，作者認為證據不足以建立劑量反應關係；常被引用的「每天 ≥ 15 支 OR 2.82」只是 Dietrich 2015 中 50–59 歲男性的單一分層。","戒菸：前吸菸者 RR 1.21 低於現吸菸者 1.41，但兩者來自不同研究組合，GRADE 證據確定性極低（Chen 2026）。","Carvalho 2021 統合迴歸中，吸菸、糖尿病、根岔病變都不是顯著的基線預測因子；只有個別研究顯示年齡、吸菸與牙位相關。","外部驗證：Saleh 2021 以牙周相關拔牙為終點，10 種系統 C-index 都 ≥ 0.925；Saydzai 2022 則發現各系統敏感度低，許多最差預後牙 5 年後仍保留（Orishko 2024 轉述）。","Kwok & Caton 2007 沒有給各級預後的量化切點，臨床主觀裁量空間大。","本主題沒有專屬的共識或指引，臨床決策要銜接 2017 分類（Tonetti 2018）與 EFP S3 第 IV 期指引（Herrera 2022）。","Herrera 2022 中臨界牙齒的骨吸收門檻、建議編號與成本效益說法，仍待對照原文確認。"],"quiz":[{"q":"McGuire 1991 的傳統預後分類中，哪一級預測最準確？","o":["Good","Fair","Questionable","Hopeless"],"a":0,"e":"只有 Good 預測準確：5 年、8 年都有 > 84% 維持或改善；Questionable 5 年後沒有一顆留在原分類。"},{"q":"Kwok & Caton 2007 預後系統以什麼為終點？","o":["牙齒是否拔除","牙周支持組織是否穩定","X 光骨高度是否增加","病人滿意度"],"a":1,"e":"以牙周支持組織穩定取代牙齒喪失，因為拔牙常受非牙周因素影響。"},{"q":"依 Nunn 2012 的 CART 分析，非大臼齒最首要的分支因子是？","o":["冠根比","根岔侵犯","PPD > 5 mm","家族史"],"a":2,"e":"大臼齒首要為冠根比與根岔侵犯；非大臼齒首要為 PPD > 5 mm，其次是動搖度等。"},{"q":"Helal 2019 中，下列哪一項的拔牙勝算比最高？","o":["吸菸","糖尿病","大臼齒","不依從維護"],"a":2,"e":"大臼齒 OR 4.22；吸菸 1.98、糖尿病 1.80、不依從維護 1.51。"},{"q":"Chen 2026 對吸菸量與拔牙風險的結論是？","o":["每天 ≥ 15 支 OR 2.82，有明確劑量效應","輕度與重度吸菸風險相近，劑量反應尚未確立","輕度吸菸不增加風險","前吸菸者風險與從未吸菸者相同"],"a":1,"e":"子組分析輕度 RR 1.59、重度 RR 1.57；任何吸菸量都增加風險，前吸菸者 RR 1.21 仍高於非吸菸者。"},{"q":"36 初診 PPD 7 mm、出血、Class II 根岔，評為 Questionable；非手術治療後 PPD 3 mm、不出血、根岔可清潔。預後應如何調整？","o":["維持 Questionable","調升為 Favorable","調降為 Unfavorable","直接拔除"],"a":1,"e":"發炎已控制、牙周組織達到穩定，依 Kwok & Caton 2007 可動態調升為 Favorable。"}],"lit":[{"a":"McGuire","y":"1991","t":"Prognosis versus actual outcome: a long-term survey of 100 treated periodontal patients under maintenance care","j":"J Periodontol","pm":"2002432","r":"classic","s":0,"src":""},{"a":"McGuire & Nunn","y":"1996","t":"Prognosis versus actual outcome. III. The effectiveness of clinical parameters in accurately predicting tooth survival","j":"J Periodontol","pm":"8832477","r":"classic","s":0,"src":""},{"a":"Kwok & Caton","y":"2007","t":"Commentary: prognosis revisited: a system for assigning periodontal prognosis","j":"J Periodontol","pm":"17970671","r":"classic","s":0,"src":""},{"a":"Nunn et al.","y":"2012","t":"Development of prognostic indicators using classification and regression trees for survival","j":"Periodontol 2000","pm":"22133372","r":"classic","s":0,"src":""},{"a":"Helal et al.","y":"2019","t":"Predictors for tooth loss in periodontitis patients: Systematic review and meta-analysis","j":"J Clin Periodontol","pm":"31025366","r":"new","s":1,"src":"JCP"},{"a":"Orishko et al.","y":"2024","t":"Tooth- and implant-related prognostic factors in treatment planning","j":"Periodontol 2000","pm":"39234949","r":"new","s":1,"src":"Perio 2000"},{"a":"Carvalho et al.","y":"2021","t":"Predictors of tooth loss during long-term periodontal maintenance: An updated systematic review","j":"J Clin Periodontol","pm":"33998031","r":"new","s":0,"src":"JCP"},{"a":"Chen et al.","y":"2026","t":"The Effect of Tobacco Smoking on Tooth Loss: A Systematic Review and Meta-Analysis","j":"J Clin Periodontol","pm":"41839221","r":"new","s":0,"src":"JCP"},{"a":"Tonetti et al.","y":"2018","t":"Staging and grading of periodontitis: Framework and proposal of a new classification and case definition","j":"J Clin Periodontol","pm":"29926495","r":"rel","s":0,"src":"","at":8},{"a":"Herrera et al.","y":"2022","t":"Treatment of stage IV periodontitis: The EFP S3 level clinical practice guideline","j":"J Clin Periodontol","pm":"35688447","r":"rel","s":0,"src":"","at":12}]},"11":{"status":"draft","statusNote":"數字與摘要經教師核實，書目依 PubMed 更正（2026-10-23）","oneLine":"經過治療與定期維護的無望齒不會危害鄰牙；現代決策以「發炎可控、可清創」取代單看骨支持量，結合 Avila 決策樹、Miller 大臼齒評分與 EFP S3 第 IV 期指引，保存天然牙是第一線策略，拔牙是整體重建的戰略選擇而非放棄治療。","takeHome":[{"h":"保留無望齒不會傷害鄰牙，前提是治療加維護","b":"DeVore 1988：17 位病人追蹤 3.41 年，相鄰面 PPD 反而由 4.06 降到 3.06 mm。Machtei & Hirsch 2007：110 顆無望齒（保留 57、拔除 53）追蹤 4.40 年，保留的無望齒本身骨增加 0.82 mm，鄰牙骨高度穩定。未治療時鄰牙每年骨流失 3.12%（Machtei 1989，Machtei 2007 轉述）。"},{"h":"用客觀工具評估，不靠單一指標拔牙","b":"Avila 2009 六層級紅黃綠決策樹把病人期望放第一層；Miller 2013 大臼齒評分：吸菸 HR 3.46、PPD 2.20、動搖度 2.08、根岔侵犯 1.21。評分要在治療後再算一次，再生手術與固定術可改變分數。"},{"h":"第 IV 期：保存天然牙優先，植體延後","b":"Herrera 2022 R5.2 以保留牙齒為第一線（Grade A），先完成第 1–3 階段治療達到終點（無 PPD ≥ 6 mm、5 mm 位點不出血）再做矯正或補綴。Lundgren 2008：只剩 25–30% 支持的牙仍可當支台齒，並主張戰略性延後植體植入。"}],"compare":[{"c":"DeVore et al. 1988","old":"保留並治療的無望齒不會使鄰牙相鄰面的 PPD、骨高度或牙周韌帶腔惡化","v":"cond","now":"需加條件。核心結論仍成立，但樣本只有 17 位、回顧性、2D 咬翼片量測、未量附連水平；前提是完成治療與定期維護，必要時以 CBCT 評估鄰牙骨缺損型態。"},{"c":"Machtei & Hirsch 2007","old":"手術保留的無望齒鄰牙骨高度穩定；拔除組鄰牙遠中骨增加較多（11.36% vs 1.50%）是拔牙窩癒合所致","v":"cond","now":"需加條件。仍適用，但只在完成清創並每 3–6 個月維護時成立；當年以翻瓣清創為主，現代再生手術（EMD、GTR、骨粉）可讓深窄骨內缺損的牙由無望翻轉為可保存（Sanz 2020；Herrera 2022）。"},{"c":"Avila et al. 2009","old":"六層級紅黃綠決策樹，病人期望與財務列第一層","v":"upd","now":"已更新部分。架構與病人優先的理念仍適用；但現代黏著與全瓷補綴降低冠根比門檻，且植體不再是「高成功率備案」，要把植體周圍炎風險（5 年 8.6%，Pjetursson 2004，Lundgren 2008 轉述）納入第 6 層。"},{"c":"Miller et al. 2013","old":"816 顆大臼齒追蹤 24.2 年的定量評分，吸菸給 4 分、PPD 最高 3 分","v":"cond","now":"需加條件。HR 仍是有力工具，但評分只用初診單點數值，沒有反映再生手術或根岔處置後的改善；次級咬合創傷造成的動搖度經固定術（R6.2）可改善，治療後應重新計分。"},{"c":"Lundgren et al. 2008","old":"植體在牙周炎易感病人同樣有風險；剩 25–30% 支持的牙在良好控制下仍可作支台齒","v":"ok","now":"仍適用。與 Herrera 2022 R5.2「保留牙齒為第一線」方向一致，戰略性延後植體植入的觀念仍是現代決策核心。"}],"numbers":[{"k":"4.06 → 3.06 mm","d":"DeVore 1988：17 位病人追蹤 3.41 ± 1.46 年，無望齒鄰牙相鄰面 PPD 顯著改善；骨高度與牙周韌帶腔寬度與非相鄰面無差異"},{"k":"110 顆","d":"Machtei & Hirsch 2007：93 位病人的無望齒，保留 57 顆、拔除 53 顆，平均追蹤 4.40 ± 0.23 年"},{"k":"+0.82 mm","d":"Machtei & Hirsch 2007：保留的無望齒本身骨增加（P = 0.0061），鄰牙骨高度穩定"},{"k":"11.36% vs 1.50%","d":"Machtei & Hirsch 2007：拔除組鄰牙遠中面骨增加較多（P = 0.0119），來自拔牙窩癒合"},{"k":"3.12%／年","d":"未治療時無望齒鄰牙每年骨流失（Machtei 1989，Machtei 2007 轉述）"},{"k":"78.3%","d":"Miller 2013：102 位病人 816 顆大臼齒、平均追蹤 24.2 年，15 年存活率；存活大臼齒中 92%（588/639）牙周健康"},{"k":"HR 3.46","d":"Miller 2013 多變項：吸菸；PPD 2.20、動搖度 2.08、根岔侵犯 1.21；年齡分組不顯著"},{"k":"10 分 → 67%","d":"Miller 2013 評分：10 分的大臼齒 15 年存活率約 67%；7 分約 86%"},{"k":"25–30%","d":"Lundgren 2008：只剩這樣的骨支持，在良好控制下仍可長期作固定牙橋支台齒"},{"k":"8.6%","d":"植體支持固定假牙 5 年植體周圍炎與軟組織併發症（Pjetursson 2004，Lundgren 2008 轉述）"}],"clinical":{"steps":["先確認是否真正無望：縱向根裂、無法復原的齒質破壞、無法清創的反覆膿腫才算；深囊袋、Class III 根岔、重度搖晃但可清創者歸為重度妥協齒","用 Avila 六層級整理病人期望、財務、依從性、補綴需求，與病人一起決定","大臼齒用 Miller 評分，記錄吸菸、PPD、動搖度、根岔、牙位與年齡","完成第 1–2 階段治療後再評估，評估骨缺損型態是否有再生潛能（2 壁、3 壁窄深缺損）","第 IV 期先達治療終點（無 PPD ≥ 6 mm、5 mm 位點不出血），再安排矯正、固定術或補綴","跨科計畫中可暫時保留無望齒當錨定或維持垂直高度，階段任務完成再拔","保留者每 3–6 個月維護，治療後重新計分並與病人溝通長期維護責任"],"cases":[{"h":"深窄骨內缺損的上顎大臼齒（教學模擬）","b":"45 歲不吸菸，16 近中 PPD 9 mm、CAL 8 mm，15 遠中 PPD 7 mm，CBCT 顯示窄深 2 壁骨內缺損。依 DeVore 1988 與 Machtei 2007 保留不會傷害 15；非手術治療後以 GTR 或 EMD 再生手術處理（Sanz 2020）。"},{"h":"Class III 根岔的下顎大臼齒（教學模擬）","b":"52 歲每天少於 10 支菸，36 Class III 根岔、動搖度 2 度、PPD 7 mm，病人想保留且預算有限。Miller 評分 10 分（15 年存活率約 67%）；翻瓣搭配隧道化或切根，每 3 個月維護，暫不拔牙植牙（Lundgren 2008）。"},{"h":"第 IV 期扇形漂移與咬合崩塌（教學模擬）","b":"58 歲剩 18 顆牙，多處 PPD ≥ 6 mm、前牙扇形漂移、多顆動搖度 2–3 度。依 Herrera 2022 R5.2 先完成第 1–3 階段治療達終點，再做矯正（R7.2）、長期固定術（R6.2）與植體輔助局部固定假牙。"}]},"debates":["DeVore 1988 與 Machtei 2007 都是小樣本回顧性研究，且都沒有量測附連水平；「不會傷害鄰牙」的證據強度有限。","Miller 2013 的評分只用初診數值，沒有經過外部驗證；治療後重新計分的做法是教學建議，不是原作者的設計。","CBCT 用於評估無望齒鄰牙是教學建議，EFP S3 第 IV 期指引並沒有提到 CBCT。","Herrera 2022 多條建議註明納入研究沒有評估健康經濟學，植體費用多不在健保給付，成本決策要在地評估。","R6.2 固定術只有 Grade 0、證據極低；R9.6 短縮齒列也是 Grade 0。"],"quiz":[{"q":"關於保留無望齒對鄰牙的影響，DeVore 1988 與 Machtei 2007 的結論是？","o":["鄰牙骨流失明顯加速","經治療與維護後鄰牙未見骨破壞","保留組鄰牙骨增加多於拔除組","應一律拔除以保護鄰牙"],"a":1,"e":"兩篇都顯示經治療與維護的無望齒不傷害鄰牙；拔除組鄰牙骨增加較多（11.36% vs 1.50%）是拔牙窩癒合所致。"},{"q":"Miller 2013 多變項分析中，對大臼齒喪失危害比最高的因子是？","o":["PPD","動搖度","吸菸","根岔侵犯"],"a":2,"e":"吸菸 HR 3.46，其次 PPD 2.20、動搖度 2.08、根岔侵犯 1.21；評分中吸菸給 4 分。"},{"q":"依 Herrera 2022，第 IV 期牙周炎進行矯正或補綴前要達到的治療終點是？","o":["全口 PPD ≤ 3 mm","無 PPD ≥ 6 mm，且 5 mm 位點不出血","BoP < 30%","X 光骨高度增加"],"a":1,"e":"達到牙周穩定終點後才進入跨科處置；保存天然牙是第一線策略（R5.2）。"},{"q":"Avila 2009 決策樹的第一層級是什麼？","o":["根岔侵犯","病人期望、財務與依從性","冠根比","吸菸與系統疾病"],"a":1,"e":"Avila 把病人自主（期望與財務）放在第一層，病人明確要求拔除列為紅牌。"},{"q":"Lundgren 2008 認為骨支持只剩多少的牙，在良好控制下仍可作固定牙橋支台齒？","o":["10%","25–30%","50%","70%"],"a":1,"e":"並主張戰略性延後植體植入，延後拔牙就延後植體失敗風險。"},{"q":"下列哪一顆牙最符合現代「真正無望齒」的定義？","o":["Class III 根岔但可清創","動搖度 2 度、發炎已控制","縱向根裂","PPD 8 mm 的窄深 3 壁骨內缺損"],"a":2,"e":"真正無望限於結構無法復原或無法清創者；其他屬重度妥協齒，應先治療再評估。"}],"lit":[{"a":"Avila et al.","y":"2009","t":"A novel decision-making process for tooth retention or extraction","j":"J Periodontol","pm":"19254132","r":"classic","s":1,"src":"JP"},{"a":"DeVore et al.","y":"1988","t":"Retained \"hopeless\" teeth. Effects on the proximal periodontium of adjacent teeth","j":"J Periodontol","pm":"3183915","r":"classic","s":0,"src":""},{"a":"Machtei & Hirsch","y":"2007","t":"Retention of hopeless teeth: the effect on the adjacent proximal bone following periodontal surgery","j":"J Periodontol","pm":"18052695","r":"classic","s":0,"src":""},{"a":"Miller et al.","y":"2013","t":"An evidenced-based scoring index to determine the periodontal prognosis on molars","j":"J Periodontol","pm":"23725028","r":"classic","s":0,"src":""},{"a":"Lundgren et al.","y":"2008","t":"To save or to extract, that is the question. Natural teeth or dental implants in periodontitis-susceptible patients: clinical decision-making and treatment strategies exemplified with patient case presentations","j":"Periodontol 2000","pm":"18412572","r":"new","s":1,"src":"Perio 2000"},{"a":"Herrera et al.","y":"2022","t":"Treatment of stage IV periodontitis: The EFP S3 level clinical practice guideline","j":"J Clin Periodontol","pm":"35688447","r":"rel","s":0,"src":"","at":12}]},"12":{"status":"draft","statusNote":"數字與摘要經教師核實，書目依 PubMed 更正（2026-10-23）","oneLine":"早期文獻只比「存活率」，天然牙與植體看起來相當；現代證據加入併發症、植體周圍炎與長期維護後，牙周病史病人的植體風險明顯較高，EFP S3 指引把保留天然牙列為第 IV 期的第一線策略，決策要以個人牙周風險評估取代單一存活率。","takeHome":[{"h":"存活率相當，不代表結果相當","b":"Torabinejad 2007：根管治療牙與植體單冠 6 年以上存活率都是 97%。Pjetursson 2007：5 年存活率傳統牙橋 93.8%、植體牙橋 95.2%，但 5 年有併發症的比例 38.7% vs 15.7%（植體牙橋 vs 傳統牙橋）。"},{"h":"拔牙植牙不會消除牙周病風險","b":"Annunziata 2024：牙周病史者植體喪失 HR 1.75（追蹤 ≥ 10 年 2.02，C 級 6.16），植體周圍炎 RR 3.24。Smith 2017 整理：10 年植體周圍炎 Karoussis 28.6% vs 5.8%、Roccuzzo 2014 20.2% vs 0%。"},{"h":"保存天然牙優先，維護決定長期結果","b":"Herrera 2022 R5.2：保留牙齒為第一線（Grade A）。Wang 2026：有維護者植體周圍炎 18%、無維護者 43.9%；依從者 10.7 年掉 0.9 顆牙，不依從者 9.6 年掉 2.7 顆。"}],"compare":[{"c":"Iqbal & Kim 2007","old":"68 篇研究：根管治療後補綴牙與植體單冠 60 個月存活率相當（94.1% vs 95.8%）","v":"cond","now":"需加條件。只看存活，沒有評估殘留齒質（ferrule 1.5–2 mm）、補綴邊緣與附連水平；齒質足夠且發炎受控時才優先保留。"},{"c":"Torabinejad et al. 2007","old":"6 年以上加權存活率：根管治療牙 97%、植體單冠 97%、固定牙橋 82%","v":"cond","now":"需加條件。混雜多種補綴形式，追蹤不足以涵蓋 10 年以上植體周圍炎；牙周高風險病人拔牙植牙的長期維護負擔較高（Annunziata 2024；Pjetursson 2007）。"},{"c":"Fugazzotto 2001","old":"切根大臼齒 701 顆 96.8%（≥ 15 年）與大臼齒區植體 1,472 支 97.0%（13 年）成功率相當","v":"cond","now":"需加條件。單一私人診所回顧性資料，無標準化 PPD 與骨水平量測，高度依賴術者技術；下顎截遠心根者只有 75%，失敗病例多有咬合異常功能。"},{"c":"Lindh et al. 1998","old":"局部缺牙植體 3 年存活率：單冠 97.5%、固定牙橋 94.2%","v":"upd","now":"已更新。追蹤太短，無法反映 10–20 年的生物學併發症；局部缺牙決策改用 Pjetursson 2007 與 Carra 2021 的 5–10 年併發症資料。"},{"c":"Salinas & Eckert 2007","old":"60 個月植體單冠 95.1%，傳統牙橋 94.0%（含樹脂黏著牙橋則全部牙橋 84.0%）","v":"upd","now":"已更新。牙周病史病人植體周圍炎風險明顯較高（Carra 2021 RR 3.3；Smith 2017），單牙缺失要先做牙周風險評估再選擇。"}],"numbers":[{"k":"95.8% vs 94.1%","d":"Iqbal & Kim 2007：60 個月存活率，植體單冠 vs 根管治療後補綴牙（68 篇研究，55 篇植體、13 篇根管治療牙）"},{"k":"97% / 97% / 82%","d":"Torabinejad 2007：6 年以上加權存活率，根管治療牙／植體單冠／固定牙橋"},{"k":"96.8% vs 97.0%","d":"Fugazzotto 2001：切根大臼齒（≥ 15 年）vs 大臼齒區植體（13 年）；下顎截遠心根 75%"},{"k":"38.7% vs 15.7%","d":"Pjetursson 2007：5 年發生併發症的病人比例，植體牙橋 vs 傳統牙橋（無併發症 61.3% vs 84.3%，p = 0.008）"},{"k":"77.8%","d":"Pjetursson 2007：天然牙與植體混合支持牙橋 10 年存活率；傳統、植體牙橋、植體單冠分別為 89.2%、86.7%、89.4%"},{"k":"12.7%","d":"Pjetursson 2007：植體單冠 5 年螺絲鬆脫；骨喪失 > 2 mm 6.3%"},{"k":"8% vs 42%","d":"Tomasi 2021：全口固定假牙技術性併發症，天然牙支持（7.2 年）vs 植體支持（2.6 年）；植體周圍炎 3.1 年 9%"},{"k":"HR 2.06","d":"Carra 2021：牙周病史者植體牙橋的植體喪失；植體周圍炎 RR 3.3，邊緣骨變化無差異"},{"k":"HR 1.75","d":"Annunziata 2024：牙周病史者植體喪失（≥ 10 年 2.02，C 級 6.16）；植體周圍炎 RR 3.24、邊緣骨多掉 0.41 mm"},{"k":"18% vs 43.9%","d":"Wang 2026：有維護 vs 無維護的植體周圍炎；規律維護最多可減少 90% 植體失敗"}],"clinical":{"steps":["先完成第 1–3 階段牙周治療，確認全口 BoP < 10%、無 PPD ≥ 5 mm，以及病人口腔衛生依從性（Herrera 2022）","評估齒質與可復原性：ferrule ≥ 1.5 mm、補綴邊緣是否可建立","評估牙周解剖與再生潛力：骨內缺損型態、根岔分級","整合個人風險：年齡、全身疾病、吸菸、牙周分期分級、手部靈巧度與維護需求（Schimmel 2023）","跟病人說明：牙周病史者植體周圍炎風險約 3 倍，拔牙植牙不是一勞永逸","不論保留或植牙，都要排定終身 SPT／支持性植體照護"],"cases":[{"h":"第 IV 期 C 級大臼齒 Class II 根岔（教學模擬）","b":"55 歲，36 近中 Class II 根岔、PPD 7 mm、出血、動搖度 2 度。依 Herrera 2022 不是必然拔除，先做非手術與手術或再生治療（隧道化亦可）；牙周病史者植體風險高（Smith 2017），配合 SPT 保留天然大臼齒（Wang 2026）。"},{"h":"上顎正中門齒深囊袋合併骨內缺損（教學模擬）","b":"48 歲，11 PPD 8 mm、窄深 3 壁骨內缺損、活性測試陰性。根管治療後補綴牙存活率與植體相當（Iqbal 2007；Torabinejad 2007）；搭配再生手術（翻瓣 + EMD ± 骨移植），保留天然牙也較能維持牙間乳突與唇側輪廓。"},{"h":"殘留齒列末期高齡病人（教學模擬）","b":"62 歲，上顎只剩 4 顆犬齒與小臼齒，PPD 5–6 mm。可修短牙冠改作天然牙支持覆蓋假牙，保留骨與本體感覺（Donos 2021；Herrera R10.2）；改作植體全口固定假牙則高齡維護負擔高（Tomasi 2021；Schimmel 2023）。"}]},"debates":["經典研究多用平滑面或早期粗糙面植體，追蹤多為 3–5 年，數據不能直接套用到現代植體。","各研究對「成功」與植體周圍炎的定義不同（如 Roccuzzo 以骨喪失 ≥ 3 mm），植體周圍炎盛行率差異大。","Donos 2021：天然牙與植體支持覆蓋假牙直接比較只有 1 篇高偏差研究，證據品質低。","Herrera 2022 R10.1（≥ 4 顆雙側支台齒可做天然牙支持全口固定假牙）只有 Grade B、證據低。","Fugazzotto 2001 的失敗病例多有咬合異常功能（切根 7/23、植體 17/45），結果受病人選擇與術者技術影響大。","Stilwell 2026 共識只處理無牙上顎重建，不涵蓋保留天然牙的比較。"],"quiz":[{"q":"Torabinejad 2007 中，根管治療牙與植體單冠 6 年以上加權存活率分別為？","o":["97% 與 97%","97% 與 82%","82% 與 97%","90% 與 95%"],"a":0,"e":"兩者都是 97%，固定牙橋 82%；存活相當，但植體後續處置較多。"},{"q":"Pjetursson 2007：5 年內發生併發症的病人比例，植體牙橋與傳統牙橋各約多少？","o":["15.7% 與 38.7%","38.7% 與 15.7%","12.7% 與 6.3%","5% 與 5%"],"a":1,"e":"植體牙橋 38.7%、傳統牙橋 15.7%（p = 0.008），存活率卻相近。"},{"q":"Annunziata 2024：牙周病史者的植體周圍炎風險比約為？","o":["RR 1.2","RR 2.0","RR 3.24","RR 6.16"],"a":2,"e":"RR 3.24；植體喪失 HR 1.75，C 級牙周炎 HR 6.16。"},{"q":"依 Herrera 2022 EFP S3 指引，第 IV 期牙周炎的第一線策略是？","o":["全口拔牙植牙","保留牙齒（R5.2，Grade A）","先做補綴再治療牙周","活動假牙"],"a":1,"e":"先完成第 1–3 階段治療，優先保留具戰略價值的天然牙。"},{"q":"Fugazzotto 2001 中，哪一類切根大臼齒成功率明顯較低？","o":["上顎截遠頰根","上顎截近頰根","下顎截遠心根","下顎截近心根"],"a":2,"e":"下顎截遠心根只有 75%，失敗病例多與咬合異常功能有關。"},{"q":"Wang 2026：規律維護與無維護的植體周圍炎盛行率約為？","o":["5% vs 10%","18% vs 43.9%","30% vs 35%","43.9% vs 18%"],"a":1,"e":"有維護 18%、無維護 43.9%；維護對植體比對天然牙更關鍵。"}],"lit":[{"a":"Lindh et al.","y":"1998","t":"A meta-analysis of implants in partial edentulism","j":"Clin Oral Implants Res","pm":"9663035","r":"classic","s":0,"src":""},{"a":"Fugazzotto","y":"2001","t":"A comparison of the success of root resected molars and molar position implants in function in a private practice: results of up to 15-plus years","j":"J Periodontol","pm":"11525447","r":"classic","s":0,"src":""},{"a":"Iqbal & Kim","y":"2007","t":"For teeth requiring endodontic treatment, what are the differences in outcomes of restored endodontically treated teeth compared to implant-supported restorations?","j":"Int J Oral Maxillofac Implants","pm":"18437793","r":"classic","s":0,"src":""},{"a":"Torabinejad et al.","y":"2007","t":"Outcomes of root canal treatment and restoration, implant-supported single crowns, fixed partial dentures, and extraction without replacement: a systematic review","j":"J Prosthet Dent","pm":"17936128","r":"classic","s":0,"src":""},{"a":"Salinas & Eckert","y":"2007","t":"In patients requiring single-tooth replacement, what are the outcomes of implant- as compared to tooth-supported restorations?","j":"Int J Oral Maxillofac Implants","pm":"18437792","r":"classic","s":0,"src":""},{"a":"Pjetursson et al.","y":"2007","t":"Comparison of survival and complication rates of tooth-supported fixed dental prostheses (FDPs) and implant-supported FDPs and single crowns (SCs)","j":"Clin Oral Implants Res","pm":"17594374","r":"new","s":1,"src":"COIR"},{"a":"Smith et al.","y":"2017","t":"Chronic periodontitis and implant dentistry","j":"Periodontol 2000","pm":"28429486","r":"new","s":1,"src":"Perio 2000"},{"a":"Tomasi et al.","y":"2021","t":"Efficacy of rehabilitation of stage IV periodontitis patients with full-arch fixed prostheses: Tooth-supported versus Implant-supported-A systematic review","j":"J Clin Periodontol","pm":"34761430","r":"new","s":0,"src":"JCP"},{"a":"Donos et al.","y":"2021","t":"Efficacy of tooth-supported compared to implant-supported full-arch removable prostheses in patients with terminal dentition. A systematic review","j":"J Clin Periodontol","pm":"34775624","r":"new","s":0,"src":"JCP"},{"a":"Carra et al.","y":"2021","t":"Effectiveness of implant-supported fixed partial denture in patients with history of periodontitis: A systematic review and meta-analysis","j":"J Clin Periodontol","pm":"34775625","r":"new","s":0,"src":"JCP"},{"a":"Annunziata et al.","y":"2024","t":"Effectiveness of Implant Therapy in Patients With and Without a History of Periodontitis: A Systematic Review With Meta-Analysis of Prospective Cohort Studies","j":"J Periodontal Res","pm":"39466662","r":"new","s":0,"src":"JPR"},{"a":"Wang et al.","y":"2026","t":"Long-term periodontal and peri-implant tissue stability under supportive therapy","j":"Periodontol 2000","pm":"41952577","r":"new","s":0,"src":"Perio 2000"},{"a":"Herrera et al.","y":"2022","t":"Treatment of stage IV periodontitis: The EFP S3 level clinical practice guideline","j":"J Clin Periodontol","pm":"35688447","r":"cons","s":0,"src":""},{"a":"Schimmel et al.","y":"2023","t":"Group 4 ITI Consensus Report: Patient benefits following implant treatment in partially and fully edentulous patients","j":"Clin Oral Implants Res","pm":"37750516","r":"cons","s":0,"src":""},{"a":"Klinge et al.","y":"2015","t":"The patient undergoing implant therapy. Summary and consensus statements. The 4th EAO Consensus Conference 2015","j":"Clin Oral Implants Res","pm":"26385621","r":"rel","s":0,"src":"","at":7},{"a":"Tonetti et al.","y":"2017","t":"Dental caries and periodontal diseases in the ageing population: call to action to protect and enhance oral health and well-being as an essential component of healthy ageing - Consensus report of group 4 of the joint EFP/ORCA workshop on the boundaries between caries and periodontal diseases","j":"J Clin Periodontol","pm":"28266112","r":"rel","s":0,"src":"","at":45},{"a":"Stilwell et al.","y":"2026","t":"Consensus Report of Group 4 of the 1st Global Consensus for Clinical Guidelines for the Rehabilitation of the Edentulous Maxilla: Conventional Dentures, Implant Overdentures and Implant-Supported Fixed Dental Prostheses","j":"Clin Oral Implants Res","pm":"41732051","r":"rel","s":0,"src":"","at":47}]},"13":{"status":"draft","statusNote":"數字與摘要經教師核實，書目依 PubMed 更正（2026-10-24）","oneLine":"咬合創傷不會單獨引發牙周囊袋或附連喪失；動物實驗顯示與活性發炎並存時會加速骨吸收與附連喪失，但 2017 World Workshop 指出人類沒有證據顯示會加速牙周炎進展，所以治療永遠先控制發炎，咬合調整與牙周固定術是輔助。","takeHome":[{"h":"非始動，可能協同","b":"健康牙周上的過大咬合力只造成牙周韌帶腔增寬與適應性動搖（Fan & Caton 2018）；Lindhe & Svanberg 1974 比格犬在牙周炎加搖放力下，組織學附連喪失 2.2 vs 0.8 mm。人類沒有證據顯示會加速牙周炎進展（Jepsen 2018）。"},{"h":"先控制發炎，咬合處置是輔助","b":"Lindhe & Ericsson 1982：去除搖放力後動搖度下降、牙周韌帶腔恢復，但附連沒有長回（39.6% vs 41.7%，NS）。Burgett 1992 RCT：配合咬合調整平均多 0.4 mm CAL（Fan & Caton 2018 引述）。"},{"h":"次發性創傷才考慮固定","b":"原發性（支持正常）是適應性動搖，處理咬合即可，不做固定；次發性（支持減少）呈進行性動搖時，可能需要牙周固定術以提升舒適度，屬專家意見（Jepsen 2018）。"}],"compare":[{"c":"Glickman 1963","old":"牙周分為刺激區與共同破壞區；咬合過載會改變發炎擴散路徑，形成角狀骨缺損","v":"cond","now":"需加條件。概念性論文，沒有自己的標本與數據，依據的屍體材料缺乏生前臨床參數，無法證實因果；角狀骨缺損也可由單純菌斑發炎造成（Fan & Caton 2018）。分區觀念仍是評估發炎與咬合互動的架構。"},{"c":"Lindhe & Svanberg 1974","old":"比格犬牙周炎加搖放力 180 天，附連喪失與角狀骨缺損明顯增加","v":"cond","now":"需加條件。犬類骨重塑快、搖放力高頻且強制，與人類間歇性咬合力不同；2017 World Workshop 指出沒有證據顯示創傷性咬合力會加速人類牙周炎進展（Jepsen 2018）。"},{"c":"Lindhe & Ericsson 1982","old":"病灶轉為非進行性後去除搖放力，動搖度下降，但附連不會增加","v":"cond","now":"需加條件。人類 RCT（Burgett 1992）顯示牙周治療配合咬合調整平均多 0.4 mm CAL，PD 與動搖度改善兩組相當；共識仍認為臨床證據不足（Fan & Caton 2018；Jepsen 2018）。"},{"c":"Pihlstrom & Ramfjord 1971","old":"恆河猴廢用齒牙周韌帶變窄、牙骨質增厚、過度萌出，發炎較重、骨支持喪失較多","v":"ok","now":"仍適用。長期無對咬的牙齒當支台齒時，用暫時假牙漸進給力是合理的臨床做法（教學建議，原文沒有給力實驗）。"},{"c":"共同破壞假說（動物實驗）","old":"咬合創傷是牙周炎的協同加速因子","v":"upd","now":"已更新。分子層次補充 RANKL 上調與韌帶附著點剛度梯度突變等機制（Passanezi 2019；Lin 2020），但都來自動物模型；植體方面，清潔良好下過載未造成去骨整合（Chambrone 2010，2 篇高偏誤動物研究）。"}],"numbers":[{"k":"2.2 vs 0.8 mm","d":"Lindhe & Svanberg 1974：組織學附連喪失，牙周炎加搖放力 vs 只有牙周炎（p < 0.05）；牙周韌帶面積 3.3 倍"},{"k":"49.0 / 78.8","d":"Lindhe & Svanberg 1974：測試齒 Day 180 動搖度 T100 / T500（Day 0 為 10.0 / 16.5，p < 0.001）"},{"k":"39.6% vs 41.7%","d":"Lindhe & Ericsson 1982：Day 360 附連喪失比例，去除搖放力 vs 持續搖放力（NS）"},{"k":"50.0 → 14.3","d":"Lindhe & Ericsson 1982：去除搖放力後 T500 動搖度（Day 90 → Day 360）；對照側 39.4"},{"k":"206 vs 506 µm","d":"Lindhe & Ericsson 1982：牙周韌帶腔寬度，去除搖放力 vs 持續搖放力（p < 0.01）"},{"k":"315–875 µm","d":"Lindhe & Ericsson 1982：移除結紮線後，兩側菌斑與骨頂之間的非浸潤結締組織帶寬度"},{"k":"0.070 vs 0.119 mm","d":"Pihlstrom & Ramfjord 1971：腭側牙周韌帶寬度，廢用齒 vs 功能齒（p < 0.01）；5 隻恆河猴、521 張切片"},{"k":"0.4 mm","d":"Burgett 1992 RCT（Fan & Caton 2018 引述）：牙周治療配合咬合調整多獲得的平均 CAL"},{"k":"6.0 vs 5.5 mm","d":"Chambrone 2010 引述 Kozlovsky 2007：植體周圍炎加咬合過載 vs 只有發炎的骨吸收距離（DIB）"},{"k":"3000 microstrains","d":"Delgado-Ruiz 2019：超過此應變，植體周圍骨開始出現微骨折與骨吸收"}],"clinical":{"steps":["先檢查邊緣牙齦：BoP、PPD、CAL，確認發炎是否已進入共同破壞區（Glickman 1963）","評估咬合創傷替代指標：Fremitus、進行性動搖度、早接觸／干擾、磨耗面、牙齒移位、牙齒斷裂、X 光牙周韌帶腔增寬（Fan & Caton 2018）","區分原發性（支持正常、適應性動搖）與次發性（支持減少、進行性動搖）","有發炎先做非手術牙周治療；嚴重干擾可先粗修磨，細修咬合等發炎控制後","次發性且進行性動搖、影響舒適度者，可考慮牙周固定術（Jepsen 2018，專家意見）；原發性不做固定","植體：BoP／化膿陰性時調整咬合高點並追蹤；陽性先處理植體周圍炎（Chambrone 2010）"],"cases":[{"h":"次發性咬合創傷（教學模擬）","b":"45 歲，46 近心 PPD 7 mm、CAL 6 mm、出血、2 度進行性動搖與 Fremitus，近心角狀骨缺損。先全口 SRP 與粗修磨，45–47 暫時固定以提升舒適度（Jepsen 2018），再評估後考慮再生手術。"},{"h":"原發性咬合創傷（教學模擬）","b":"38 歲，26 新做全瓷冠 2 週後咀嚼痛與冷熱敏感，PPD ≤ 3 mm、無出血、1 度動搖、牙周韌帶腔輕微增寬。修磨高點、消除側方干擾後追蹤，不做牙周手術或固定（Fan & Caton 2018）。"},{"h":"病理性牙齒移位（教學模擬）","b":"52 歲 Stage IV Grade C，前牙扇形散開、2–3 度動搖。先控制發炎，再暫時固定、會診齒顎矯正以輕力收縫，最後長期舌側固定或補綴重建。發炎未控制前不啟動矯正。"}]},"debates":["人類證據不足：咬合創傷加速牙周炎的證據幾乎都來自動物模型，Jepsen 2018 指出人類沒有證據；Fan & Caton 2018 評為 weak evidence。","去除咬合創傷能否改善牙周治療結果，只有 Burgett 1992 一篇 RCT（多 0.4 mm CAL），共識認為臨床證據不足。","「減少的牙周支持」很難定義，控制研究中沒有區分正常與減少支持的標準；只有動搖度呈進行性時才有意義（Fan & Caton 2018；Jepsen 2018）。","牙周固定術以提升舒適度屬專家意見，不是 RCT 實證（Jepsen 2018）。","楔狀缺損（abfraction）主要來自有限元素分析，臨床研究不支持咬合力造成楔狀缺損或牙齦萎縮（Fan & Caton 2018）。","植體咬合過載只有 2 篇高偏誤動物研究，Chambrone 2010 結論為證據有限且不一致。"],"quiz":[{"q":"依 Glickman 1963，咬合力不會影響哪個區域？","o":["刺激區（邊緣牙齦與牙間乳突）","共同破壞區","牙周韌帶","齒槽骨頂"],"a":0,"e":"刺激區的病變完全由菌斑引起；咬合力只在發炎進入共同破壞區後才有協同作用。"},{"q":"Lindhe & Svanberg 1974 中，牙周炎加搖放力組與只有牙周炎組的組織學附連喪失分別約為？","o":["4.9 mm 與 2.1 mm","2.2 mm 與 0.8 mm","0.8 mm 與 2.2 mm","沒有差異"],"a":1,"e":"組織學附連喪失 2.2 vs 0.8 mm（p < 0.05）；4.9 vs 2.1 mm 是 X 光缺口到骨的距離。"},{"q":"Lindhe & Ericsson 1982 去除搖放力後，下列何者正確？","o":["附連明顯增加","動搖度不變","動搖度下降、牙周韌帶腔恢復，但附連沒有增加","出現新骨沉積與附連獲得"],"a":2,"e":"Day 360 附連喪失 39.6% vs 41.7%，NS；原文沒有報告新骨或附連獲得。"},{"q":"2017 World Workshop 對創傷性咬合力的結論，何者正確？","o":["會單獨造成附連喪失","沒有證據顯示會加速人類牙周炎進展","會造成牙齦萎縮","會造成非齲齒性頸部病灶"],"a":1,"e":"Jepsen 2018：沒有證據支持單獨造成附連喪失、NCCL 或牙齦萎縮，也沒有證據顯示加速人類牙周炎；動物模型可能增加骨喪失。"},{"q":"牙周支持正常的牙齒因新假牙過高出現 1 度動搖與咀嚼痛，最適當的處置是？","o":["牙周固定術","牙周翻瓣手術","修磨高點、消除干擾後追蹤","拔除後植牙"],"a":2,"e":"原發性咬合創傷是適應性動搖，處理咬合即可，不需要固定或手術。"},{"q":"Chambrone 2010 整理的動物研究中，清潔良好的植體承受咬合過載，結果為何？","o":["全部去骨整合","PD 增加 5 mm","骨吸收較發炎組更多","未發生去骨整合"],"a":3,"e":"無牙菌斑發炎下過載未造成去骨整合；過載加植體周圍炎時骨吸收較多（DIB 6.0 vs 5.5 mm）。只有 2 篇高偏誤研究。"}],"lit":[{"a":"Glickman I","y":"1963","t":"Inflammation and trauma from occlusion, co-destructive factors in chronic periodontal disease","j":"J Periodontol","pm":"","r":"classic","s":0,"src":""},{"a":"Pihlstrom & Ramfjord","y":"1971","t":"Periodontal effect of nonfunction in monkeys","j":"J Periodontol","pm":"5000895","r":"classic","s":0,"src":""},{"a":"Lindhe & Svanberg","y":"1974","t":"Influence of trauma from occlusion on progression of experimental periodontitis in the beagle dog","j":"J Clin Periodontol","pm":"4532114","r":"classic","s":0,"src":""},{"a":"Lindhe & Ericsson","y":"1982","t":"The effect of elimination of jiggling forces on periodontally exposed teeth in the dog","j":"J Periodontol","pm":"6957593","r":"classic","s":0,"src":""},{"a":"Chambrone et al.","y":"2010","t":"Effects of occlusal overload on peri-implant tissue health: a systematic review of animal-model studies","j":"J Periodontol","pm":"20507230","r":"new","s":1,"src":"JP"},{"a":"Passanezi & Sant'Ana","y":"2019","t":"Role of occlusion in periodontal disease","j":"Periodontol 2000","pm":"30892765","r":"new","s":1,"src":"Perio 2000"},{"a":"Delgado-Ruiz et al.","y":"2019","t":"Effects of occlusal forces on the peri-implant-bone interface stability","j":"Periodontol 2000","pm":"31407438","r":"new","s":0,"src":"Perio 2000"},{"a":"Lin et al.","y":"2020","t":"Biomechanical pathways of dentoalveolar fibrous joints in health and disease","j":"Periodontol 2000","pm":"31850635","r":"new","s":0,"src":"Perio 2000"},{"a":"Jepsen et al.","y":"2018","t":"Periodontal manifestations of systemic diseases and developmental and acquired conditions: Consensus report of workgroup 3 of the 2017 World Workshop on the Classification of Periodontal and Peri-Implant Diseases and Conditions","j":"J Clin Periodontol","pm":"29926500","r":"cons","s":0,"src":""},{"a":"Fan & Caton","y":"2018","t":"Occlusal trauma and excessive occlusal forces: Narrative review, case definitions, and diagnostic considerations","j":"J Clin Periodontol","pm":"29926498","r":"cons","s":0,"src":""},{"a":"Albandar et al.","y":"2018","t":"Manifestations of systemic diseases and conditions that affect the periodontal attachment apparatus: Case definitions and diagnostic considerations","j":"J Clin Periodontol","pm":"29926486","r":"rel","s":0,"src":"","at":7}]},"14":{"status":"draft","statusNote":"數字與摘要經教師核實，書目依 PubMed 更正（2026-10-24）","oneLine":"動搖度是預後風險指標，不是拔牙理由：先以非手術治療控制發炎、再評估動搖度；牙周固定術不會提升動搖齒存活，價值在可能改善舒適度與咀嚼，以及再生手術前穩定牙齒，證據都有限。","takeHome":[{"h":"動搖不等於拔牙","b":"Peditto 2024：拔除／喪失風險 TM1 vs TM0 HR 1.96、TM2 vs TM0 HR 7.12，但追蹤 10–25 年 TM1 仍有 88.2%、TM2 有 59.7% 留存。Fleszar 1980：動搖齒的 CAL 獲得較少，但可以成功治療並維持。"},{"h":"先控制發炎，再評估動搖度","b":"Kerry 1982：初始治療（SRP、口腔衛生指導、咬合調整）後 1 個月，四組無動搖牙比例由 38.6–42.8% 升到 46.4–48.4%；囊袋消除骨手術後暫時變晃，1 年內恢復。"},{"h":"牙周固定術的定位","b":"Dommisch 2021：牙周固定術不提升動搖齒存活（喪失 8.4% vs 10.1%，低證據）。EFP S3 R6.1／R6.2：為了舒適度可考慮臨時或長期牙周固定術（Grade O）。Schulz 2000：再生手術前固定 CAL 獲得 5.1 mm，未固定 1.7 mm。"}],"compare":[{"c":"Fleszar et al. 1980","old":"基線動搖度越高，治療後 CAL 獲得越少；但動搖齒仍可成功治療並維持","v":"cond","now":"需加條件。以初診動搖度分組，可能混有發炎成分；應在發炎控制後再評估動搖度（Peditto 2024 建議每個治療步驟後重新評估）。"},{"c":"Kerry et al. 1982","old":"初始非手術治療後動搖度下降；囊袋消除骨手術造成暫時性動搖，1 年恢復","v":"ok","now":"仍適用。但無法區分消炎與咬合調整各自的貢獻；Periotest 主要反映骨支持量，不能直接取代傳統動搖度評估（Hallmon 2004）。"},{"c":"Schulz et al. 2000","old":"骨移植再生手術前預先牙周固定術，CAL 獲得最高","v":"cond","now":"需加條件。每組 11–12 人、只用珊瑚碳酸鈣，術前與拆線時固定的差異不顯著；用於 EMD 或 GTR 缺乏直接驗證，Herrera 2022 也只寫牙周固定術「可能有益」。"},{"c":"Cortellini et al. 2001","old":"基線動搖度（PTU）越高，GTR 1 年 CAL 獲得越少","v":"cond","now":"需加條件。動搖度是觀察到的共變項，不是隨機介入；作者強調需要對照介入研究確認降低動搖度是否有益。"},{"c":"牙周固定術可防止動搖齒喪失（傳統觀念）","old":"動搖齒做牙周固定術可以延長牙齒壽命","v":"upd","now":"已更新。Dommisch 2021：牙周固定術不提升動搖齒存活；EFP S3 R6.1／R6.2 只為舒適度考慮牙周固定術，證據極低、Grade O（Herrera 2022）。"}],"numbers":[{"k":"2.31 vs 1.20 mm","d":"Fleszar 1980：PPD 7–12 mm 位點第 8 年 CAL 獲得，M0 vs M2（第 8 年差異未達顯著，第 1–7 年達顯著）；82 位病人、1,974 顆牙"},{"k":"38.6–42.8% → 46.4–48.4%","d":"Kerry 1982：初始治療後 1 個月，四組無動搖（M0）牙齒比例（p < 0.05）；93 位病人、2,421 顆牙"},{"k":"5.1 vs 1.7 mm","d":"Schulz 2000：48 週 CAL 獲得，術前固定 vs 未固定；拆線時固定 3.5 mm、單純清創 0.6 mm"},{"k":"−0.03 mm/PTU","d":"Cortellini 2001：多變項分析中基線動搖度對 1 年 CAL 獲得的參數估計（p = 0.036）；112 位病人"},{"k":"8.4% vs 10.1%","d":"Dommisch 2021：非手術治療後 ≥ 2 年牙齒喪失，牙周固定術組（26/311）vs 未固定（156/1,541）；2 篇回溯性病例系列"},{"k":"25.6%／75.3%","d":"Dommisch 2021：夾板斷裂或脫黏，3 年／追蹤 2–32.4 年"},{"k":"0.4 mm","d":"Dommisch 2021 引述 Burgett 1992：咬合調整 2 年 CAL 多獲得的平均值，動搖度與 PPD 無差異"},{"k":"HR 1.96／7.12","d":"Peditto 2024：拔除／喪失風險，TM1 vs TM0、TM2 vs TM0；TM2 vs TM1 為 2.85；11 篇研究、追蹤 10–25 年"},{"k":"88.2%／59.7%","d":"Peditto 2024：TM1／TM2 牙齒長期留存比例"}],"clinical":{"steps":["初診記錄 PPD、CAL、BoP、Miller 動搖度與 Fremitus，並以 X 光評估骨喪失與牙周韌帶腔","區分原發性咬合創傷、次發性咬合創傷與急性發炎引起的動搖（Hallmon 2004；Fan & Caton 2018）","先做 EFP 第 1–2 步（相當於 Phase I Therapy）；動搖影響舒適度或咀嚼時可同時做臨時牙周固定術（Herrera 2022 R6.1）","再評估時重新測量動搖度，不以初診動搖度判定拔牙（Peditto 2024）","計畫再生手術且牙齒明顯動搖時，可考慮術前牙周固定術（Schulz 2000；證據有限）","牙周治療後仍持續或漸增過度動搖者可考慮長期牙周固定術（R6.2）；矯正後用永久固定式被動保持器（R7.8）","SPT 時檢查夾板有無脫黏或斷裂，並確認牙間刷能通過"],"cases":[{"h":"下顎門齒嚴重動搖伴咀嚼痛（教學模擬）","b":"55 歲 Stage IV Grade C，31、32、41、42 二到三度動搖、PPD 6–8 mm。第 1–2 步非手術治療，同時做 33–43 纖維強化樹脂夾板做臨時牙周固定術以改善咀嚼（R6.1）；牙周固定術不會提升牙齒存活（Dommisch 2021）。"},{"h":"正中門齒骨內缺損再生術前固定（教學模擬）","b":"42 歲，11 PPD 8 mm、CAL 9 mm、窄深 2 壁骨內缺損、二度動搖。EMD 再生手術前先做 12–22 鋼絲樹脂夾板（Schulz 2000；Cortellini 2001），提前多久固定沒有文獻依據。"},{"h":"前牙病理性移位（教學模擬）","b":"48 歲，上顎正中門齒唇側移位、間隙擴大。先達到牙周治療終點（無 PPD 5 mm 合併出血、無 PPD ≥ 6 mm；R7.2），再以輕力矯正關閉間隙，最後黏舌側永久固定式保持器並終身追蹤（R7.8）。"}]},"debates":["牙周固定術對病人舒適度與生活品質的效果，Dommisch 2021 納入的研究都沒有評估 OHRQoL；只有一篇初步 RCT（Sonnenschein 2021）顯示兩組 OHIP-14 都改善。","Schulz 2000 是單一小型研究、單一材料，術前固定的效果能否推到 EMD 或 GTR 仍不清楚；何時拆除夾板也沒有定論。","Peditto 2024 的納入研究多半沒有說明拔牙原因，無法區分病程造成的喪失與醫師決定的拔除；動搖度可能影響醫師拔牙的決定。","Fleszar 1980 以初診動搖度分組，可能混有發炎成分；作者沒有在發炎控制後單獨重新分組。","咬合調整只有 Burgett 1992 一篇 RCT（CAL 多 0.4 mm），對牙齒存活的效果不明（Dommisch 2021）。","微創翻瓣（MIST／SFA）對動搖的耐受度沒有直接證據。"],"quiz":[{"q":"Peditto 2024 中，TM2 相較 TM0 的拔除／喪失風險（HR）約為？","o":["1.96","2.85","7.12","1.00"],"a":2,"e":"TM2 vs TM0 HR 7.12；TM1 vs TM0 1.96；TM2 vs TM1 2.85。但 TM2 仍有 59.7% 長期留存。"},{"q":"Kerry 1982 中，哪一種處置術後 1 個月動搖度暫時顯著增加？","o":["改良式 Widman 翻瓣術","囊袋消除骨手術","齦下刮除術","初始衛生治療"],"a":1,"e":"囊袋消除骨手術後 1 個月 M0 比例下降、M2 上升，1 年內回到術前水準；mWF 與刮除術沒有顯著惡化。"},{"q":"Dommisch 2021 對牙周固定術的結論為何？","o":["不會提升進展期牙周炎動搖齒的存活","可大幅降低拔牙率","可改善 PPD 與 CAL","可取代非手術治療"],"a":0,"e":"牙周固定術組牙齒喪失 8.4% vs 未固定 10.1%，證據等級低；價值在可能改善舒適度。"},{"q":"Schulz 2000 中，術前牙周固定術組 48 週 CAL 獲得為？","o":["3.5 mm","1.7 mm","5.1 mm","0.6 mm"],"a":2,"e":"術前固定 5.1 mm、拆線時固定 3.5 mm（差異不顯著）、未固定 1.7 mm、單純清創 0.6 mm。"},{"q":"病人全口 SRP 後 1 週，下顎前牙仍二度動搖，最適當的做法是？","o":["立即拔除","等再評估時重新量測動搖度","立即做長期牙周固定術","全口咬合磨改"],"a":1,"e":"組織仍在修復期，應在再評估（一般 6–12 週，教學建議）時重新評估；Peditto 2024 也指出積極治療前的輕度動搖不增加拔牙風險。"},{"q":"EFP S3 指引 R6.2（長期牙周固定術）的建議等級為何？","o":["Grade A，高證據","Grade B，專家共識","不建議","Grade O，證據品質極低"],"a":3,"e":"R6.1 與 R6.2 都是證據品質極低、Grade O、全體共識，目的是提升舒適度；R5.3 維持齒弓完整性才是 Grade B 專家共識。"}],"lit":[{"a":"Fleszar et al.","y":"1980","t":"Tooth mobility and periodontal therapy","j":"J Clin Periodontol","pm":"6938529","r":"classic","s":0,"src":""},{"a":"Kerry et al.","y":"1982","t":"Effect of periodontal treatment on tooth mobility","j":"J Periodontol","pm":"6754904","r":"classic","s":0,"src":""},{"a":"Schulz et al.","y":"2000","t":"The effect of splinting of teeth in combination with reconstructive periodontal surgery in humans","j":"Clin Oral Investig","pm":"11218508","r":"classic","s":0,"src":""},{"a":"Cortellini et al.","y":"2001","t":"The simplified papilla preservation flap in the regenerative treatment of deep intrabony defects: clinical outcomes and postoperative morbidity","j":"J Periodontol","pm":"11811506","r":"classic","s":0,"src":""},{"a":"Hallmon & Harrel","y":"2004","t":"Occlusal analysis, diagnosis and management in the practice of periodontics","j":"Periodontol 2000","pm":"14717861","r":"new","s":1,"src":"Perio 2000"},{"a":"Dommisch et al.","y":"2021","t":"Efficacy of tooth splinting and occlusal adjustment in patients with periodontitis exhibiting masticatory dysfunction: A systematic review","j":"J Clin Periodontol","pm":"34854115","r":"new","s":1,"src":"JCP"},{"a":"Peditto et al.","y":"2024","t":"Influence of mobility on the long-term risk of tooth extraction/loss in periodontitis patients. A systematic review and meta-analysis","j":"J Periodontal Res","pm":"38766764","r":"new","s":0,"src":"JPR"},{"a":"Fan & Caton","y":"2018","t":"Occlusal trauma and excessive occlusal forces: Narrative review, case definitions, and diagnostic considerations","j":"J Clin Periodontol","pm":"29926498","r":"rel","s":0,"src":"","at":13},{"a":"Herrera et al.","y":"2022","t":"Treatment of stage IV periodontitis: The EFP S3 level clinical practice guideline","j":"J Clin Periodontol","pm":"35688447","r":"rel","s":0,"src":"","at":12}]},"15":{"status":"draft","statusNote":"依教師完成之大綱與內文整理；數字經原文 PDF 核對，書目依 PubMed 更正（2026-10-25）","oneLine":"自我照護負責齦上與淺溝的生物膜：刷牙最深只到齦緣下約 0.9 mm，深囊袋要靠專業清創；開放牙間隙首選牙間刷，電動牙刷可作為替代，行為介入的證據仍不足。","takeHome":[{"h":"牙間刷是開放牙間隙的首選","b":"EFP S3 R4.6：解剖可行時刷牙應加用牙間刷（Grade A，4 篇 RCT）；牙線不建議為第一選擇（R4.7，Grade B）。Tu 2008：牙間刷降低 PPD 約九成經由牙菌斑清除（間接效應 0.24 mm），壓迫牙間乳突的直接效應很小。"},{"h":"刷牙有物理極限","b":"Waerhaug 1981：貝氏刷牙法刷毛最深到齦緣下約 0.9 mm。PPD ≥ 5 mm 的囊袋中下段只能靠 Phase I Therapy 的齦下清創與 SPT 的 PMPR（Arweiler 2017）。"},{"h":"行為改變要有，但別高估","b":"EFP S3 R1.3：心理行為介入未顯示顯著效果；Carra 2020、O'Malley 2026 證據確定性極低。Toniazzo 2019 的 mHealth 效果主要來自青少年，唯一成人研究未達顯著。"}],"compare":[{"c":"Lang et al. 1973","old":"每 48 小時徹底清除牙菌斑一次即可維持牙齦健康","v":"cond","now":"需加條件。樣本是 32 位口腔衛生極佳的牙醫學生、只看健康牙齦；不能外推到牙周炎病人，臨床仍建議每日刷牙 2 次加每日牙間清潔。"},{"c":"Waerhaug 1981","old":"貝氏刷牙法刷毛可達齦緣下 0.9 mm，預防該範圍內的齦下牙菌斑","v":"cond","now":"需加條件。猴子組織學研究，刷牙側齦緣下仍有細胞浸潤；PPD ≥ 5 mm 的囊袋刷牙到不了，深囊袋必須專業清創（Arweiler 2017）。"},{"c":"Tu et al. 2008","old":"牙間刷降低 PPD 主要經由牙菌斑清除，而非壓迫牙間乳突","v":"ok","now":"仍適用。間接效應 0.24 mm（P = 0.08）、直接效應 0.02 mm（P = 0.895）；支持 EFP S3 將牙間刷列為首選（R4.6）。"},{"c":"Joshi et al. 2017","old":"每日刷牙 ≥ 2 次 11 年間少產生 1.99 顆有 PPD ≥ 4 mm 的牙","v":"ok","now":"仍適用。刷牙頻率為問卷自我報告，可能高估，但劑量反應與累積保護效果可用於衛教激勵。"},{"c":"Yaacob et al. 2014","old":"電動牙刷減少牙菌斑與牙齦炎優於手動","v":"cond","now":"需加條件。統計上優於手動（> 3 個月牙菌斑少 21%、牙齦炎少 11%），作者認為臨床重要性不明；EFP S3 R4.5 只建議電動牙刷可作為替代（Grade 0）。"}],"numbers":[{"k":"0.9 mm","d":"Waerhaug 1981：貝氏刷牙法刷毛最深可到齦緣下的深度（猴子模型）"},{"k":"48 小時","d":"Lang 1973：每 48 小時以內完全清除牙菌斑，GI 維持在 0.08–0.25；32 位牙醫學生"},{"k":"0.26 / 0.24 mm","d":"Tu 2008：牙間刷比牙線多降低 PPD 0.26 mm，其中經由牙菌斑清除的間接效應 0.24 mm（P = 0.08）；77 位慢性牙周炎病人"},{"k":"1.99 顆","d":"Joshi 2017：每日刷牙 ≥ 2 次者 11 年間少產生的 PPD ≥ 4 mm 牙數；1,025 位芬蘭成人"},{"k":"11%／21%","d":"Yaacob 2014：電動牙刷 1–3 個月與 > 3 個月減少牙菌斑的比例（牙齦炎 6%／11%）；56 篇 RCT、5,068 人"},{"k":"64.7%／27.4%","d":"Kotsakis 2018：牙間刷與沖牙機在降低 GI 上成為最佳輔具的機率；22 篇試驗、10 種方式的網路統合分析"},{"k":"SMD −7.98／−4.45","d":"Toniazzo 2019：mHealth 降低牙菌斑與牙齦出血，證據確定性極低，效果主要見於青少年"},{"k":"BoP < 10%","d":"Chapple 2018：臨床牙齦健康門檻；完整牙周組織 PPD ≤ 3 mm，減少牙周組織 PPD ≤ 4 mm 且無探測出血"}],"clinical":{"steps":["檢查 PPD、CAL、BoP、FMPS、牙間乳突退縮程度與手部靈巧度","主刷：手動或電動皆可，手部靈巧度不足或手動刷牙無法達標者可改電動牙刷（R4.5）","牙間輔具依牙間隙開放度選擇：解剖可行時首選牙間刷並選對尺寸（R4.6）；牙間乳突完整時用牙線或極小號牙間刷","告知病人刷牙只到齦緣下約 0.9 mm，殘留深囊袋需專業清創或 SPT 的 PMPR","低依從性病人可嘗試動機談話、目標設定與 mHealth 提醒，但要知道證據仍不足","自我口腔衛生未達標者不建議進行手術（R3.6）"],"cases":[{"h":"完整牙周組織的牙齦炎（教學模擬）","b":"28 歲，PPD ≤ 3 mm、無 CAL、BoP 22%、牙間乳突完整。每日 2 次刷牙（貝氏刷牙法），牙間用牙線或極小號牙間刷，2 週後再評估（Chapple 2018）。"},{"h":"Stage III 牙周炎治療後開放牙間隙（教學模擬）","b":"52 歲，Phase I Therapy 後牙間乳突退縮，殘留 PPD 5 mm 無 BoP。改用個體化尺寸牙間刷（R4.6），殘留囊袋納入 SPT 每 3 個月 PMPR。"},{"h":"吸菸、低依從性的 SPT 病人（教學模擬）","b":"45 歲吸菸者，FMPS > 50%、BoP 28%。吸菸會抑制 BoP 表現（Tu 2008）；導入動機談話與小目標、mHealth 提醒與一對一衛教，並說明這些方法的證據仍有限。"}]},"debates":["Tu 2008 的間接效應 P = 0.08，未達傳統顯著水準；「九成經由牙菌斑清除」是點估計，解讀要保守。","電動牙刷的統計優勢是否有臨床意義仍不明確（Yaacob 2014），EFP S3 只給 Grade 0。","行為改變技術與 mHealth 對成人牙周炎病人的長期效果證據不足（Carra 2020；O'Malley 2026；Toniazzo 2019）。","Kotsakis 2018 納入的研究多數沒有報告牙周狀態，結果能否推到牙周炎病人仍有疑問。"],"quiz":[{"q":"Waerhaug 1981 中，貝氏刷牙法刷毛最深可達齦緣下約多少？","o":["0.5 mm","0.9 mm","2 mm","3 mm"],"a":1,"e":"約 0.9 mm（猴子組織學研究），因此 PPD ≥ 5 mm 的囊袋中下段要靠專業清創。"},{"q":"Tu 2008 中，牙間刷降低 PPD 的主要機轉是？","o":["壓迫牙間乳突","牙齦萎縮","牙菌斑清除後發炎消退","刺激角化"],"a":2,"e":"間接效應（經由牙菌斑清除）0.24 mm，直接效應僅 0.02 mm 且不顯著。"},{"q":"EFP S3 對牙間刷的建議（R4.6）為？","o":["Grade 0","專家共識 Grade B","實證 Grade A","不建議"],"a":2,"e":"解剖可行時刷牙應加用牙間刷，實證 Grade A；牙線不建議為第一選擇（R4.7）。"},{"q":"EFP S3 對電動牙刷的建議為？","o":["必須使用（Grade A）","可考慮作為替代（Grade 0）","不建議","優於牙間刷"],"a":1,"e":"R4.5：電動牙刷可作為手動牙刷的替代，Grade 0。"},{"q":"Chapple 2018 中，減少牙周組織（穩定牙周炎病人）的臨床牙齦健康定義是？","o":["BoP < 30%、PPD ≤ 5 mm","BoP < 10%、PPD ≤ 4 mm 且無探測出血","BoP = 0、PPD ≤ 3 mm","只看 CAL"],"a":1,"e":"完整牙周組織為 BoP < 10% 且 PPD ≤ 3 mm；減少牙周組織 PPD ≤ 4 mm 且該處無探測出血。"},{"q":"關於 Toniazzo 2019 的 mHealth 統合分析，何者正確？","o":["成人效果最明顯","證據確定性高","效果主要見於青少年，證據確定性極低","可取代面對面衛教"],"a":2,"e":"唯一成人研究未達顯著，數位工具只能作為輔助。"}]},"16":{"status":"draft","statusNote":"依教師完成之大綱與內文整理；數字經原文 PDF 核對，書目依 PubMed 更正（2026-10-25）","oneLine":"根面清創的目標是清除牙結石、打碎生物膜，不是把牙骨質刨到玻璃般平滑：內毒素只弱附著在表面，保留牙骨質癒合相近，過度刮刨反而損失齒質、增加敏感。","takeHome":[{"h":"從 root planing 到 debridement","b":"Heitz-Mayfield & Lang 2013：故意刨除牙骨質屬於應淘汰的觀念，非手術治療核心是破壞齦下生物膜。Nyman 1988（翻瓣直視下）保留牙骨質與徹底刨除獲得相近的附連獲得。"},{"h":"工具效果相近，超音波省時","b":"Tunkel 2002：單根牙手用與機械式工具臨床結果未見差異（證據不強）；2 篇研究統合顯示機械式節省 36.6% 時間。EFP S3 R2.2：手用或電動皆可（Grade A）。多根牙缺乏證據。"},{"h":"盲刮有極限，別過度治療","b":"Waerhaug 1978：囊袋 > 5 mm 清除生物膜失敗率 89%；殘留 PPD ≥ 6 mm 考慮翻瓣（R3.1）。Zappa 1991：刮 40 下可去除 148–343 μm 齒質，SPT 穩定位點勿反覆深刮。"}],"compare":[{"c":"Waerhaug 1978","old":"囊袋越深，盲刮清除生物膜越容易失敗（< 3 mm 成功 83%，> 5 mm 失敗 89%）","v":"cond","now":"需加條件。解剖限制仍成立，但治療目標已從解剖性囊袋消除轉為囊袋閉合（PPD ≤ 4 mm 且無 BoP）；殘留 ≥ 6 mm 考慮翻瓣，4–5 mm 重複器械治療（Sanz 2020 R3.1）。"},{"c":"Jones & O'Leary 1978","old":"徹底牙根整平可把病變牙根內毒素降到接近健康智齒，主張刨除病變牙骨質","v":"upd","now":"已更新。LAL 檢定具非特異性，且內毒素只弱附著於表面；不需刮到玻璃般平滑即可去除（Heitz-Mayfield & Lang 2013）。"},{"c":"Nishimine & O'Leary 1979","old":"手用刮刀去除內毒素優於超音波（2.09 vs 16.8 ng/ml）","v":"upd","now":"已更新。原文未做統計、終點是根面 LPS；以臨床指標而言單根牙兩種工具未見差異（Tunkel 2002），細長超音波工作頭可改善根岔可及性（Krishna 2016）。"},{"c":"Nyman et al. 1988","old":"保留牙骨質與徹底刨除獲得相近的附連獲得與囊袋減少","v":"ok","now":"仍適用。原研究為翻瓣手術、11 位病人，組間未做統計檢定；延伸到非手術清創屬觀念推論。"},{"c":"Zappa et al. 1991","old":"高施力刮 40 下去除 343 μm、低施力 149 μm 齒質","v":"cond","now":"需加條件。體外研究；作者推論刮刀變鈍後效率下降、施力增加，反覆刮刨可能接近牙髓。"},{"c":"Fogel & Pashley 1993","old":"牙根整平形成酸不穩定抹除層，酸蝕後牙本質通透性恢復；草酸鹽可封閉小管","v":"ok","now":"仍適用。可解釋術後牙本質過敏的機轉；含氟化物或磷酸鈣的去敏感劑本堂文獻未評估。"}],"numbers":[{"k":"83%／39%／89%","d":"Waerhaug 1978：囊袋 < 3 mm 生物膜清除成功率 83%、3–5 mm 39%，> 5 mm 失敗率 89%"},{"k":"146.8 → 1.2–1.5 ng","d":"Jones & O'Leary 1978：病變牙根內毒素，體內牙根整平後接近未萌出智齒（0.25 ng）"},{"k":"2.09 vs 16.8 ng/ml","d":"Nishimine & O'Leary 1979：手用刮刀與超音波處理後殘留內毒素（未做統計檢定）"},{"k":"148.7／343.3 μm","d":"Zappa 1991：低施力（3.04 N）與高施力（8.48 N）刮 40 下累積去除的齒質深度（體外）"},{"k":"64.5–70.6%","d":"Fogel & Pashley 1993：牙根整平形成抹除層後牙本質通透性下降幅度；3% 草酸鹽處置下降 64.6–86.7%"},{"k":"36.6%","d":"Tunkel 2002：音波／超音波比手用刮刀節省的操作時間（P = 0.0002，僅 2 篇研究）"},{"k":"13 篇／4 篇（50 人）","d":"Tunkel 2002：納入研究數與報告臨床結果的研究數；無法進行臨床指標統合分析"},{"k":"58% ≤ 0.75 mm","d":"Bower 1979（引述）：大臼齒根岔入口寬度，刮刀刀面寬 0.75–1.10 mm"}],"clinical":{"steps":["以清除牙結石、打碎生物膜為終點，不追求玻璃般平滑","先用細長型超音波工作頭（中低功率、充足水流）全面清創，再以銳利 Gracey 刮刀少量修飾殘留牙結石","根岔與根面凹陷優先使用細長彎曲型超音波工作頭","再評估：PPD ≤ 4 mm 且無 BoP 即達囊袋閉合；殘留 ≥ 6 mm 考慮翻瓣，4–5 mm 重複齦下器械治療（R3.1）","SPT 穩定位點只做輕度齦下清創或拋光，避免反覆深刮","術前告知術後敏感，必要時做草酸鹽等去敏感處置；定期磨利刮刀避免施力過大"],"cases":[{"h":"單根牙深囊袋術後敏感（教學模擬）","b":"41 歲，21 唇側 PPD 7 mm、CAL 8 mm。超音波細工作頭為主、少量刮刀修飾；術後 1 週冷熱敏感，依 Fogel & Pashley 1993 的機轉做去敏感封閉處置。"},{"h":"46 Class II 根岔侵犯（教學模擬）","b":"52 歲，頰側 PPD 6 mm 伴 BoP。刮刀進不去根岔入口，改用彎曲細長超音波工作頭；再評估若持續發炎，評估翻瓣或再生治療。"},{"h":"SPT 反覆深刮造成齒頸凹陷（教學模擬）","b":"60 歲，SPT 5 年，16 PPD 3 mm、BoP-，每次都做深度牙根整平導致牙骨質喪失與冷敏感。依 Zappa 1991 與 Nyman 1988，改為齦下生物膜清除與拋光。"}]},"debates":["Nyman 1988 是翻瓣直視下的研究，結論延伸到非手術盲刮屬於推論；原文以圖呈現，未報告組間統計。","多根牙（根岔位點）手用與機械式工具的臨床比較證據仍缺乏（Tunkel 2002）。","超音波留下的根面較粗糙，粗糙度的臨床意義仍無定論（Krishna 2016）。","Zappa 1991 為體外研究，「反覆刮刨可能接近牙髓」是作者推測。"],"quiz":[{"q":"Waerhaug 1978 中，囊袋 > 5 mm 時盲刮清除生物膜的失敗率約為？","o":["17%","39%","61%","89%"],"a":3,"e":"< 3 mm 成功 83%，3–5 mm 成功 39%，> 5 mm 失敗 89%。"},{"q":"Nyman 1988 的實驗組如何處理牙根面？","o":["刨除牙骨質至硬滑牙本質","橡皮杯拋光，牙結石以刮刀小心剝除、盡量保留牙骨質","只用雷射","只用抗生素"],"a":1,"e":"翻瓣後分口實驗，保留牙骨質與徹底刨除獲得相近的附連獲得。"},{"q":"Tunkel 2002 統合分析顯示機械式清創可節省多少操作時間？","o":["10%","36.6%","50%","沒有差異"],"a":1,"e":"36.6%（P = 0.0002），但只有 2 篇研究；臨床指標無法統合分析。"},{"q":"EFP S3 R2.2 對齦下清創工具的建議是？","o":["只能用手用刮刀","只能用超音波","手用或電動單獨或合併皆可","依病人年齡選擇"],"a":2,"e":"Grade A，4 篇 RCT、132 人，臨床結果無顯著差異。"},{"q":"Zappa 1991 中，高施力刮 40 下累積去除的齒質約為？","o":["34 μm","149 μm","343 μm","1 mm"],"a":2,"e":"高施力 343.3 μm、低施力 148.7 μm（體外研究）。"},{"q":"依 Fogel & Pashley 1993，牙根整平後出現冷熱敏感的主要機轉是？","o":["牙髓壞死","抹除層遇酸溶解，牙本質小管暴露、通透性上升","牙齦增生","牙骨質增厚"],"a":1,"e":"抹除層為酸不穩定，酸蝕後通透性恢復；草酸鹽可形成耐酸結晶封閉小管。"}]},"17":{"status":"draft","statusNote":"依教師完成之大綱與內文整理；數字經原文 PDF 核對，書目依 PubMed 更正（2026-10-25）","oneLine":"非手術清創可讓約七成囊袋閉合，但盲刮在深囊袋與臼齒根岔有物理極限；以囊袋閉合為終點，約 3 個月再評估，殘留 ≥ 6 mm 再考慮手術。","takeHome":[{"h":"效力與極限並存","b":"Suvan 2020：Step 2 後 6–8 個月約 74% 囊袋閉合，初始 ≥ 7 mm 囊袋 PPD 約減少 2.6 mm。拔牙研究顯示深囊袋盲刮殘留結石多（Buchanan 1987：> 8 mm 約 45% 牙面），臼齒與根岔反應較差（Tomasi 2023）。"},{"h":"終點是囊袋閉合，不是零結石","b":"EFP S3：治療終點為無 PPD > 4 mm 伴 BoP 且無 PPD ≥ 6 mm（p.17）；囊袋閉合為 PPD ≤ 4 mm 且無 BoP（p.23）。結石本身不引發發炎，關鍵在生物膜（Tomasi 2023）。"},{"h":"等夠久再評估，標靶處理殘留","b":"Paternò Holtzman 2024：大部分改善在 1–2 個月，等到約 3 個月可再多 0.5–1 mm。殘留 PPD ≥ 5 mm 伴 BoP 標靶再清創（閉合率約 45%，> 6 mm 僅 12%）；R3.1：≥ 6 mm 建議翻瓣（Grade B）。"}],"compare":[{"c":"Stambaugh et al. 1981","old":"刮刀有效深度平均 3.73 mm，器械極限平均 5.52 mm","v":"cond","now":"需加條件。現代有探針形超音波工作頭、迷你刮刀與放大設備，MINST 臨床結果改善（Ribeiro 2023），但未直接測量結石殘留；根岔與凹陷仍是盲點（Tomasi 2023）。"},{"c":"Morrison et al. 1980","old":"Phase I 後 4 週，≥ 7 mm 囊袋 PPD 減少 2.22 mm、附連獲得 0.91 mm","v":"ok","now":"仍適用，數據已更新。Suvan 2020：初始 ≥ 7 mm 減少約 2.6 mm、6–8 個月約 74% 閉合；但 4 週太早，約 3 個月再評估較合適（Paternò Holtzman 2024）。"},{"c":"Buchanan & Robertson 1987; Caffesse et al. 1986","old":"深囊袋盲刮殘留結石多，翻瓣可提高清除率","v":"upd","now":"已更新。手術決策改以臨床指標為準：囊袋閉合就不需翻瓣，殘留 ≥ 6 mm 伴 BoP 才轉 Step 3（Sanz 2020 R3.1；Lang 2019 臨界探測深度）。翻瓣優勢主要在前牙與小臼齒，大臼齒無差異。"},{"c":"Badersten et al. 1984; Anderson et al. 1996","old":"重複刮除（0、3、6 個月或數天內三次）沒有附加效益","v":"cond","now":"需加條件。反駁的是無差別重複盲刮；現代主張只對殘留 PPD ≥ 5 mm 伴 BoP 的位點標靶再清創（Tomasi 2023；Laleman 2017）。"},{"c":"傳統觀念：清除所有結石、刮到光滑","old":"以 100% 無結石與光滑根面為成功標準","v":"upd","now":"已更新。以囊袋閉合與 BoP 為終點；內毒素只鬆散附著，探針也無法分辨被磨平的結石與牙骨質（Caffesse 1986）。"}],"numbers":[{"k":"3.73／5.52 mm","d":"Stambaugh 1981：刮刀有效深度與器械極限平均值（近心面極限 6.21 mm）；7 顆牙、42 個位點"},{"k":"2.22 mm","d":"Morrison 1980：初始 ≥ 7 mm 囊袋 Phase I 後 4 週 PPD 減少（7.57 → 5.35 mm），附連獲得 0.91 mm"},{"k":"17% vs 45%","d":"Buchanan & Robertson 1987：> 6 mm 翻瓣組殘留結石牙面約 17%，盲刮在 > 8 mm 平均 45%"},{"k":"25.0% vs 23.7%","d":"Anderson 1996：單次與三次刮除的殘留結石面積（P = 0.49）"},{"k":"57%／74%","d":"Suvan 2020：Step 2 後 3–4 個月與 6–8 個月囊袋閉合比例（9 篇研究，74% 的 95% CI 64–85%）"},{"k":"1.16 + 0.25 mm","d":"Paternò Holtzman 2024：全部囊袋 1–2 個月 PPD 減少，以及到 3–4 個月的額外減少；29 篇 RCT"},{"k":"約 60% vs < 40%","d":"Tomasi 2023（引用多層次模型）：非吸菸者前牙 7 mm 囊袋 vs 吸菸者臼齒的閉合機率"},{"k":"45%／12%","d":"Tomasi 2023：殘留囊袋再次器械清創的閉合率，> 6 mm 僅 12%"},{"k":"OR 7.7／11.0／64.2","d":"Matuliene 2008（轉引自 Tomasi 2023）：殘留 PPD 5、6、≥ 7 mm 位點的拔牙風險"},{"k":"HbA1c −0.35%","d":"Corbella 2024：2 型糖尿病病人非手術治療後 3 個月的額外降幅，證據確定性極低"}],"clinical":{"steps":["Step 1 先做衛教、戒菸與控糖等風險控管，再進行 Step 2 齦下器械清創（R2.1，Grade A）","工具：手用或動力器械皆可（R2.2）；分區或全口模式皆可（R2.3，Grade B），全口模式注意短暫全身性發炎反應","約 3 個月（8–12 週）再評估；EFP S3 未規定週數，骨內缺損可追蹤到 6–12 個月（Ramaglia 2026）","PPD ≤ 4 mm 且無 BoP → Step 4 SPT；PPD 5 mm 無 BoP → 加強口腔衛生、密切追蹤","殘留 4–5 mm 伴 BoP → 標靶再清創；≥ 6 mm → 建議翻瓣手術（R3.1，Grade B），根岔與骨內缺損考慮再生或切除性術式","術前向吸菸、臼齒根岔病人說明非手術閉合機率較低，再評估後可能需要手術"],"cases":[{"h":"前牙骨內缺損（教學模擬）","b":"45 歲非吸菸者，11 近心 PPD 8 mm、三壁缺損。MINST 配合放大設備，3 個月 PPD 4 mm、CAL 獲得 3.5 mm、萎縮 0.5 mm；骨內缺損追蹤到 6–12 個月再決定是否再生手術（Ribeiro 2023；Ramaglia 2026）。"},{"h":"16 Class II 根岔侵犯（教學模擬）","b":"52 歲，Step 2 後 10 週仍 PPD 6 mm 伴 BoP。根岔與凹陷是殘留結石主要位置（Caffesse 1986），殘留 > 6 mm 再清創閉合率僅約 12%（Tomasi 2023）；依 R3.1 轉入 Step 3 手術。"},{"h":"2 型糖尿病全口深囊袋（教學模擬）","b":"58 歲，HbA1c 8.2%。全口與非全口模式效果無差異但證據確定性極低（Corbella 2024），與內科協同控糖；HbA1c 平均可多降約 0.35%，宜如實告知。"}]},"debates":["器械是否省時：Tomasi 2023 認為音波／超音波可明顯節省時間，EFP S3 認為沒有證據（p.24）。","牙根物質移除量手動與超音波的比較結果不一致（Graziani 2023）。","Paternò Holtzman 2024 的 29 篇研究都沒有報告囊袋閉合率，初始深囊袋的晚期改善只有 2 篇研究。","單根牙殘留 ≥ 6 mm 時先試標靶再清創還是直接翻瓣，屬臨床判斷；R3.1 建議翻瓣，Tomasi 2023 把 MINST 歸在 Step 3 範疇。","Raittio 2024 的變異比分析提醒：平均療效背後個體反應可能並不一致。"],"quiz":[{"q":"Stambaugh 1981 的刮刀有效深度（curette efficiency）平均為？","o":["2.0 mm","3.73 mm","5.52 mm","6.9 mm"],"a":1,"e":"有效深度 3.73 mm，器械極限 5.52 mm（近心面 6.21 mm）。"},{"q":"Buchanan & Robertson 1987 中，翻瓣提高結石清除率的優勢主要出現在？","o":["大臼齒","前牙與小臼齒","所有牙齒都一樣","根岔區"],"a":1,"e":"大臼齒無差異，作者推論看得到比器械進得去更重要；根岔區未分析。"},{"q":"Suvan 2020 中，Step 2 後 6–8 個月的囊袋閉合比例約為？","o":["35%","57%","74%","95%"],"a":2,"e":"約 74%（95% CI 64–85%），3–4 個月約 57%。"},{"q":"EFP S3 R2.3（分區 vs 全口模式）的建議等級是？","o":["Grade A","Grade B","Grade 0","專家共識"],"a":1,"e":"Grade B（suggest），8 篇 RCT、212 人，不含加用抗菌劑的 FMD。"},{"q":"依 Paternò Holtzman 2024，何時再評估較合適？","o":["2 週","4 週","約 3 個月","12 個月"],"a":2,"e":"大部分改善在 1–2 個月內，等到約 3 個月可再多 0.5–1 mm 的 PPD 減少。"},{"q":"Tomasi 2023 中，殘留 > 6 mm 囊袋再次器械清創的閉合率約為？","o":["12%","45%","60%","74%"],"a":0,"e":"整體約 45%，> 6 mm 僅約 12%；依 R3.1 ≥ 6 mm 建議翻瓣。"}]},"18":{"status":"draft","statusNote":"依教師完成之大綱與內文整理；數字經原文 PDF 核對，書目依 PubMed 更正（2026-10-28）","oneLine":"Michigan、Nebraska 與 Becker 長期研究顯示：在每 3 個月 SPT 下，SRP 與手術的長期附連結果相近，淺囊袋開刀反而喪失附連；現代統合分析與 EFP S3 只對 Phase I 後殘留 ≥ 6 mm 的囊袋建議翻瓣（Grade B）。","takeHome":[{"h":"非手術是基石，淺囊袋不開刀","b":"Ramfjord 1987：1–3 mm 位點 5 年各組都有附連喪失，手術組（−1.12～−1.17 mm）多於 SRP（−0.89 mm）；4–6 mm 以 SRP 與 curettage 的附連結果較佳。Sanz-Sánchez 2020：淺囊袋 AF 造成較多 CAL 喪失（WMD −0.43 mm）。"},{"h":"手術效益集中在殘留深囊袋","b":"Sanz-Sánchez 2020：≥ 6 mm 囊袋 AF 比齦下清創多減 0.67 mm（≤ 12 個月）與 0.39 mm（> 12 個月）PPD。EFP S3 R3.1：殘留 PPD ≥ 6 mm 建議翻瓣（Grade B，we suggest）；4–5 mm 建議重複齦下清創。"},{"h":"長期成敗看 SPT 與風險因子","b":"三大經典研究都採每 3 個月 SPT，失齒率低（Ramfjord 1987：< 1%）。Kaldahl 1996 II：年破壞率 > 3% 的 8 位病人基準點全為吸菸者；破壞位點再次牙根整平後 1 年，88% 未再喪失附連。"}],"compare":[{"c":"Ramfjord et al. 1987","old":"SRP、curettage、改良式 Widman 與囊袋消除手術 5 年結果相近，淺囊袋手術反而喪失附連","v":"ok","now":"仍適用。Sanz-Sánchez 2020 統合 18 項 RCT 方向一致：淺囊袋 AF 喪失較多 CAL，中度囊袋齦下清創的附連較佳（長期 WMD −0.12 mm）。"},{"c":"Kaldahl et al. 1988；1996 I","old":"FO 削減 PPD 最多，但淺囊袋附連喪失與牙齦萎縮也最多","v":"cond","now":"需加條件。FO 的優勢在 PPD；7 年間 RP、MW、FO 的 CAL 增益相近（Kaldahl 1996 I）。FO 象限治療期已拔 24 顆牙、切除 8 個牙根，作者自承可能讓 FO 平均結果偏好。EFP S3 R3.3：切除性手術需考量牙齦萎縮。"},{"c":"Becker et al. 2001","old":"私人診所 5 年：SRP、骨手術、改良式 Widman 均能維持穩定","v":"ok","now":"仍適用，但樣本僅 16 人。淺囊袋 5 年三組都喪失附連、組間無顯著差異；骨手術喪失 ≥ 2 mm 附連的位點最多（64 個，SRP 21 個）。"},{"c":"Ramfjord 1987 手動探針的 CAL 增益","old":"治療後的 CAL 增益代表附連恢復","v":"cond","now":"需加條件。發炎時探針穿透接合上皮，消炎後探針受阻，也會表現為 CAL 增益（Kaldahl 1996 II）；Ramfjord 作者自承 1 mm 刻度探針只能記錄趨勢。"},{"c":"臨界探測深度（Lindhe et al. 1982）","old":"SRP 在 2.9 mm、改良式 Widman 在 4.2 mm 以上才帶來附連獲得","v":"upd","now":"已更新。手術決策改以再評估後的殘留 PPD 與 BoP 為準：殘留 ≥ 6 mm 伴 BoP 才轉 Step 3（Sanz 2020 R3.1）。數值引述自 Deas 2016。"}],"numbers":[{"k":"−1.17／−0.89 mm","d":"Ramfjord 1987：1–3 mm 位點 5 年附連變化，囊袋消除手術 vs SRP"},{"k":"< 1%","d":"Ramfjord 1987：72 位完成者 1881 顆牙中 17 顆因牙周病喪失，其中 16 顆基準點有根岔侵犯"},{"k":"2.39 vs 1.23 mm","d":"Kaldahl 1988：5–6 mm 位點 Phase II 後 10 週 PPD 減少，FO vs RP；CAL 獲得 RP 0.96、MW 0.93 mm，優於 FO 0.38 mm"},{"k":"37.1%／50.2%","d":"Kaldahl 1996 I：CS 組 ≥ 7 mm 位點至第 2 年、第 3 年因破壞而移出分析的比例"},{"k":"1.24%／年","d":"Kaldahl 1996 II：RP、MW、FO 位點平均年破壞率（CAL 喪失 ≥ 3 mm）"},{"k":"88%","d":"Kaldahl 1996 II：破壞位點再次牙根整平後 1 年未再喪失附連（65% 獲得、23% 不變）"},{"k":"0.67／0.39 mm","d":"Sanz-Sánchez 2020：≥ 6 mm 囊袋 AF 比齦下清創多減的 PPD（≤ 12、> 12 個月），相對效果 27.5%、25.3%"},{"k":"−0.43 mm","d":"Sanz-Sánchez 2020：淺囊袋 AF 與齦下清創的 CAL 差異（短期，AF 喪失較多）"},{"k":"OR 10／7.7","d":"Graziani 2017b 引述：殘留 PPD ≥ 6 mm 對疾病進展；殘留 5 mm 在牙齒層級的失齒風險"},{"k":"g −0.39","d":"Krajewski 2023：術後 3 個月 A. actinomycetemcomitans 顯著增加（95% CI −0.74 至 −0.03；3 篇研究、5 組比較）"}],"clinical":{"steps":["Step 1／2：衛教、戒菸與完整齦下 SRP，適當癒合後再評估（週數見「仍有爭議」）","再評估同時記錄 PPD、CAL、BoP 與 FMPS；牙菌斑控制不佳（FMPS ≥ 20%）先回 Step 1／2 強化","PPD ≤ 4 mm 且無 BoP → SPT；5 mm 無 BoP 已達治療終點（但不是囊袋閉合），持續追蹤","殘留 4–5 mm → 重複齦下清創（R3.1）","殘留 ≥ 6 mm → 建議翻瓣（R3.1，Grade B）；水平骨吸收用 Access flap，骨內缺損考慮再生手術","下顎大臼齒 Class II 根岔 → 再生手術（R3.11，Grade A）；上顎頰側 Class II（R3.12，Grade B）；根岔侵犯本身不是拔牙理由（R3.10）","淺囊袋與前牙美觀區避免切除性骨手術；吸菸者先控菸、縮短 SPT 間隔"],"cases":[{"h":"Stage III 殘留囊袋分流（教學模擬）","b":"52 歲女性，Phase I 後 8 週，FMPS < 15%。21 唇側 5 mm、BoP(−)：已達治療終點，SPT 追蹤；16 近心 7 mm、BoP(+)、水平骨吸收：依 R3.1 安排 OFD／Access flap（Sanz-Sánchez 2020：平均多減 0.39–0.67 mm）。"},{"h":"36 頰側 Class II 根岔（教學模擬）","b":"45 歲男性，再評估殘留 PPD 6 mm、BoP(+)，水平探入根岔 4 mm。依 R3.11 建議再生手術，材料依 R3.13（EMD，或骨衍生移植材料加減可吸收膜）；術前評估根分頭長度與根岔入口（Graziani 2017a）。"},{"h":"重度吸菸者多處 6–7 mm（教學模擬）","b":"58 歲男性，每日 20 支，FMPS 28%。高破壞率病人多為吸菸者（Kaldahl 1996 II），吸菸者非手術治療後囊袋閉合機率低 30%（Graziani 2017a）；先戒菸、重複齦下清創、SPT 縮短為 2 個月，穩定後再評估手術。"}]},"debates":["再評估時機：Caffesse 2019 寫 SRP 後 4–6 週；S17 依 Paternò Holtzman 2024 建議約 3 個月（8–12 週）；EFP S3 只要求適當癒合後再評估，未規定週數。","經典研究多為分口實驗（Sanz-Sánchez 2020 納入的 18 項 RCT 中有 15 項也是），象限間可能互相影響；Kaldahl 1996 I 的 CS 組因破壞大量移出，長期比較有存活者偏誤。","FO 的 PPD 優勢是否值得淺位點附連喪失與牙齦萎縮：Kaldahl 1988 與 Becker 2001 都顯示骨手術在淺囊袋代價最大，EFP S3 R3.3 仍建議可用，但需考量萎縮。","Sanz-Sánchez 2020 納入研究的偏差風險中至高（EFP S3 評語），長期差距由 0.67 收斂到 0.39 mm，是否有臨床意義需個別判斷。","手術後齦下菌相：Krajewski 2023 顯示臨床指標改善，但紅複合體菌量未顯著下降、A. actinomycetemcomitans 反而增加，結果受檢測方法影響、異質性高。"],"quiz":[{"q":"Ramfjord 1987 中，1–3 mm 淺囊袋 5 年的附連變化為何？","o":["只有手術組喪失附連","各組都有附連喪失，手術組較多","SRP 組附連獲得最多","各組都獲得附連"],"a":1,"e":"手術組 −1.12～−1.17 mm，SRP −0.89 mm、curettage −0.99 mm，作者認為差異臨床意義有限。"},{"q":"Sanz-Sánchez 2020 中，≥ 6 mm 囊袋 AF 在 > 12 個月比齦下清創多減的 PPD 約為？","o":["0.12 mm","0.39 mm","0.67 mm","1.5 mm"],"a":1,"e":"短期 0.67 mm、長期 0.39 mm，相對效果約 27.5% 與 25.3%。"},{"q":"EFP S3 R3.1（殘留 PPD ≥ 6 mm 建議翻瓣）的建議等級是？","o":["Grade A，we recommend","Grade B，we suggest","Grade 0，may be considered","專家共識"],"a":1,"e":"Grade B ↑；支持證據為 13 篇 RCT（500 位病人），偏差風險中至高。"},{"q":"下顎大臼齒殘留囊袋伴 Class II 根岔侵犯，EFP S3 的對應推薦是？","o":["R3.8，Grade B","R3.11，Grade A","R3.16，Grade 0","沒有推薦"],"a":1,"e":"R3.11：建議以牙周再生手術處理（we recommend，Grade A）；材料依 R3.13。"},{"q":"Kaldahl 1996 II 中，年破壞率 > 3% 的病人有什麼共同特徵？","o":["都接受 FO","都是糖尿病人","基準點全為吸菸者","都未規律 SPT"],"a":2,"e":"共 8 人，基準點全為吸菸者；但這是描述性分組，未做吸菸與非吸菸的統計比較。"},{"q":"再評估時 PPD 5 mm 且 BoP(−) 的位點，依 EFP S3 屬於？","o":["囊袋閉合","已達治療終點，但不是囊袋閉合","需立即翻瓣","需重複齦下清創"],"a":1,"e":"囊袋閉合是 PPD ≤ 4 mm 且無 BoP；治療終點是無 > 4 mm 伴 BoP 的囊袋，5 mm 無 BoP 符合終點、可 SPT 追蹤。"}],"lit":[{"a":"Ramfjord et al.","y":"1987","t":"4 modalities of periodontal treatment compared over 5 years","j":"J Clin Periodontol","pm":"3308969","r":"classic","s":0,"src":""},{"a":"Kaldahl et al.","y":"1988","t":"Evaluation of four modalities of periodontal therapy. Mean probing depth, probing attachment level and recession changes","j":"J Periodontol","pm":"3066888","r":"classic","s":0,"src":""},{"a":"Kaldahl et al.","y":"1996","t":"Long-term evaluation of periodontal therapy: II. Incidence of sites breaking down","j":"J Periodontol","pm":"8667129","r":"classic","s":0,"src":""},{"a":"Kaldahl et al.","y":"1996","t":"Long-term evaluation of periodontal therapy: I. Response to 4 therapeutic modalities","j":"J Periodontol","pm":"8667142","r":"classic","s":0,"src":""},{"a":"Becker et al.","y":"2001","t":"A longitudinal study comparing scaling, osseous surgery, and modified Widman procedures: results after 5 years","j":"J Periodontol","pm":"11811503","r":"classic","s":0,"src":""},{"a":"Graziani et al.","y":"2017a","t":"Nonsurgical and surgical treatment of periodontitis: how many options for one disease?","j":"Periodontol 2000","pm":"28758300","r":"new","s":1,"src":"Perio 2000"},{"a":"Sanz-Sánchez et al.","y":"2020","t":"Efficacy of access flap procedures compared to subgingival debridement in the treatment of periodontitis. A systematic review and meta-analysis","j":"J Clin Periodontol","pm":"31970821","r":"new","s":1,"src":"JCP"},{"a":"Deas et al.","y":"2016","t":"Scaling and root planing vs. conservative surgery in the treatment of chronic periodontitis","j":"Periodontol 2000","pm":"27045434","r":"new","s":0,"src":"Perio 2000"},{"a":"Graziani et al.","y":"2017b","t":"Surgical treatment of the residual periodontal pocket","j":"Periodontol 2000","pm":"29193404","r":"new","s":0,"src":"Perio 2000"},{"a":"Caffesse & Echeverría","y":"2019","t":"Treatment trends in periodontics","j":"Periodontol 2000","pm":"30887573","r":"new","s":0,"src":"Perio 2000"},{"a":"Krajewski et al.","y":"2023","t":"Influence of periodontal surgery on the subgingival microbiome-A systematic review and meta-analysis","j":"J Periodontal Res","pm":"36597817","r":"new","s":0,"src":"JPR"},{"a":"Sanz et al.","y":"2020","t":"Treatment of stage I-III periodontitis-The EFP S3 level clinical practice guideline","j":"J Clin Periodontol","pm":"32383274","r":"rel","s":0,"src":"","at":17}]},"19":{"status":"draft","statusNote":"依教師完成之大綱與內文整理；數字經原文 PDF 核對，書目依 PubMed 更正（2026-10-28）","oneLine":"臨界探測深度提醒淺囊袋不要過度治療（SRP 2.9 mm、MWF 4.2 mm）；全口清創（FMS／FMD）與分區刮除療效未顯示差異（低確定性），依病人狀況選擇；長期成敗取決於清創品質與病人牙菌斑控制，齦下沖洗只是輔助。","takeHome":[{"h":"淺囊袋不刮，深囊袋才有附連獲得","b":"Lindhe 1982：SRP 的臨界探測深度 2.9 mm、MWF 4.2 mm；初始 PPD 低於此值，治療後淨附連喪失，且 MWF 在淺囊袋喪失更多（p. 332 範例：1 mm、2 mm 位點預估喪失 1.4、1.2 mm）。PPD ≤ 3 mm 只做齦上清潔。"},{"h":"全口與分區療效未顯示差異","b":"Jervøe-Storm 2022（20 篇 RCT、944 人）：FMS、FMD 與 Q-SRP 在 6–8 個月的 PPD、CAL 都未顯示差異（低至極低確定性）。EFP S3 R2.3：分區或 24 小時內全口清創皆可（Grade B）。依全身狀況、張口耐受與時間選擇。"},{"h":"清創品質與牙菌斑控制才是關鍵","b":"Lindhe 1984：長期結果取決於根面清創品質，而非手術或非手術；牙菌斑控制不良者，第 24–60 個月手術位點 36%、非手術位點 18% 出現 ≥ 2 mm 附連喪失。Greenstein 2005：齦下沖洗藥物很快被清除，不能取代清創。"}],"compare":[{"c":"Lindhe et al. 1982","old":"臨界探測深度：SRP 2.9 mm、MWF 4.2 mm；淺囊袋治療造成附連喪失，深囊袋才有附連獲得","v":"cond","now":"需加條件。僅 15 人、手動探針；CPD 是迴歸估算的平均值，應作為臨床參考區間，需合併 BoP、CAL 與骨型態判斷。方向與 EFP S3 R3.1 一致：殘留 ≥ 6 mm 建議翻瓣、4–5 mm 重複齦下清創（Sanz 2020）。"},{"c":"Lindhe et al. 1984","old":"5 年：初始 PPD ≥ 4 mm 位點手術與非手術附連變化無明顯差異；關鍵是清創品質與牙菌斑控制","v":"ok","now":"仍適用。EFP S3 以 Step 2 齦下器械清創為核心（R2.1，Grade A）。注意 5 年時只剩 11 人，且 24 個月後只做齦上清潔。"},{"c":"Serino et al. 2001","old":"重度牙周炎 13 年：手術組淺囊袋較多、平均 PPD 較低；非手術組第 1–3 年退出較多（8 vs 4 人）","v":"cond","now":"需加條件。只分析非臼齒，不能直接套用到臼齒與根岔區；退出比例原文英文 29%／14%、德文摘要 25%／12%，宜以人數呈現。EFP S3 R3.1：Stage III 殘留 ≥ 6 mm 建議翻瓣（Grade B）。"},{"c":"Greenstein 2005","old":"齦上沖洗配合刷牙可降低牙齦發炎；齦下沖洗作為單一治療效果短暫，也無法移除牙結石","v":"ok","now":"仍適用。EFP S3 沒有另立齦下沖洗建議；CHX 漱口水（R2.13）與緩釋型局部 CHX（R2.14）皆為 Grade 0 開放式建議（Sanz 2020）。"},{"c":"Eberhard et al. 2008","old":"FMD 比 Q-SRP 在中度囊袋多 0.53 mm PPD 減少、0.33 mm CAL 獲得","v":"upd","now":"已更新。Cochrane 更新版 Jervøe-Storm 2022（20 篇 RCT）：FMS、FMD 與 Q-SRP 未顯示差異（低確定性）。Eberhard 的差異雖達統計顯著，幅度落在一般探測誤差之內。"},{"c":"Teughels et al. 2009","old":"FMD 可避免未治療位點細菌經唾液交叉再感染已清創位點","v":"upd","now":"已更新。Teughels 引述 Quirynen 2006，認為 FMD 效益部分來自抗菌劑、部分來自短時間完成；作者屬 Leuven 團隊（FMD 提出者）。Jervøe-Storm 2022：FMD 與 FMS 無差異（4 篇、112 人）。"}],"numbers":[{"k":"2.9／4.2 mm","d":"Lindhe 1982：SRP 與 MWF 的臨界探測深度（± 0.4／± 0.2 mm，95% 信賴區間）"},{"k":"−1.7 vs +0.1 mm","d":"Lindhe 1982 p. 332 小臼齒範例：整顆牙做 MWF 合計淨喪失 vs 只做 SRP 合計淨獲得"},{"k":"86–88%","d":"Lindhe 1984：第 24–60 個月附連水平維持在 ±1 mm 內的位點比例"},{"k":"36%／18%","d":"Lindhe 1984：牙菌斑控制不良者，24 個月時 PPD ≥ 4 mm 位點於第 24–60 個月出現 ≥ 2 mm 附連喪失（手術／非手術）"},{"k":"2.6 vs 3.1 mm","d":"Serino 2001：第 1 年平均 PPD，手術 vs 非手術；第 13 年為 3.2 vs 3.7 mm"},{"k":"8 vs 4 人","d":"Serino 2001：第 1–3 年因 ≥ 4 顆牙附加附連喪失 ≥ 2 mm 而退出試驗，非手術 vs 手術（各 32 人）"},{"k":"0.53／0.33 mm","d":"Eberhard 2008：FMD 比 Q-SRP 在中度囊袋多出的 PPD 減少（單根牙）與 CAL 獲得"},{"k":"0.03／0.11 mm","d":"Jervøe-Storm 2022：6–8 個月 PPD 減少 MD，FMS vs Q-SRP（5 篇、148 人）、FMD vs Q-SRP（6 篇、224 人）"},{"k":"8 篇 RCT","d":"EFP S3 R2.3 證據：分區與 24 小時內全口清創追蹤 ≥ 6 個月無差異（212 人，Grade B）"},{"k":"12.5 分鐘","d":"Greenstein 2005 引述：齦下注入的凝膠一半被沖出的時間"}],"clinical":{"steps":["初診建立全口 PPD、CAL、BoP 基線","PPD ≤ 3 mm 位點只做齦上清潔，避免醫源性附連喪失（Lindhe 1982）","PPD ≥ 4 mm 且 BoP(+) 才做齦下牙根整平；分區（Q-SRP）或 24 小時內全口（FMS）皆可（R2.3，Grade B）","全口清創前告知可能暫時性體溫升高；控制不良糖尿病、心血管疾病、高齡者審慎評估，可改分區（Sanz 2020，p. 24）","不常規做針筒齦下沖洗；CHX 漱口水可於特定個案短期輔助（R2.13，Grade 0）","再評估：PPD ≤ 4 mm 且無 BoP → SPT；4–5 mm 且 BoP(+) → 再次局部齦下清創；殘留 ≥ 6 mm → 評估翻瓣（R3.1，Grade B）","安排手術前先確認牙菌斑控制良好（臨床常以約 20% 為門檻，此數字非出自 Lindhe 1984）"],"cases":[{"h":"工作繁忙的 Stage III Grade C（教學模擬）","b":"45 歲女性，無全身疾病，全口多處 PPD 6–8 mm，希望兩天內完成。安排 24 小時內全口機械性清創（FMS），不另做舌背與扁桃腺 CHX 流程（Jervøe-Storm 2022：FMD 與 FMS 無差異）；事先告知可能暫時性體溫升高。"},{"h":"Phase I 後 16 遠心殘留 7 mm（教學模擬）","b":"50 歲男性，再評估 PlI 12%，16 遠心 PPD 7 mm、BoP(+)、二壁型骨內缺損。PPD 遠高於 MWF 的 CPD 4.2 mm，依 R3.1 安排翻瓣或再生手術。若牙菌斑控制不良，應先強化 OHI（Lindhe 1984）。"},{"h":"高齡糖尿病要求一日全口清創（教學模擬）","b":"68 歲男性，HbA1c 8.2%、高血壓。全口清創後第 1 天 CRP、IL-6、TNF-α 上升、7 天內恢復（Graziani 2015，Jervøe-Storm 2022 引述）；兩種方式療效未顯示差異，考量全身安全改採分區 4 次。"}]},"debates":["臨界探測深度來自 1982 年 15 人、手動探針的迴歸平均值，能否當作個別位點的切點仍有疑問；現代應合併 BoP、CAL 與骨型態判斷。","Serino 2001 退出比例：英文正文 29%／14%、德文摘要 25%／12%（各 32 人），分母未說明；且只分析非臼齒，不能直接套用到臼齒與根岔。","交叉再感染假說：Teughels 2009（Leuven 團隊）支持 FMD，但 Jervøe-Storm 2022 未發現 FMD 優於 FMS 或 Q-SRP，證據確定性低；「沒有證據顯示差異」不等於「證實等效」。","全口清創後體溫升高：Teughels 2009 解讀為可能有益的免疫反應（作者承認屬臆測）；Jervøe-Storm 2022 列為不良事件，全身發炎指標只有 1 篇測量。","再評估時機：本堂寫 Phase I 後 4–8 週；S17、S18 對週數另有討論，EFP S3 只要求適當癒合後再評估、未規定週數。"],"quiz":[{"q":"Lindhe 1982 中，SRP 的臨界探測深度約為？","o":["2.9 mm","3.5 mm","4.2 mm","5.0 mm"],"a":0,"e":"SRP 2.9 mm、MWF 4.2 mm；初始 PPD 低於該術式的臨界探測深度，治療後傾向淨附連喪失。"},{"q":"初始 PPD 2 mm、無發炎的位點做深部牙根整平，預期附連水平如何變化？","o":["淨附連獲得","小量淨附連喪失","完全沒有變化","PPD 增加 2 mm"],"a":1,"e":"2 mm 低於 SRP 的臨界探測深度 2.9 mm，預期小量淨附連喪失；若改做翻瓣喪失更多。正確做法是只做齦上清潔（Lindhe 1982）。"},{"q":"Jervøe-Storm 2022 Cochrane 系統性回顧對 FMS、FMD 與 Q-SRP 的結論是？","o":["FMD 明顯優於 Q-SRP","FMS 明顯優於 Q-SRP","三者在 PPD、CAL 未顯示差異（低確定性）","Q-SRP 明顯優於全口模式"],"a":2,"e":"20 篇 RCT、944 人；6–8 個月 PPD、CAL 都未顯示差異，證據確定性低至極低，且沒有試驗評估牙齒喪失。"},{"q":"EFP S3 R2.3「分區或 24 小時內全口清創皆可」的建議等級是？","o":["Grade A，we recommend","Grade B，we suggest","Grade 0，開放式建議","沒有建議"],"a":1,"e":"Grade B（↑）；證據為 8 篇追蹤 ≥ 6 個月的 RCT（212 人），強烈共識。"},{"q":"Greenstein 2005 指出齦下沖洗最大的缺點是？","o":["置入囊袋的藥物很快被清除","會造成牙齦退縮","會誘發細菌抗藥性","會增加牙本質過敏"],"a":0,"e":"藥物很快被清除、難以維持作用時間；引述研究中齦下注入的凝膠一半在 12.5 分鐘內被沖出。需要時改用緩釋型局部藥物。"},{"q":"Lindhe 1984 中，牙菌斑控制不良者 24 個月時 PPD ≥ 4 mm 的手術位點，第 24–60 個月出現 ≥ 2 mm 附連喪失的比例約為？","o":["9%","18%","36%","55%"],"a":2,"e":"手術位點 36%、非手術位點 18%（Table 5）：牙菌斑控制不佳時，手術無法抵銷牙菌斑的破壞。"}],"lit":[{"a":"Lindhe et al.","y":"1982","t":"\"Critical probing depths\" in periodontal therapy","j":"J Clin Periodontol","pm":"6764782","r":"classic","s":0,"src":""},{"a":"Lindhe et al.","y":"1984","t":"Long-term effect of surgical/non-surgical treatment of periodontal disease","j":"J Clin Periodontol","pm":"6378986","r":"classic","s":0,"src":""},{"a":"Serino et al.","y":"2001","t":"Initial outcome and long-term effect of surgical and non-surgical treatment of advanced periodontal disease","j":"J Clin Periodontol","pm":"11686808","r":"classic","s":0,"src":""},{"a":"Greenstein","y":"2005","t":"Position paper: The role of supra- and subgingival irrigation in the treatment of periodontal diseases","j":"J Periodontol","pm":"16274324","r":"classic","s":0,"src":""},{"a":"Eberhard et al.","y":"2008","t":"Full-mouth treatment concepts for chronic periodontitis: a systematic review","j":"J Clin Periodontol","pm":"18498383","r":"classic","s":0,"src":""},{"a":"Teughels et al.","y":"2009","t":"One-stage, full-mouth disinfection: fiction or reality?","j":"Periodontol 2000","pm":"19388952","r":"new","s":1,"src":"Perio 2000"},{"a":"Jervøe-Storm et al.","y":"2022","t":"Full-mouth treatment modalities (within 24 hours) for periodontitis in adults","j":"Cochrane Database Syst Rev","pm":"35763286","r":"new","s":1,"src":"Cochrane"},{"a":"Sanz et al.","y":"2020","t":"Treatment of stage I-III periodontitis-The EFP S3 level clinical practice guideline","j":"J Clin Periodontol","pm":"32383274","r":"rel","s":0,"src":"","at":17}]},"20":{"status":"draft","statusNote":"依教師完成之大綱與內文整理；數字經原文 PDF 核對，書目依 PubMed 與文獻角色清單更正（2026-10-28）","oneLine":"全身性抗生素只能作為 Step 2 齦下清創的輔助：EFP S3 不建議常規使用（Grade A），年輕成年人廣泛性 Stage III 可考慮（Grade 0）。首選 Amoxicillin + Metronidazole 7 天，深囊袋效益最大；不常規做微生物檢測，中度牙周炎、糖尿病與 SPT 單一位點復發不常規用藥。","takeHome":[{"h":"嚴格把關適應症","b":"EFP S3 R2.16：常規輔助使用不建議（Grade A ↓↓）；年輕成年人廣泛性 Stage III 可考慮（Grade 0 ↔）。Stage IV、Grade C 為臨床延伸考量，非 S3 條文。中度囊袋只多減約 0.3 mm PPD（Jepsen 2016），糖尿病病人只多減 0.15 mm（Grellmann 2016）。"},{"h":"首選 Amoxicillin + Metronidazole，常規 7 天","b":"Teughels 2020（28 項 RCT）：12 個月 PPD 額外減少 0.485 mm，Amoxicillin + Metronidazole 效果最好，深囊袋多減 1.191 mm。McGowan 2017：劑量與 7／14 天差異 < 0.1 mm，建議 500/400 或 500/500 mg TID 7 天。"},{"h":"經驗用藥，不常規檢測","b":"Salkin 2003：同位點兩份樣本完全相同僅 2/20；Amoxicillin + Metronidazole 在 80% 病人的兩份樣本皆達 100% 殺菌，單藥 45%–60%。Mombelli 2025：沒有證據顯示檢測導向治療優於經驗性治療，成本效益未確立。"}],"compare":[{"c":"Slots & Rams 1990","old":"依微生物診斷與藥敏試驗選擇抗生素，清除特定病原菌","v":"upd","now":"已更新。單藥已由 Amoxicillin + Metronidazole 經驗性雙藥取代（Sgolastra 2020 網絡統合分析排名第一）；常規檢測不建議（Mombelli 2025）。清除病原菌須配合機械清創的觀念仍成立。"},{"c":"Salkin et al. 2003","old":"同位點兩份樣本的培養與藥敏結果不一致，經驗性 Amoxicillin + Metronidazole 較可行","v":"ok","now":"仍適用。Mombelli 2025：沒有臨床證據顯示檢測導向治療優於經驗性治療；檢測保留給難治型或嚴重 Penicillin 過敏者（專家意見）。"},{"c":"López et al. 2006","old":"單獨服用 Metronidazole + Amoxicillin（兩組皆有齦上洗牙）12 個月臨床與菌群變化與 SRP 相近","v":"cond","now":"需加條件。族群輕（基線平均 PPD < 3 mm）、每組 11 人，屬研究模型，不能外推為只給藥。EFP S3 的抗生素推薦以齦下清創為前提，常規輔助使用為 Grade A 不建議（R2.16）。"},{"c":"Borges et al. 2017","old":"極重度慢性牙周炎：1 年達臨床終點 14 天組 61.9%–63.6%、7 天組 31.8%、SRP 13.6%","v":"cond","now":"需加條件。McGowan 2017 統合 18 項 RCT：7 天與 14 天 3 個月差異 < 0.1 mm；依抗生素管理原則常規用 7 天，僅極重度個案考慮延長。"},{"c":"McGowan et al. 2017","old":"劑量與天數影響 < 0.1 mm，建議高劑量、最短療程 7 天","v":"ok","now":"仍適用。歐洲 RCT（Herrera 2023 引述 Cosgarea 2016、2017）：3 天與 7 天療程皆優於單純 SRP，12 個月兩組達低疾病進展風險的病人都較安慰劑組多。"}],"numbers":[{"k":"0.448／0.485 mm","d":"Teughels 2020：輔助全身性抗生素 6／12 個月 PPD 額外減少（28 項 RCT）"},{"k":"1.191 mm","d":"Teughels 2020：Amoxicillin + Metronidazole 深囊袋 12 個月額外 PPD 減少（比安慰劑多 52.36%）"},{"k":"60.56%","d":"Teughels 2020：Amoxicillin + Metronidazole 12 個月使 PPD ≥ 5 mm 殘留位點額外減少的比例"},{"k":"61.9%–63.6% vs 31.8%","d":"Borges 2017：1 年達臨床終點（≤ 4 個 PD ≥ 5 mm 位點）的病人比例，14 天 vs 7 天；SRP 組 13.6%"},{"k":"OR 5.26","d":"Borges 2017：14 天療程是達臨床終點的唯一顯著預測因子（95% CI 2.3–12.1）"},{"k":"< 0.1 mm","d":"McGowan 2017：不同劑量、7 天 vs 14 天在 3 個月 PPD、CAL 的差異（18 項 RCT）"},{"k":"80% vs 45%–60%","d":"Salkin 2003：兩份樣本皆達 100% 殺菌的病人比例，Amoxicillin + Metronidazole vs 單藥"},{"k":"0.3 mm","d":"Jepsen 2016：中度囊袋（4–6 mm）輔助抗生素額外 PPD 減少（CAL 0.2 mm）"},{"k":"0.15 mm","d":"Grellmann 2016：糖尿病病人輔助抗生素額外 PD 減少；CAL 0.14 mm 未達顯著"},{"k":"−16.20%","d":"Khattri 2020：Amoxicillin + Metronidazole 長期囊袋閉合 MD（1 項研究、44 人，極低確定性）"}],"clinical":{"steps":["確認適應症：年輕成年人廣泛性 Stage III（EFP S3 R2.16 B，Grade 0）；Grade C、Stage IV、全口多處 PPD ≥ 7 mm 為臨床加權（專家意見）","排除 Penicillin／Metronidazole 過敏、孕期、嚴重肝腎功能不全","處方 Amoxicillin 500 mg + Metronidazole 400 或 500 mg TID 7 天，於全口 SRP 當天或短期內完成全口 SRP 的最後一天開始","衛教服滿 21 劑；常見噁心、腹瀉、金屬味；服藥期間至停藥後 3 天禁酒（專家意見）","不常規用藥：中度牙周炎、糖尿病病人、SPT 單一位點復發（改局部處置）、未清創單獨給藥","急性病況：壞死性牙周病伴全身症狀 → 輔助 Metronidazole；牙周膿腫僅於需預防菌血症、嚴重全身症狀或引流困難時使用（Herrera 2026）","不常規做微生物檢測；保留給難治型或嚴重 Penicillin 過敏者"],"cases":[{"h":"28 歲廣泛性 Stage III Grade C（教學模擬）","b":"全口多處 PPD 7–9 mm、深垂直骨缺損、家族早期失牙。符合 S3 例外條款（Grade 0，可考慮）：全口 SRP 當天開始 Amoxicillin 500 mg + Metronidazole 500 mg TID 7 天；深囊袋 12 個月預期多減約 1.2 mm PPD（Teughels 2020），3 個月再評估。"},{"h":"55 歲糖尿病 Stage II（教學模擬）","b":"HbA1c 7.5%、PPD 4–5 mm 為主。Grellmann 2016：輔助抗生素只多減 0.15 mm、CAL 無顯著差異；不開抗生素，專注 SRP、口腔衛生指導與血糖控制。"},{"h":"SPT 中 16 腭側單一位點 6 mm（教學模擬）","b":"全口穩定，僅單一位點復發。全身性抗生素不符風險效益；先檢查殘留牙結石、根溝與咬合，局部齦下清創，必要時局部釋放抗生素或 Step 3 手術（Jepsen 2016）。"}]},"debates":["7 天 vs 14 天：Borges 2017 在極重度個案顯示 14 天達終點較多，McGowan 2017 統合顯示 3 個月差異 < 0.1 mm；目前依抗生素管理原則以 7 天為常規。","長期證據：Khattri 2020 認為 ≥ 1 年的證據確定性極低，只有囊袋閉合與 BoP 達最小臨床重要差異；與 Teughels 2020 的統計顯著效益需一併解讀。","S3 例外條款只寫年輕成年人廣泛性 Stage III，未提 Grade C 或 Stage IV；臨床把 Grade C 當加權因素，屬專家意見。","抗生素的免疫調節作用（Suárez 2025）多來自體外與動物研究，輔助抗生素的附連獲得是否來自免疫調節尚未證實。","急性牙周病況的抗生素推薦（Herrera 2026）屬專家共識，證據確定性極低；何謂「嚴重全身症狀」仍需臨床判斷。"],"quiz":[{"q":"EFP S3 R2.16 對「常規輔助使用全身性抗生素」的建議是？","o":["不建議，Grade A","不建議，Grade B","Grade 0，開放式建議","建議常規使用"],"a":0,"e":"A 部分常規使用不建議（Grade A ↓↓）；B 部分年輕成年人廣泛性 Stage III 可考慮（Grade 0 ↔）（Sanz 2020，p. 33）。"},{"q":"López 2006 中，單獨服用 Metronidazole + Amoxicillin 與 SRP 組的 12 個月結果為何？","o":["服藥組停藥後迅速復發","兩組臨床與菌群變化相近，無顯著差異","SRP 組顯著較好","服藥組顯著較好"],"a":1,"e":"兩組都先做全口齦上洗牙；任何時間點組間皆無顯著差異。但族群輕、每組 11 人，屬研究模型，不能外推為只給藥。"},{"q":"McGowan 2017 依抗生素管理原則建議的處方為？","o":["Amoxicillin 500 mg + Metronidazole 250 mg TID 14 天","Amoxicillin 500 mg + Metronidazole 400 或 500 mg TID 7 天","Amoxicillin 375 mg + Metronidazole 250 mg TID 3 天","Metronidazole 單藥 14 天"],"a":1,"e":"劑量與天數差異 < 0.1 mm，故採「高劑量、最短療程」：500/400 或 500/500 mg TID 7 天。"},{"q":"Teughels 2020 中，Amoxicillin + Metronidazole 於深囊袋 12 個月的額外 PPD 減少約為？","o":["0.3 mm","0.485 mm","1.191 mm","2.5 mm"],"a":2,"e":"深囊袋 1.191 mm（比安慰劑多 52.36%）；0.485 mm 是全口平均的 12 個月額外減少。"},{"q":"Salkin 2003 中，Amoxicillin + Metronidazole 在兩份樣本皆達 100% 殺菌的病人比例為？","o":["45%","60%","80%","100%"],"a":2,"e":"16/20（80%）；單藥 Tetracycline 60%、Amoxicillin 45%、Metronidazole 60%（Table 4）。"},{"q":"依 EFP S2k（Herrera 2026），牙周膿腫何時建議使用全身性抗生素？","o":["所有膿腫引流後都要用","需預防菌血症、嚴重全身症狀或引流困難時","從不建議","只要有腫脹就用"],"a":1,"e":"不建議常規使用；僅在這三種情況建議以全身性抗生素作為初始治療（專家共識，證據極低）。"}],"lit":[{"a":"Slots & Rams","y":"1990","t":"Antibiotics in periodontal therapy: advantages and disadvantages","j":"J Clin Periodontol","pm":"2202744","r":"classic","s":0,"src":""},{"a":"Salkin et al.","y":"2003","t":"The clinical relevance of microbiologic testing. Part 2: a comparative analysis of microbiologic samples secured simultaneously from the same sites and cultured in the same laboratory","j":"Int J Periodontics Restorative Dent","pm":"12710815","r":"classic","s":0,"src":""},{"a":"López et al.","y":"2006","t":"Effects of metronidazole plus amoxicillin as the only therapy on the microbiological and clinical parameters of untreated chronic periodontitis","j":"J Clin Periodontol","pm":"16856904","r":"classic","s":0,"src":""},{"a":"Borges et al.","y":"2017","t":"Different antibiotic protocols in the treatment of severe chronic periodontitis: A 1-year randomized trial","j":"J Clin Periodontol","pm":"28303587","r":"classic","s":0,"src":""},{"a":"McGowan et al.","y":"2017","t":"Optimal dose and duration of amoxicillin-plus-metronidazole as an adjunct to non-surgical periodontal therapy: A systematic review and meta-analysis of randomized, placebo-controlled trials","j":"J Clin Periodontol","pm":"29027242","r":"classic","s":0,"src":""},{"a":"Feres et al.","y":"2015","t":"Systemic antibiotics in the treatment of periodontitis","j":"Periodontol 2000","pm":"25494600","r":"new","s":1,"src":"Perio 2000"},{"a":"Teughels et al.","y":"2020","t":"Adjunctive effect of systemic antimicrobials in periodontitis therapy: A systematic review and meta-analysis","j":"J Clin Periodontol","pm":"31994207","r":"new","s":1,"src":"JCP"},{"a":"Jepsen & Jepsen","y":"2016","t":"Antibiotics/antimicrobials: systemic and local administration in the therapy of mild to moderately advanced periodontitis","j":"Periodontol 2000","pm":"27045432","r":"new","s":0,"src":"Perio 2000"},{"a":"Grellmann et al.","y":"2016","t":"Systemic antimicrobials adjuvant to periodontal therapy in diabetic subjects: a meta-analysis","j":"J Clin Periodontol","pm":"26790108","r":"new","s":0,"src":"JCP"},{"a":"Sgolastra et al.","y":"2020","t":"Adjunctive systemic antimicrobials in the treatment of chronic periodontitis: A systematic review and network meta-analysis","j":"J Periodontal Res","pm":"33314159","r":"new","s":0,"src":"JPR"},{"a":"Khattri et al.","y":"2020","t":"Adjunctive systemic antimicrobials for the non-surgical treatment of periodontitis","j":"Cochrane Database Syst Rev","pm":"33197289","r":"new","s":0,"src":"Cochrane"},{"a":"Herrera et al.","y":"2023","t":"Europe's contribution to the evaluation of the use of systemic antimicrobials in the treatment of periodontitis","j":"Periodontol 2000","pm":"37314038","r":"new","s":0,"src":"Perio 2000"},{"a":"Mombelli et al.","y":"2025","t":"Empiric or individually targeted antimicrobial therapy. Historical perspective and current state","j":"Periodontol 2000","pm":"41123046","r":"new","s":0,"src":"Perio 2000"},{"a":"Suárez et al.","y":"2025","t":"Antibiotic-mediated immune modulation in periodontitis","j":"Periodontol 2000","pm":"40944344","r":"new","s":0,"src":"Perio 2000"},{"a":"Herrera et al.","y":"2018","t":"Acute periodontal lesions (periodontal abscesses and necrotizing periodontal diseases) and endo-periodontal lesions","j":"J Clin Periodontol","pm":"29926493","r":"rel","s":0,"src":"","at":36},{"a":"Sanz et al.","y":"2020","t":"Treatment of stage I-III periodontitis-The EFP S3 level clinical practice guideline","j":"J Clin Periodontol","pm":"32383274","r":"rel","s":0,"src":"","at":17},{"a":"Herrera et al.","y":"2026","t":"Management of Acute Periodontal Conditions-The EFP S2k Level Clinical Practice Guideline","j":"J Clin Periodontol","pm":"42713627","r":"rel","s":0,"src":"","at":36}]}}</script>
<script>
(function(){
  var D=JSON.parse(document.getElementById('course-data').textContent);
  var R=JSON.parse(document.getElementById('review-data').textContent);
  var S={}; D.sessions.forEach(function(s){S[s.n]=s});
  var MOD={}; D.modules.forEach(function(m){MOD[m.code]=m});
  var KEY='perioReview.done', KEYO='perioReview.open';
  function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  var done=load(KEY,{}), openMods=load(KEYO,{});
  var app=document.getElementById('app'), query='';
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function pad(n){return (n<10?'0':'')+n}
  function lit(s){return R[s.n]&&R[s.n].lit?R[s.n].lit:s.lit}
  function hay(s){
    var r=R[s.n], t=[s.topic,MOD[s.mod].name,'S'+pad(s.n)];
    lit(s).forEach(function(x){t.push(x.a,x.t,x.y)});
    if(r){t.push(r.oneLine);(r.takeHome||[]).forEach(function(x){t.push(x.h,x.b)});(r.compare||[]).forEach(function(x){t.push(x.old,x.now)});(r.numbers||[]).forEach(function(x){t.push(x.d)})}
    return t.join(' ').toLowerCase();
  }
  var HAY={}; D.sessions.forEach(function(s){HAY[s.n]=hay(s)});

  var MAIL='chygwu@gmail.com';
  function report(n){
    var s=n?S[n]:null, where=s?('S'+pad(n)+' '+s.topic):'目錄／整體網頁';
    var url='';try{url=location.href}catch(e){} if(!/^https?:/.test(url)) url='';
    var subj='【複習手冊回報】'+where;
    var body='回報堂次：'+where+'\n問題類型（數據不實／疑似捏造／網頁問題／其他）：\n問題所在的段落或文字：\n正確內容或原文出處（頁碼、PMID）：'+(url?'\n\n頁面：'+url:'');
    var href='mailto:'+MAIL+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
    return '<aside class="report"><h2>發現錯誤？請回報</h2><p>數據不實、疑似捏造，或網頁有問題，請寄信告訴我們，並附上段落與原文出處。</p>'+
      '<div class="row"><a class="btn" href="'+href+'" data-mailto="1">寫信回報</a><span class="mail">'+MAIL+'</span><button type="button" data-copy="'+MAIL+'">複製信箱</button></div>'+
      '<div class="fallback" hidden><p>如果沒有跳出郵件 App，請複製下面的內容，自己寄到 '+MAIL+'：</p><textarea readonly rows="7">'+esc('主旨：'+subj+'\n\n'+body)+'</textarea><button type="button" data-copytext="1">複製回報內容</button></div></aside>';
  }
  document.addEventListener('click',function(e){
    var m=e.target.closest&&e.target.closest('a[data-mailto]');
    if(m){ var fb=m.closest('.report').querySelector('.fallback'); setTimeout(function(){fb.hidden=false},600); return }
    var c=e.target.closest&&e.target.closest('button[data-copytext]');
    if(c){ var ta=c.parentNode.querySelector('textarea'); ta.focus(); ta.select();
      try{navigator.clipboard.writeText(ta.value).then(function(){c.textContent='已複製'},function(){c.textContent='已選取，請手動複製'})}catch(err){c.textContent='已選取，請手動複製'}
      return }
    var b=e.target.closest&&e.target.closest('button[data-copy]'); if(!b) return;
    var t=b.getAttribute('data-copy');
    function ok(){b.textContent='已複製'} 
    try{navigator.clipboard.writeText(t).then(ok,function(){sel(b)})}catch(err){sel(b)}
    function sel(b){var m=b.parentNode.querySelector('.mail');var r=document.createRange();r.selectNodeContents(m);var w=window.getSelection();w.removeAllRanges();w.addRange(r);b.textContent='已選取，請手動複製'}
  });
  function foot(){
    var y=new Date().getFullYear();
    return '<footer class="sitefoot"><div class="who">三軍總醫院 牙周病科　陳穎吾</div>'+
      '<p>© '+(y>2026?'2026–'+y:'2026')+' 三軍總醫院牙周病科　陳穎吾</p>'+
      '<p>本手冊採 <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/deed.zh-hant" target="_blank" rel="license noopener">CC BY-NC-ND 4.0</a> 授權：歡迎標示出處後原樣分享於學術與教學用途，不得商業使用或改作。</p>'+
      '<p>所引用文獻之內容、圖表與數據，著作權屬原作者及出版者所有，本手冊僅摘要並註明出處；數據與結論請以原文為準。</p>'+
      '<p>本手冊內容由 AI 協助整理，經作者與住院醫師對照原文核對；如有錯誤，歡迎回報。</p>'+'<p>本手冊為教學用途，不構成個別病人之診療建議。</p></footer>';
  }
  function home(){
    var n=D.sessions.length, c=Object.keys(done).length;
    var h='<header class="hero"><div class="in"><div class="hhead"><div class="htext"><span class="eyebrow">三軍總醫院 牙周病科 住院醫師課程</span><h1>牙周經典文獻複習手冊</h1>'+
      '<p>18 模組 · 52 堂｜從經典看見本質，用實證指導臨床</p></div>'+
      '<div class="stats"><div class="stat am"><b>266</b><span>篇經典文獻</span></div><div class="stat"><b>52</b><span>堂課，每堂一小時</span></div><div class="stat hl"><b>471</b><span>篇近期文獻與共識指引</span></div></div></div>'+
      '<div class="prog"><div class="bar"><i style="width:'+(c/n*100).toFixed(1)+'%"></i></div><span>已複習 '+c+' / '+n+'</span></div></div></header>'+
      '<div class="wrap"><div class="search"><input id="q" type="search" placeholder="搜尋主題、作者、關鍵字（例如 stippling、Lang）" value="'+esc(query)+'" autocomplete="off"></div><div id="list"></div>'+
      report(0)+foot()+'</div>';
    app.innerHTML=h;
    var q=document.getElementById('q');
    q.addEventListener('input',function(){query=q.value;renderList()});
    renderList();
  }
  function renderList(){
    var box=document.getElementById('list'), ql=query.trim().toLowerCase(), h='', any=false;
    D.modules.forEach(function(m){
      var ss=m.sessions.filter(function(n){return !ql||HAY[n].indexOf(ql)>=0});
      if(!ss.length) return; any=true;
      var open=ql||openMods[m.code];
      var dc=m.sessions.filter(function(n){return done[n]}).length;
      h+='<div class="mod'+(open?' open':'')+'" data-m="'+m.code+'"><button aria-expanded="'+(open?'true':'false')+'"><span class="mcode">'+m.code+'</span><span class="mname">'+esc(m.name)+'</span><span class="mcount">'+dc+'/'+m.sessions.length+' 堂</span><span class="chev" aria-hidden="true"></span></button><div class="slist">';
      ss.forEach(function(n){var s=S[n];
        h+='<a class="srow" href="#s'+pad(n)+'"><span class="snum">S'+pad(n)+'</span><span class="stitle">'+esc(s.topic)+'</span>'+
          (R[n]?'<span class="tag ready">重點</span>':'')+(done[n]?'<span class="tag done">已複習</span>':'')+'</a>';
      });
      h+='</div></div>';
    });
    box.innerHTML=any?h:'<div class="empty">找不到符合「'+esc(query)+'」的堂次</div>';
    box.querySelectorAll('.mod>button').forEach(function(b){b.addEventListener('click',function(){
      var el=b.parentNode, k=el.getAttribute('data-m'); el.classList.toggle('open');
      b.setAttribute('aria-expanded',el.classList.contains('open'));
      if(el.classList.contains('open'))openMods[k]=1;else delete openMods[k]; save(KEYO,openMods);
    })});
  }

  function litBlock(s){
    var L=lit(s), g={classic:[],new:[],cons:[],rel:[]};
    L.forEach(function(x){(g[x.r]||g.new).push(x)});
    function item(x){
      var pills=(x.s?'<span class="pill star">★ 首選</span>':'')+(x.src?'<span class="pill">'+esc(x.src)+'</span>':'')+
        (x.r==='rel'&&x.at?'<a href="#s'+pad(x.at)+'">主要在 S'+pad(x.at)+'</a>':'');
      return '<div class="lit"><span class="au">'+esc(x.a)+' ('+esc(x.y)+')</span><span class="ti">'+esc(x.t)+'</span><span class="mt">'+esc(x.j)+(x.pm?' · <a href="https://pubmed.ncbi.nlm.nih.gov/'+x.pm+'/" target="_blank" rel="noopener">PubMed</a>':'')+pills+'</span></div>';
    }
    function grp(title,arr,limit){
      if(!arr.length) return '';
      var h='<div class="litg"><h3>'+title+'（'+arr.length+'）</h3>';
      var a=arr.slice(0,limit||arr.length), b=limit?arr.slice(limit):[];
      h+=a.map(item).join('');
      if(b.length) h+='<details class="more"><summary>顯示其餘 '+b.length+' 篇</summary>'+b.map(item).join('')+'</details>';
      return h+'</div>';
    }
    var nw=g.new.slice().sort(function(a,b){return b.s-a.s});
    return grp('經典文獻',g.classic)+grp('近期文獻',nw,R[s.n]?0:4)+grp('共識與指引',g.cons)+grp('相關文獻（主題在其他堂）',g.rel);
  }

  function session(n){
    var s=S[n]; if(!s){home();return}
    var r=R[n], m=MOD[s.mod], idx=D.sessions.indexOf(s), pv=D.sessions[idx-1], nx=D.sessions[idx+1];
    var h='<div class="top"><div class="in"><a href="#">‹ 目錄</a><span class="where">'+m.code+' '+esc(m.name)+'</span></div></div><div class="wrap">'+
      '<div class="shead"><span class="eyebrow">第 '+pad(n)+' 堂</span><h1>'+esc(s.topic)+'</h1>';
    var secs=[];
    if(r){
      h+='<span class="status'+(r.status==='verified'?' ok':'')+'">'+(r.status==='verified'?'已核對':'草稿・待核對')+(r.statusNote?'｜'+esc(r.statusNote):'')+'</span></div>';
      secs=[['k','重點'],['c','新舊對照'],['n','關鍵數字'],['p','臨床應用'],['d','仍有爭議'],['qz','自我測驗'],['l','文獻']];
      h+='<nav class="jump" aria-label="本頁段落">'+secs.map(function(x){return '<button data-t="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</nav>';
      h+='<section class="blk" id="b-k"><h2>一句話重點</h2><div class="one">'+esc(r.oneLine)+'</div>'+
        (r.takeHome||[]).map(function(x,i){return '<div class="th"><b class="n">'+(i+1)+'</b><h3>'+esc(x.h)+'</h3><p>'+esc(x.b)+'</p></div>'}).join('')+'</section>';
      h+='<section class="blk" id="b-c"><h2>新舊對照</h2>'+(r.compare||[]).map(function(x){
        return '<div class="cmp"><div class="hd"><b>'+esc(x.c)+'</b><span class="v '+x.v+'">'+(x.v==='ok'?'仍適用':x.v==='upd'?'已更新':'需加條件')+'</span></div>'+
          '<div class="row"><span class="lab">經典</span><span>'+esc(x.old)+'</span></div><div class="row"><span class="lab">現在</span><span>'+esc(x.now)+'</span></div></div>'}).join('')+'</section>';
      h+='<section class="blk" id="b-n"><h2>關鍵數字</h2><div class="nums">'+(r.numbers||[]).map(function(x){return '<div class="num"><b>'+esc(x.k)+'</b><span>'+esc(x.d)+'</span></div>'}).join('')+'</div></section>';
      h+='<section class="blk" id="b-p"><h2>臨床應用</h2><ol class="steps">'+((r.clinical&&r.clinical.steps)||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol>'+
        ((r.clinical&&r.clinical.cases)||[]).map(function(x){return '<div class="case"><h3>'+esc(x.h)+'</h3><p>'+esc(x.b)+'</p></div>'}).join('')+'</section>';
      h+='<section class="blk" id="b-d"><h2>仍有爭議</h2><ul class="deb">'+(r.debates||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></section>';
      h+='<section class="blk" id="b-qz"><h2>自我測驗</h2><span class="score" id="score">0 / '+(r.quiz||[]).length+' 題答對</span>'+(r.quiz||[]).map(function(x,i){
        return '<div class="q" data-i="'+i+'"><span class="qq">'+(i+1)+'. '+esc(x.q)+'</span>'+x.o.map(function(o,j){return '<button class="opt" data-j="'+j+'">'+'ABCDE'[j]+'. '+esc(o)+'</button>'}).join('')+'</div>'}).join('')+'</section>';
    } else {
      h+='</div><section class="blk"><div class="todo">本堂重點整理中。上完課、大綱與內文定稿後，會補上重點、新舊對照、臨床應用與自我測驗。先從下方文獻清單開始預習。</div></section>';
    }
    h+='<section class="blk" id="b-l"><h2>文獻清單</h2>'+litBlock(s)+'</section>';
    if(s.related&&s.related.length) h+='<section class="blk"><h2>相關堂次</h2><div class="rel">'+s.related.map(function(k){return '<a href="#s'+pad(k)+'">S'+pad(k)+' '+esc(S[k].topic)+'</a>'}).join('')+'</div></section>';
    h+='<div class="foot"><button class="mark'+(done[n]?' on':'')+'" id="mark">'+(done[n]?'✓ 已複習（點一下取消）':'標記為已複習')+'</button><div class="pn">'+
      (pv?'<a href="#s'+pad(pv.n)+'"><small>‹ 上一堂</small>S'+pad(pv.n)+' '+esc(pv.topic)+'</a>':'<span style="flex:1"></span>')+
      (nx?'<a class="nx" href="#s'+pad(nx.n)+'"><small>下一堂 ›</small>S'+pad(nx.n)+' '+esc(nx.topic)+'</a>':'<span style="flex:1"></span>')+'</div></div>';
    h+=report(n)+foot()+'</div>';
    app.innerHTML=h; window.scrollTo(0,0);
    document.getElementById('mark').addEventListener('click',function(){if(done[n])delete done[n];else done[n]=1;save(KEY,done);session(n)});
    app.querySelectorAll('.jump button').forEach(function(b){b.addEventListener('click',function(){var el=document.getElementById('b-'+b.getAttribute('data-t'));if(el)el.scrollIntoView({behavior:'smooth',block:'start'})})});
    var right=0;
    app.querySelectorAll('.q').forEach(function(q){
      var i=+q.getAttribute('data-i'), x=r.quiz[i], answered=false;
      q.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){
        if(answered) return; answered=true; var j=+b.getAttribute('data-j');
        if(j===x.a){b.classList.add('right');right++}else{b.classList.add('wrong');q.querySelector('[data-j="'+x.a+'"]').classList.add('right')}
        var e=document.createElement('p');e.className='exp';e.textContent=(j===x.a?'答對了。':'正確答案是 '+'ABCDE'[x.a]+'。')+x.e;q.appendChild(e);
        document.getElementById('score').textContent=right+' / '+r.quiz.length+' 題答對';
      })});
    });
  }
  // Navigation works even where the page cannot change its own URL (previews, sandboxed viewers):
  // internal links are intercepted and rendered directly; the URL hash is updated only when allowed.
  var cur='';
  function show(h){cur=h||'';var m=cur.match(/^#s(\d{1,2})$/);if(m&&S[+m[1]])session(+m[1]);else home()}
  function go(h){
    try{ if(location.hash!==h){ history.pushState(null,'',h||location.pathname+location.search) } }catch(e){}
    show(h);
  }
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href^="#"]'); if(!a) return;
    e.preventDefault(); go(a.getAttribute('href')==='#'?'':a.getAttribute('href'));
  });
  window.addEventListener('popstate',function(){var h='';try{h=location.hash}catch(e){}show(h)});
  window.addEventListener('hashchange',function(){var h='';try{h=location.hash}catch(e){}if(h!==cur)show(h)});
  var h0='';try{h0=location.hash}catch(e){} show(h0);
})();
</script>
