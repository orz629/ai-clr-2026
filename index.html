<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15262E">
<title>牙周經典文獻複習手冊｜三軍總醫院牙周病科</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* Layout: one phone-width column; home = module index, #sNN = one session's review card stack. */
:root{
  --bg:#F3F5F2; --card:#FFFFFF; --ink:#1B2A31; --muted:#56656B; --line:#D7DFDC;
  --deep:#15262E; --deep-ink:#F3F5F2; --teal:#1F7A72; --teal-soft:#E2EFEC; --amber:#A8650F; --amber-soft:#FBEFD9;
  --good:#2E6B3A; --good-soft:#E3F0E2; --bad:#9B2C2C; --bad-soft:#F8E4E2;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10191D; --card:#18242A; --ink:#E6ECEA; --muted:#9AAAAE; --line:#2A3A40;
  --deep:#0B1316; --deep-ink:#E6ECEA; --teal:#5FB8AE; --teal-soft:#1C3532; --amber:#E2A35A; --amber-soft:#33281A;
  --good:#8FCB8A; --good-soft:#1E3020; --bad:#F09A90; --bad-soft:#3A2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10191D; --card:#18242A; --ink:#E6ECEA; --muted:#9AAAAE; --line:#2A3A40;
  --deep:#0B1316; --deep-ink:#E6ECEA; --teal:#5FB8AE; --teal-soft:#1C3532; --amber:#E2A35A; --amber-soft:#33281A;
  --good:#8FCB8A; --good-soft:#1E3020; --bad:#F09A90; --bad-soft:#3A2220; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--teal)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
.hero{background:var(--deep);color:var(--deep-ink);padding-block:28px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero .in{max-width:720px;margin:0 auto;display:grid;gap:10px}
.eyebrow{font-size:.78rem;letter-spacing:.12em;color:#8FCFC6;font-weight:500}
.hero h1{font-family:var(--serif);font-size:1.75rem;line-height:1.3}
.hero p{margin:0;color:#BFD0D3;font-size:.92rem}
.hero .hhead,.htext{display:grid;gap:10px}
.stats{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:12px;margin:8px 0 4px}
.stat{border-top:2px solid #F3F5F2;padding-top:6px;min-width:0}
.stat b{display:block;font-family:var(--serif);font-weight:700;font-size:1.45rem;line-height:1.15;color:#F3F5F2;font-variant-numeric:lining-nums}
.stat span{display:block;margin-top:3px;font-size:.7rem;line-height:1.45;color:#BFD0D3}
.stat.hl{border-top-color:#8FCFC6}.stat.hl b{color:#8FCFC6}
.stat.am{border-top-color:#E2A35A}.stat.am b{color:#E2A35A}
@media (min-width:760px){
.hero .hhead{grid-template-columns:1fr 340px;align-items:start;column-gap:24px}
.stats{gap:12px;margin:2px 0 0}
.stat b{font-size:1.7rem}
.stat span{font-size:.72rem}}
.prog{display:flex;align-items:center;gap:10px;font-size:.85rem;color:#BFD0D3;font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;background:#2C4048;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:#8FCFC6;border-radius:99px}
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:12px 8px}
.search input{width:100%;font:16px var(--sans);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.hint{color:var(--muted);font-size:.85rem;margin:6px 2px 0}
.mod{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mod>button{width:100%;display:flex;gap:12px;align-items:center;background:none;border:0;padding:14px 16px;text-align:left;cursor:pointer}
.mcode{font-family:var(--serif);font-weight:700;font-size:1.15rem;color:var(--teal);width:1.4em;flex:none}
.mname{flex:1;font-weight:700;min-width:0}
.mcount{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s;flex:none;margin-right:4px}
.mod.open .chev{transform:rotate(45deg)}
.slist{display:none;border-top:1px solid var(--line)}
.mod.open .slist{display:block}
.srow{display:flex;gap:12px;align-items:center;padding:12px 16px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.snum{font:500 .8rem var(--sans);color:var(--muted);font-variant-numeric:tabular-nums;width:2.4em;flex:none}
.stitle{flex:1;min-width:0;font-size:.95rem}
.tag{font-size:.7rem;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.ready{background:var(--teal-soft);color:var(--teal)}
.tag.done{background:var(--good-soft);color:var(--good)}
.empty{padding:24px;text-align:center;color:var(--muted)}
/* session */
.top{position:sticky;top:0;z-index:6;background:var(--deep);color:var(--deep-ink);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--deep)}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top a{color:var(--deep-ink);text-decoration:none;font-size:.9rem;display:flex;align-items:center;gap:4px}
.top .where{font-size:.8rem;color:#9FB6BA;margin-left:auto;text-align:right}
.shead{padding-block:22px 6px;display:grid;gap:8px}
.shead .eyebrow{color:var(--teal)}
.shead h1{font-family:var(--serif);font-size:1.6rem;line-height:1.35;text-wrap:pretty}
.status{font-size:.8rem;border-radius:8px;padding:6px 10px;background:var(--amber-soft);color:var(--amber);justify-self:start}
.status.ok{background:var(--good-soft);color:var(--good)}
.jump{position:sticky;top:40px;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:.82rem;cursor:pointer}
section.blk{margin-top:18px;display:grid;gap:10px;scroll-margin-top:110px}
section.blk>h2{font-size:1.05rem;display:flex;align-items:center;gap:8px}
section.blk>h2::before{content:"";width:4px;height:1.1em;background:var(--teal);border-radius:2px}
.one{background:var(--deep);color:var(--deep-ink);border-radius:12px;padding:18px;font-family:var(--serif);font-size:1.15rem;line-height:1.6}
.th{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.th b.n{font-family:var(--serif);color:var(--teal);font-size:1.3rem;line-height:1.2;grid-row:span 2}
.th h3{font-size:1rem}
.th p{margin:0;color:var(--muted);font-size:.92rem}
.cmp{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cmp .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.cmp .hd b{font-size:.95rem}
.v{font-size:.75rem;padding:2px 10px;border-radius:99px;white-space:nowrap}
.v.ok{background:var(--good-soft);color:var(--good)}
.v.cond{background:var(--amber-soft);color:var(--amber)}
.v.upd{background:var(--teal-soft);color:var(--teal)}
.cmp .row{display:grid;grid-template-columns:3.2em 1fr;gap:8px;padding:10px 14px;font-size:.92rem}
.cmp .row+.row{border-top:1px dashed var(--line)}
.cmp .lab{font-size:.75rem;color:var(--muted);padding-top:3px}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.num{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;min-width:0}
.num b{font-family:var(--serif);font-size:1.25rem;color:var(--teal);font-variant-numeric:tabular-nums;line-height:1.25}
.num span{font-size:.82rem;color:var(--muted)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:6px}
ol.steps li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 44px;position:relative;font-size:.93rem}
ol.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--teal);color:var(--card);font-size:.75rem;display:grid;place-items:center;font-weight:700}
.case{background:var(--teal-soft);border-radius:12px;padding:12px 14px}
.case h3{font-size:.95rem;margin-bottom:2px}
.case p{margin:0;font-size:.92rem}
ul.deb{margin:0;padding:0;list-style:none;display:grid;gap:6px}
ul.deb li{background:var(--amber-soft);border-radius:10px;padding:10px 12px;font-size:.92rem}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.q .qq{font-weight:700;font-size:.97rem}
.q button.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:.93rem}
.q button.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.q button.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.q .exp{font-size:.9rem;color:var(--muted);border-left:3px solid var(--teal);padding-left:10px}
.score{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.litg h3{font-size:.85rem;color:var(--muted);font-weight:500;margin:6px 2px 4px}
.lit{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px;font-size:.88rem;margin-bottom:6px}
.lit .au{font-weight:700}
.lit .ti{color:var(--ink)}
.lit .mt{color:var(--muted);font-size:.8rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:.7rem;padding:1px 8px;border-radius:99px;background:var(--teal-soft);color:var(--teal)}
.pill.star{background:var(--amber-soft);color:var(--amber)}
.pill.cl{background:var(--deep);color:var(--deep-ink)}
details.more summary{cursor:pointer;color:var(--teal);font-size:.88rem;padding:6px 2px}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel a{text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:.85rem;color:var(--ink)}
.todo{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);font-size:.92rem}
.foot{margin-top:28px;display:grid;gap:10px}
.mark{width:100%;border:1px solid var(--teal);background:var(--teal);color:var(--card);border-radius:12px;padding:13px;font-weight:700;cursor:pointer}
.mark.on{background:transparent;color:var(--teal)}
.pn{display:flex;gap:8px}
.pn a{flex:1;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font-size:.85rem;min-width:0}
.pn a small{display:block;color:var(--muted)}
.pn a.nx{text-align:right}
.sitefoot{margin-top:32px;padding-top:20px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:.78rem;line-height:1.7;display:grid;gap:8px}
.sitefoot .who{color:var(--ink);font-size:.95rem;font-weight:700;letter-spacing:.04em}
.sitefoot p{margin:0;text-wrap:pretty}
.note{font-size:.78rem;color:var(--muted);margin-top:24px;text-align:center}
.report{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.report h2{font-size:.95rem}
.report p{margin:0;font-size:.85rem;color:var(--muted)}
.report .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.report a.btn{background:var(--teal);color:var(--card);text-decoration:none;border-radius:10px;padding:9px 14px;font-weight:700;font-size:.9rem}
.report .mail{font-size:.85rem;user-select:all;color:var(--ink)}
.report textarea{width:100%;font:13px/1.5 var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
.report .fallback{display:grid;gap:8px}
.report .fallback[hidden]{display:none}
.report button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-size:.85rem;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<script id="review-data" type="application/json">{"1":{"status":"draft","statusNote":"數字與摘要經教師核實，書目依 PubMed 更正（2026-10-22）","oneLine":"牙齦外觀只能輔助判讀；「2 mm 角化牙齦」已從絕對門檻變成看菌斑控制與跨科需求的情境判斷，而牙周表型可以靠自體移植改變。","takeHome":[{"h":"外觀特徵只是輔助","b":"stippling 會因年齡與表型而缺席（Greene 1962）；MGJ 的組織學界線是結締組織中彈性纖維突然出現的地方，不是表面凹溝或角化邊界（Lozdan & Squier 1969）。判斷健康還是要看 PPD、BoP 與 CAL。"},{"h":"「2 mm」是情境判斷，不是手術門檻","b":"Lang & Löe 1972 的 2 mm 來自短期、嚴格控菌的模型；2017 共識認為口腔衛生良好者沒有最低 KTW 需求（Cortellini & Bissada 2018）。即將唇側矯正移動或做齦下邊緣、又是薄表型時，才考慮表型改造（Kao 2020）。"},{"h":"表型可以被改變","b":"Biotype 改稱 Phenotype，強調可經治療改變。要加厚選 CTG、要加寬角化選 FGG；術後 GT 每多 1 mm，未來退縮少 0.71 mm（Barootchi 2020）；術後 KTW 越寬，齦緣長期越穩定（Carbone 2023）。"}],"compare":[{"c":"Greene 1962","old":"stippling 是附連牙齦的特徵，發炎擴散時會消失，治療後多數會恢復","v":"cond","now":"需加條件。20 例治療後有 19 例恢復，但也有組織已健康卻始終沒有 stippling 的個案；薄表型者常不明顯。不可單憑 stippling 診斷，要合併 PPD、BoP、CAL 與探針透光法（Greene 1962；Cortellini & Bissada 2018）。"},{"c":"Holmes 1965","old":"牙間乳突的常態是凹陷的 col；切除後多數長不回原本高度","v":"upd","now":"已更新。col 形態的觀察仍成立，但處置觀念已改：前牙美觀區避免切除乳突，切線採保留乳突的翻瓣設計；已出現黑三角時，考慮調整接觸點或做軟組織重建（Cortellini & Bissada 2018）。"},{"c":"Lozdan & Squier 1969","old":"MGJ 以結締組織中彈性纖維的突然出現來定義，凹溝與角化邊界都不可靠","v":"ok","now":"仍適用。臨床上用 roll test，利用齒槽黏膜可移動的特性定位 MGJ；做 CAF 或 APF 時，減張要越過 MGJ 切開深層彈性纖維與骨膜，翻瓣才能無張力移位（Lozdan & Squier 1969；Cortellini & Bissada 2018）。"},{"c":"Lang & Löe 1972","old":"角化牙齦 < 2 mm 的牙面，即使沒有菌斑仍持續發炎，因此需要至少 2 mm","v":"cond","now":"需加條件。長期追蹤研究（Kennedy 1985、Wennström 1987，引述）與 2017 共識顯示，口腔衛生良好時 KTW < 2 mm 也能維持附連穩定（Cortellini & Bissada 2018）；衛生差、要唇側矯正或做齦下邊緣時，再考慮表型改造（Kao 2020）。"},{"c":"Perlmutter & Tal 1986","old":"牙齦去色素後，黑色素可能在數年後自行回來","v":"cond","now":"需加條件。原始證據只有 2 例，1 例術後 32 個月起回色、7 年時幾乎完全重現，另 1 例 8 年未回色（Perlmutter & Tal 1986）；黑色素細胞位於基底層、可從周邊遷移（Bartold 2000），無論用哪種方法都無法保證不回色。術前一定要說明回色風險。"}],"numbers":[{"k":"19 / 20","d":"Greene 1962：接受治療的 20 例中 19 例恢復 stippling；另有 1 例術後 93 天組織已健康，仍沒有 stippling"},{"k":"30 / 32","d":"Holmes 1965：16 位牙科學生的 32 個乳突標本中，30 個呈凹陷的 col；23 個表面上皮未角化"},{"k":"22 / 30","d":"Holmes 1965：切除後再生的乳突有 22 個長不回原高度，接觸點下留下 0.5–2.0 mm 空隙"},{"k":"10 / 19","d":"Lozdan & Squier 1969：表面黏膜牙齦凹溝只在 10 個標本看得到（人 12 例、猴 7 例）"},{"k":"1,406 面","d":"Lang & Löe 1972：32 位牙科學生、監督潔牙 6 週；KTW ≥ 2 mm 的牙面八成以上維持 GI = 0"},{"k":"32 個月","d":"Perlmutter & Tal 1986：病例 A 術後 32 個月開始回色，7 年時手術區幾乎全部回色；病例 B 追蹤 8 年都沒有回色"},{"k":"98–99%","d":"連續多次探測不出血，對牙周穩定的陰性預測值；單次 BoP 陽性的陽性預測值只有約 30%（Lang & Bartold 2018，引述 Lang 1990、1996）"},{"k":"≤ 1.0 mm","d":"探針透光法看得到探針即為薄型；檢查者間一致性 85%（κ = 0.7）（De Rouck 2009，引述於 Cortellini & Bissada 2018）"},{"k":"51.9% / 42.3%","d":"Zweers 2014（12 篇）：厚型與薄型的盛行率；犬齒區 GT 最薄，加權平均 0.80 mm"},{"k":"+0.66 / +4.72 mm","d":"Barootchi 2020（105 篇 RCT）：CTG 增加 GT 最多（0.66 mm）；非根面覆蓋手術中 FGG 增加 KTW 最多（4.72 mm）"},{"k":"−0.71 mm","d":"Barootchi 2020：術後早期 GT 每多 1 mm，未來退縮少 0.71 mm"},{"k":"0.2–0.5 mm","d":"Schulze 2024：臨床 CBCT 的實際解析度大約只能分辨這個大小以上的細節；體素大小不等於解析度"},{"k":"54%","d":"CBCT 判讀 < 1 mm 薄骨板的準確度，常把極薄骨板誤判為骨裂（Schulze 2024 引述）"},{"k":"20–25%","d":"Kao 2020：矯正後 2–5 年出現牙齦退縮的病人比例"},{"k":"40 篇","d":"Carbone 2023：追蹤 5–20 年的研究；術後 6–12 個月的 KTW 越寬，齦緣長期越穩定"}],"clinical":{"steps":["先判斷健康：PPD、BoP（約 0.25 N）、CAL；stippling 只當輔助","找 MGJ：roll test，必要時用碘液染色","量 KTW；附連牙齦 = KTW − 探測深度","探針透光法評估 GT（看得到 ≤ 1 mm 薄型，看不到 > 1 mm 厚型）；不要看牙冠形狀猜","需要評估骨板時，記得 CBCT 的解析度極限；拍攝時用棉捲拉開嘴唇可改善軟組織對比","問清楚接下來的治療：唇側矯正、齦下邊緣修復、美觀需求","決定是否表型改造：加厚選 CTG，加寬角化選 FGG"],"cases":[{"h":"矯正前的薄表型下顎門牙（教學模擬）","b":"22 歲，準備唇側擴張矯正，探針透光可見、KTW 0.5 mm。依 Kao 2020，矯正前先以 FGG 或 SCTG 改造表型，成熟 2–3 個月後再開始移動牙齒。"},{"h":"薄表型上做齦下邊緣的前牙全瓷冠（教學模擬）","b":"35 歲，上顎正中門牙要做全瓷冠，邊緣預計放在齦溝內、探針透光可見。先做 SCTG 加厚到 GT > 1 mm，成熟 2–3 個月再修邊緣、取模（Barootchi 2020；Kao 2020）。"},{"h":"病人要求牙齦去色素（教學模擬）","b":"28 歲，因笑時牙齦黑色素影響美觀。術前說明可能數年後回色、顏色通常較淡；簽知情同意，吸菸者建議先戒菸（Perlmutter & Tal 1986）。"}]},"debates":["Greene 1962、Holmes 1965、Lozdan & Squier 1969 都是描述性觀察，沒有推論統計，數字只能當描述參考。","Lang & Löe 1972 是短期、嚴格控菌的模型，也沒有提供標準差與信賴區間；2 mm 能否套用到一般病人，已被長期追蹤研究挑戰（Kennedy 1985 等，引述）。","Kao 2020 對矯正與修復前表型改造的建議，內文標示為專家意見。","探針透光法再現性高，但只是以 1 mm 為界的二分法，無法得到實際厚度；IOS 與 CBCT 疊合可量面積與體積，仍屬新興方法（Yi Te Lin 2025）。","CBCT 容易把極薄骨板判讀成骨裂；看不到骨頭，不等於真的沒有骨頭（Schulze 2024）。","去色素後的回色比例差異很大、無法預測，經典證據只有 2 例。"],"quiz":[{"q":"Lozdan & Squier 1969 認為，哪一個特徵最能在組織學上穩定標出 MGJ？","o":["表面黏膜牙齦凹溝","上皮由角化轉為非角化的位置","結締組織中彈性纖維突然出現的位置","上皮釘突的形態"],"a":2,"e":"凹溝只在約一半標本看得到，角化也常越過 MGJ；附連牙齦固有層幾乎沒有彈性纖維，齒槽黏膜則很多，交界是突然改變。"},{"q":"關於 Lang & Löe 1972 的研究設計，下列何者不正確？","o":["受試者是 32 位牙科學生","先監督潔牙 6 週","用 Schiller 碘液標出 MGJ","追蹤了 10 年的附連變化"],"a":3,"e":"這是 6 週嚴格控菌後的短期觀察；長期追蹤是後來 Kennedy 1985 等研究做的，也正是這些研究修正了 2 mm 的觀念。"},{"q":"Holmes 1965 切除牙間乳突後追蹤再生，結果最接近哪一項？","o":["幾乎全部長回原本高度與形態","多數長不回原高度，形態也常變平或凸起","只有前牙長不回來","再生的乳突全部完整角化"],"a":1,"e":"30 個中有 22 個留下 0.5–2.0 mm 空隙，形態也改變；這是現代避免切除乳突、改用保留乳突翻瓣的歷史起點。"},{"q":"Barootchi 2020 網絡統合分析中，術後牙齦厚度（GT）每多 1 mm，未來退縮如何變化？","o":["增加 0.71 mm","減少 0.71 mm","減少 0.17 mm","沒有關係"],"a":1,"e":"術後早期 GT 越厚，日後退縮越少，每 1 mm 約少 0.71 mm。"},{"q":"用探針透光法評估牙齦表型，下列何者正確？","o":["看得到探針代表厚型","看得到探針代表 GT ≤ 1.0 mm 的薄型","需要局部麻醉","可以直接量出牙齦厚度的數值"],"a":1,"e":"探針放入唇側齦溝，透得出探針影子為薄型（≤ 1.0 mm），看不到為厚型；不需麻醉，但只能二分，量不出實際數值。"},{"q":"KTW 1 mm、無 BoP、口腔衛生極佳、沒有退縮，也沒有矯正或修復計畫。最恰當的處置是？","o":["KTW < 2 mm，一定要做 FGG","定期維護觀察即可","立刻做 CTG 加厚","拔牙後植牙"],"a":1,"e":"衛生良好、無發炎與退縮時不需要手術；若之後要唇側矯正或做齦下邊緣，再評估表型改造（Cortellini & Bissada 2018；Kao 2020）。"},{"q":"CBCT 報告寫「下顎門牙唇側看不到骨板，疑似骨裂」，最恰當的解讀是？","o":["確定有骨裂，需要手術","薄骨板可能低於 CBCT 的實際解析度，看不到不代表沒有","換更小的體素就能精準到 0.1 mm","CBCT 一定會低估骨裂，實際更嚴重"],"a":1,"e":"臨床 CBCT 實際只能分辨約 0.2–0.5 mm 以上的細節，體素大小不等於解析度；極薄骨板容易被誤判為骨裂（Schulze 2024）。"}],"lit":[{"a":"Greene AH","y":"1962","t":"A study of the characteristics of stippling and its relation to gingival health","j":"J Periodontol（PubMed 未收錄，PMID 待確認）","pm":"","r":"classic","s":0,"src":""},{"a":"Holmes CH","y":"1965","t":"Morphology of the interdental papillae","j":"J Periodontol","pm":"5214409","r":"classic","s":0,"src":""},{"a":"Lozdan J & Squier CA","y":"1969","t":"The histology of the muco-gingival junction","j":"J Periodontal Res","pm":"4242747","r":"classic","s":0,"src":""},{"a":"Lang NP & Löe H","y":"1972","t":"The relationship between the width of keratinized gingiva and gingival health","j":"J Periodontol","pm":"4507712","r":"classic","s":0,"src":""},{"a":"Perlmutter S & Tal H","y":"1986","t":"Repigmentation of the gingiva following surgical injury","j":"J Periodontol","pm":"3456040","r":"classic","s":0,"src":""},{"a":"Bartold PM et al.","y":"2000","t":"Molecular and cell biology of the gingiva","j":"Periodontol 2000","pm":"11276872","r":"new","s":1,"src":"Perio 2000"},{"a":"Zweers J et al.","y":"2014","t":"Characteristics of periodontal biotype, its dimensions, associations and prevalence: a systematic review","j":"J Clin Periodontol","pm":"24836578","r":"new","s":1,"src":"JCP"},{"a":"Barootchi S et al.","y":"2020","t":"Gingival phenotype modification therapies on natural teeth: A network meta-analysis","j":"J Periodontol","pm":"32392401","r":"new","s":0,"src":"JP"},{"a":"Carbone AC et al.","y":"2023","t":"Long-term stability of gingival margin and periodontal soft-tissue phenotype achieved after mucogingival therapy: A systematic review","j":"J Clin Periodontol","pm":"37963451","r":"new","s":0,"src":"JCP"},{"a":"Schulze R et al.","y":"2024","t":"Accuracy of cone-beam computed tomography in imaging the components of the periodontal phenotype","j":"Periodontol 2000","pm":"38546140","r":"new","s":0,"src":"Perio 2000"},{"a":"Te Lin Y et al.","y":"2025","t":"Three-dimensional digital quantitative analysis of periodontal and peri-implant phenotype: A narrative review","j":"Periodontol 2000","pm":"40641458","r":"new","s":0,"src":"Perio 2000"},{"a":"Kao RT et al.","y":"2020","t":"American Academy of Periodontology best evidence consensus statement on modifying periodontal phenotype in preparation for orthodontic and restorative treatment","j":"J Periodontol","pm":"31943219","r":"cons","s":0,"src":""},{"a":"Lang NP & Bartold PM","y":"2018","t":"Periodontal health","j":"J Clin Periodontol","pm":"29926485","r":"rel","s":0,"src":"","at":4},{"a":"Cortellini P & Bissada NF","y":"2018","t":"Mucogingival conditions in the natural dentition: Narrative review, case definitions, and diagnostic considerations","j":"J Clin Periodontol","pm":"29926504","r":"rel","s":0,"src":"","at":39}]},"2":{"status":"draft","statusNote":"數字與摘要經教師核實，書目依 PubMed 更正（2026-10-22）","oneLine":"生物寬度（現稱 STA）沒有通用數字，要在消炎後個別量；根面清創的目標是去污染，不是把牙骨質刮光；唇側骨板普遍薄於 1 mm，CBCT 看不到不代表沒有。","takeHome":[{"h":"STA 因人而異，沒有神奇數字","b":"Gargiulo 1961 的平均值是 2.04 mm，但 Schmidt 2013 統整後個體範圍為 0.2–6.73 mm；2017 世界研討會改稱 supracrestal tissue attachment（Jepsen 2018）。先消炎，再於局麻下 bone sounding 量出個人值。"},{"h":"清創是去污染，不是刮光牙骨質","b":"內毒素只停留在根面表層約 40–70 µm，而且結合鬆散（Bosshardt & Selvig 1997 引述 Nakib 1982）；頸部負責錨定的 AEFC 只有約 50–100 µm 厚，不要追求「玻璃般平滑」。"},{"h":"骨板薄是常態，影像有盲區","b":"後牙小臼齒有 68% 位點唇側骨板 < 1 mm（Temple 2017），上顎前牙也很少超過 1 mm（Tsigarida 2020）；CBCT 對 < 0.45–0.5 mm 的骨板顯影不到，植體周圍還有金屬假影（Dhondt 2022）。"}],"compare":[{"c":"Gargiulo 1961","old":"接合上皮 0.97 mm + 結締組織附連 1.07 mm ≈ 2.04 mm，結締組織附連最恆定","v":"cond","now":"需加條件。2.04 mm 是屍體切片的群體平均，還有組織收縮誤差；個體範圍 0.2–6.73 mm（Schmidt 2013），2017 改稱 STA（Jepsen 2018）。不要套用固定的 2 mm 或 3 mm 公式。"},{"c":"Listgarten 1972","old":"齦切後 12 天，接合上皮就以半橋粒與內基底膜重新附連","v":"ok","now":"仍適用，但只有 2 隻猴子、無牙菌斑模型。內文提醒人類 SRP 後組織完全成熟需 4–6 週，第一次再評估排在 4–6 週，術後早期避免反覆探測。"},{"c":"Zander & Hurzeler 1958","old":"牙骨質終生持續沉積，根尖快、頸部慢","v":"ok","now":"仍適用。Bosshardt & Selvig 1997 進一步說明：頸部 AEFC 沉積慢、負責錨定；根尖與根岔區 CIFC 沉積快、負責修復。老年人根尖牙骨質增厚多屬生理代償。"},{"c":"Stahl 1975","old":"病理根面被深層毒化，需要把病變牙骨質刮除","v":"upd","now":"已更新。內毒素只在表層約 40–70 µm 且結合鬆散（Bosshardt & Selvig 1997 引述 Nakib 1982）；改用細超音波頭與甘胺酸噴砂溫和去污染，堅硬結石照樣移除，但保留 AEFC。"},{"c":"Temple 2017","old":"後牙唇側骨板多數 < 1 mm，17.2% 在 CBCT 上看不到骨板","v":"cond","now":"需加條件。CBCT 對 < 0.45–0.5 mm 的骨板顯影不到（Dhondt 2022，體外資料），影像上的「缺失」可能只是很薄。拔牙前搭配 bone sounding；高風險部位考慮齒槽脊保存。"}],"numbers":[{"k":"2.04 mm","d":"Gargiulo 1961：30 例屍體、325 個牙面；接合上皮 0.97 mm + 結締組織附連 1.07 mm（齦溝 0.69 mm）"},{"k":"1.08 → 1.05 mm","d":"Gargiulo 1961：被動萌出四期中結締組織附連幾乎不變，接合上皮則由 1.35 mm 縮短到 0.71 mm"},{"k":"0.2–6.73 mm","d":"Schmidt 2013（14 篇）：生物寬度的個體範圍；兩組統合分析平均 2.15 與 2.30 mm"},{"k":"12 天","d":"Listgarten 1972：猴子齦切後接合上皮重新附連；人類組織成熟約需 4–6 週（內文說明）"},{"k":"約 3 µm／年","d":"Zander & Hurzeler 1958：233 顆單根牙，全根牙骨質平均厚度由 0.076 mm（11–20 歲）增加到 0.215 mm（51–76 歲）"},{"k":"約 5.5 倍","d":"Zander & Hurzeler 1958：根尖的牙骨質沉積速率約為頸部的 5.5 倍"},{"k":"40–70 µm","d":"內毒素在病理根面的滲透深度（Bosshardt & Selvig 1997 引述 Nakib 1982）"},{"k":"約 30,000 / mm²","d":"Bosshardt & Selvig 1997：AEFC 的 Sharpey's fibers 密度；CIFC 沉積可比 AEFC 快約 30 倍"},{"k":"4–8 週","d":"刮除後根面超礦化層重新建立的時間（Bosshardt & Selvig 1997 引述 Selvig & Hals 1977）"},{"k":"68%","d":"Temple 2017（265 人、934 顆後牙）：小臼齒在骨頂下 1、3、5 mm 合計有 68% 位點 BBT < 1 mm"},{"k":"17.2%","d":"Temple 2017：CBCT 上看不到唇側骨板的比例；下顎第一小臼齒 19.4%、上顎第一大臼齒近心根 21.1%，女性較多"},{"k":"+0.32 mm","d":"Tsigarida 2020（50 篇）：以 CEJ 為參考，犬齒冠側骨板比側門牙厚（95% CI 0.11–0.54）；男性根尖區厚 0.21 mm"},{"k":"−0.15 mm","d":"Dhondt 2022：體外研究統合，CBCT 平均低估植體唇側骨板厚度（95% CI −0.26 至 −0.03）"},{"k":"< 0.45–0.5 mm","d":"Dhondt 2022：骨板薄於此值時 CBCT 顯影不到（體外資料）；金屬假影會讓植體影像膨脹 20–25%"}],"clinical":{"steps":["先消炎：完成第一階段治療；發炎時探針會穿透接合上皮，量測不準","探針透光法評估牙齦表型：薄型（≤ 1 mm）或厚型（> 1 mm）","組織健康後，局麻下 bone sounding，扣掉探測深度，算出這個人的 STA","規劃修復邊緣或牙冠增長時，留出這個人的 STA，不套固定 3 mm","根面清創：移除結石與生物膜即可，用細超音波頭、噴砂，保留 AEFC","拔牙或植牙前評估骨板：CBCT 看整體，看不到骨板時用 sounding 確認","第一次再評估排在治療後 4–6 週，早期避免反覆探測"],"cases":[{"h":"前牙深部牙齒斷裂（教學模擬）","b":"35 歲，11 斷到唇側 CEJ 下 1.5 mm，薄表型。消炎後 sounding 測得 STA 2.5 mm，直接做牙冠會侵犯 STA；再加上 ferrule 的需求，美觀區優先考慮矯正拉出，最後只做小範圍牙冠增長。"},{"h":"重度牙周炎的根面處理（教學模擬）","b":"50 歲，Stage III Grade B，PPD 6–8 mm。堅硬結石照樣移除，但不追求玻璃般平滑；細超音波頭用中低功率輕刷，配合甘胺酸或赤藻糖醇噴砂去污染，保留 AEFC（Bosshardt & Selvig 1997）。"},{"h":"上顎側門牙立即植牙（教學模擬）","b":"28 歲，22 垂直根裂，CBCT 上看不到唇側骨板。先用 sounding 確認是否還有極薄骨壁；不翻瓣微創拔牙、植體偏腭側、唇側留 ≥ 2 mm 間隙填 DBBM，必要時加 CTG 加厚（Tsigarida 2020；Dhondt 2022）。"}]},"debates":["Schmidt 2013 納入的研究在量測方法與結果指標上差異很大，平均值只能參考。","修復邊緣侵犯 STA 造成破壞的機轉仍不清楚：菌斑滯留、操作創傷、材料毒性都可能，或是合併作用（Jepsen 2018）。","Listgarten 1972 只有 2 隻猴子，人類的癒合時程屬外推。","內毒素滲透深度、超礦化層重建等數據，多為 Bosshardt & Selvig 1997 引述的早期研究，屬二手資料。","Dhondt 2022 的 CBCT 低估量與 0.45 mm 閾值來自體外研究，納入研究偏差風險高；活體情況可能更差。","超音波量骨板誤差低、沒有輻射，但研究很少、依賴操作者，還不能當常規工具（Dhondt 2022）。"],"quiz":[{"q":"Gargiulo 1961 依被動萌出分四期比較，哪一項維度在各期最穩定？","o":["齦溝深度","接合上皮長度","結締組織附連長度","CEJ 到骨頂的距離"],"a":2,"e":"結締組織附連在四期分別約 1.08、1.07、1.05、1.05 mm，接合上皮則由 1.35 mm 縮到 0.71 mm。"},{"q":"Schmidt 2013 系統性回顧中，生物寬度的個體範圍大約是？","o":["1.8–2.2 mm","2.0–3.0 mm","0.2–6.73 mm","固定 2.04 mm"],"a":2,"e":"統合平均雖在 2.15–2.30 mm，但個體範圍很大，所以作者認為不存在通用的生物寬度數字。"},{"q":"牙冠邊緣距離骨頂 1.8 mm，是否一定侵犯 STA？","o":["一定侵犯，因為小於 2 mm","一定不會","不一定，要在消炎後以 sounding 量出這個人的 STA 再判斷","只要病人沒有不舒服就不用管"],"a":2,"e":"STA 因人而異；若這個位點的 STA 是 1.5 mm 就沒有侵犯，若是 2.5 mm 就有侵犯（Schmidt 2013；Jepsen 2018）。"},{"q":"依 Bosshardt & Selvig 1997，主要負責把牙齒錨定在齒槽骨上的是哪一種牙骨質？","o":["AAC（無細胞無纖維）","AEFC（無細胞外源性纖維）","CIFC（細胞內源性纖維）","反轉線"],"a":1,"e":"AEFC 位於牙根頸側 1/2 至 2/3，有大量 Sharpey's fibers，沉積很慢；CIFC 沉積快，主要負責修復。"},{"q":"SRP 時是否應該把根面刮到像玻璃一樣平滑？","o":["是，才能除去深層毒素","否，內毒素只在表層約 40–70 µm，過度刮會刮光 AEFC","是，牙骨質很快會長回來","否，因為根面完全沒有毒素"],"a":1,"e":"內毒素停在表層且結合鬆散；頸部 AEFC 只有約 50–100 µm，過度刮除會破壞錨定並造成敏感。"},{"q":"植牙後 CBCT 顯示植體唇側看不到骨板，最恰當的處理是？","o":["直接診斷骨裂並翻瓣補骨","立即拔除植體","考慮 CBCT 盲區，結合軟組織表型評估與 sounding 再判斷","加拍一次 CBCT 就能確認"],"a":2,"e":"金屬假影會讓植體影像膨脹，< 0.45–0.5 mm 的骨板也顯影不到（Dhondt 2022）；臨床穩定時貿然翻瓣，反而可能破壞僅存的薄骨板。"},{"q":"Temple 2017 對後牙唇側骨板的主要發現是？","o":["後牙骨板普遍厚於 2 mm","小臼齒有約 68% 位點 < 1 mm，後牙也需要考慮齒槽脊保存","只有女性的骨板會薄","大臼齒完全沒有骨板缺失"],"a":1,"e":"小臼齒唇側骨板普遍 < 1 mm，另有 17.2% 在 CBCT 上看不到骨板，所以後牙拔牙也要評估是否做齒槽脊保存。"}],"lit":[{"a":"Zander HA & Hürzeler B","y":"1958","t":"Continuous cementum apposition","j":"J Dent Res","pm":"13611117","r":"classic","s":0,"src":""},{"a":"Gargiulo AW et al.","y":"1961","t":"Dimensions and relations of the dentogingival junction in humans","j":"J Periodontol（PubMed 未收錄，PMID 待確認）","pm":"","r":"classic","s":0,"src":""},{"a":"Listgarten MA","y":"1972","t":"Ultrastructure of the dento-gingival junction after gingivectomy","j":"J Periodontal Res","pm":"4272041","r":"classic","s":0,"src":""},{"a":"Stahl SS","y":"1975","t":"The nature of healthy and diseased root surfaces","j":"J Periodontol","pm":"1054759","r":"classic","s":0,"src":""},{"a":"Temple KE et al.","y":"2017","t":"Thickness of the buccal plate in posterior teeth: A prospective cone beam computed tomography study","j":"Int J Periodontics Restorative Dent","pm":"29023609","r":"classic","s":0,"src":""},{"a":"Bosshardt DD & Selvig KA","y":"1997","t":"Dental cementum: the dynamic tissue covering of the root","j":"Periodontol 2000","pm":"9567923","r":"new","s":1,"src":"Perio 2000"},{"a":"Schmidt JC et al.","y":"2013","t":"Biologic width dimensions — a systematic review","j":"J Clin Periodontol","pm":"23461747","r":"new","s":1,"src":"JCP"},{"a":"Tsigarida A et al.","y":"2020","t":"Buccal bone thickness of maxillary anterior teeth: A systematic review and meta-analysis","j":"J Clin Periodontol","pm":"32691437","r":"new","s":0,"src":"JCP"},{"a":"Dhondt R et al.","y":"2022","t":"The accuracy of probing, ultrasound and cone-beam CT scans for determining the buccal bone plate dimensions around oral implants — A systematic review","j":"J Periodontal Res","pm":"35612409","r":"new","s":0,"src":"JPR"},{"a":"Jepsen S et al.","y":"2018","t":"Periodontal manifestations of systemic diseases and developmental and acquired conditions: Consensus report of workgroup 3 of the 2017 World Workshop","j":"J Clin Periodontol","pm":"29926500","r":"rel","s":0,"src":"","at":13}]},"3":{"status":"draft","statusNote":"數字與摘要經教師核實，書目依 PubMed 更正（2026-10-22）","oneLine":"大臼齒根岔的解剖限制（根幹、窄入口、CEP／IBR、副根管）是可以修整、可以維護的風險因子；有根岔侵犯的大臼齒掉牙風險約加倍，但規律 SPT 下多數仍能保留。","takeHome":[{"h":"記住幾個解剖數字","b":"上顎第一大臼齒根幹約占牙根表面積 32%（Hermann 1983）；水平附連喪失達 6 mm 時，研究中的牙全部成為 Grade III（Gher & Dunlap 1985）；58% 的根岔入口窄於 Gracey 刮匙刃寬（Bower 1979）。"},{"h":"用工具與修整克服解剖","b":"非手術時改用細超音波頭進根岔；手術中依序磨除 CEP（enameloplasty）、擴大入口（odontoplasty）、磨平 IBR（Masters & Hoskins 1964；Hou & Tsai 1997）。"},{"h":"預後不要太悲觀","b":"根岔侵犯使大臼齒 10–15 年掉牙相對風險為 2.21，但絕對風險仍低，多數 Grade III 的牙在 SPT 下仍能保留（Nibali 2016）；複雜病例可用小視野 CBCT 輔助診斷（Scarfe 2017）。"}],"compare":[{"c":"Hermann 1983","old":"根幹占 RSA 32%，近心頰根與腭側根面積相當","v":"cond","now":"需加條件。切根時不必一律保留腭側根；但這是離體牙的幾何數據，實際決策仍要看 3D 骨破壞型態與牙髓牙周狀況。"},{"c":"Gher & Dunlap 1985","old":"入口距 CEJ 3.6–4.8 mm；水平附連喪失 6 mm 時全部成 Grade III","v":"ok","now":"仍適用。根幹長度是固定的解剖條件；臨床 CAL 達 5–6 mm 時應警覺貫穿型病灶，需要時以 CBCT 確認剩餘骨量（Scarfe 2017）。"},{"c":"Bower 1979","old":"58% 根岔入口 ≤ 0.75 mm，刮匙單獨使用進不去","v":"upd","now":"已更新。入口窄的事實不變，但工具已改：非手術用細超音波頭，手術中以 odontoplasty 擴大入口。"},{"c":"Masters & Hoskins 1964","old":"CEP 上沒有真正的結締組織附連，和孤立性根岔病灶高度相關","v":"ok","now":"仍適用。翻瓣時要檢查 CEP，用火焰狀鑽石針磨到平滑的牙本質。"},{"c":"Hou & Tsai 1997","old":"CEP 與 IBR 常同時出現，合併時 PPD 與 CAL 較深","v":"ok","now":"仍適用，但樣本是末期拔除牙的橫斷面觀察，只能說共存、不能說因果；手術中 CEP 與 IBR 一起修平。"},{"c":"Gutmann 1978","old":"28.4% 大臼齒根岔區有通暢的副根管","v":"upd","now":"已更新。通路確實存在，但活體中部分副根管會鈣化；先測牙髓活性分清楚來源，牙髓源先做根管治療、封好髓腔底，觀察 3–6 個月再評估牙周。"}],"numbers":[{"k":"32%","d":"Hermann 1983：20 顆上顎第一大臼齒，根幹占牙根表面積 32%；近心頰根 25%、腭側根 24%、遠心頰根 19%"},{"k":"3.6 / 4.2 / 4.8 mm","d":"Gher & Dunlap 1985：近心、頰側、遠心根岔入口到 CEJ 的平均距離"},{"k":"38%","d":"Gher & Dunlap 1985：牙根分離點上下 2 mm 集中的牙根表面積比例"},{"k":"6 mm","d":"Gher & Dunlap 1985：水平附連喪失達 6 mm 以上，研究中的牙全部會成為 Grade III"},{"k":"58% / 81%","d":"Bower 1979：217 顆第一大臼齒，入口 ≤ 0.75 mm 占 58%、≤ 1.0 mm 占 81%；Gracey 刮匙刃寬 0.75–1.10 mm"},{"k":"28.6%","d":"Masters & Hoskins 1964：下顎大臼齒 CEP 盛行率（上顎 17.0%）；下顎孤立性根岔病灶九成以上合併 CEP"},{"k":"63.2%","d":"Hou & Tsai 1997：87 顆根岔侵犯的下顎大臼齒同時有 CEP 與 IBR；合併者 PPD 8.38 mm，未合併者 5.75 mm"},{"k":"28.4%","d":"Gutmann 1978：102 顆大臼齒中，根岔區有通暢副根管的比例；只開口於根岔頂的占 24.5%（25/102）"},{"k":"56–73% → 83–100%","d":"2D 根尖片與 CBCT 診斷根岔侵犯的正確率（Scarfe 2017）"},{"k":"75%","d":"臨床判為 Class I 的牙，在 CBCT 下被重新分類（高估 29%、低估 44%）（Scarfe 2017）"},{"k":"RR 2.21","d":"Nibali 2016（21 篇）：根岔侵犯使 10–15 年掉牙相對風險（95% CI 1.79–2.74）；10 年內為 1.46（p = 0.06）"},{"k":"約 70%","d":"Degree III 根岔侵犯的牙在高度配合的專科 SPT 下，5–15 年的保留率（Nibali 2016 引述）"}],"clinical":{"steps":["水平探測根岔，判定 Grade；CAL 達 5–6 mm 時提高警覺","2D 影像看不清時（尤其上顎腭側根岔），考慮小視野 CBCT","找解剖風險：根幹長短、入口寬度、CEP、IBR","根岔區單獨骨吸收時，先測牙髓活性（冷測、EPT）","非手術：用細超音波頭進入根岔，搭配放大設備","手術：enameloplasty → odontoplasty → 磨平 IBR；視情況做 GTR、切根或隧道化","術後衛教單束刷與牙間刷，規律 SPT"],"cases":[{"h":"下顎第一大臼齒 Grade II 合併 CEP（教學模擬）","b":"36 頰側 PPD 6 mm、BoP 陽性、Grade II。翻瓣後磨除 CEP，用鑽石超音波頭清溝槽，再做 GTR；CEP 處理好是再生成功的前提（Masters & Hoskins 1964）。"},{"h":"上顎大臼齒腭側根嚴重骨吸收（教學模擬）","b":"16 腭側根骨吸收到根尖 1/3，兩個頰側根還有一半骨支持。先做根管治療，再截除腭側根並修整外形；近心頰根面積與腭側根相當，保留頰側根可行（Hermann 1983）。"},{"h":"根岔區窄深囊袋、牙髓沒有反應（教學模擬）","b":"46 根岔區單獨骨吸收、PPD 8 mm 窄而深，牙髓活性測試無反應。判斷為牙髓源，先做高品質根管治療並封好髓腔底，不急著牙根整平或做牙周手術（Gutmann 1978）。"}]},"debates":["約 70% 的 Degree III 保留率來自高度配合 SPT 的專科病人，一般門診病人能否達到不確定（Nibali 2016 引述）。","Hou & Tsai 1997 是末期拔除牙的橫斷面觀察，CEP、IBR 與根岔病灶只能說共存，不能證明因果。","副根管在解剖上通暢，不等於臨床上一定會傳導病變；活體中部分會鈣化封閉（Gutmann 1978）。","經典研究多為離體牙量測，無法反映宿主反應、癒合能力與現代維護的效果。","「優先保留自然牙」的指引精神，內文標示為專家意見，沒有列出具體文獻。","CBCT 能提升根岔診斷，但要考慮輻射，依 ALADA 原則選小視野（Scarfe 2017）。"],"quiz":[{"q":"Hermann 1983 量測上顎第一大臼齒，牙根表面積最大的是哪一部分？","o":["腭側根","近心頰根","遠心頰根","根幹"],"a":3,"e":"根幹約占 32%，比任何單一牙根都大；近心頰根（25%）與腭側根（24%）沒有顯著差異。"},{"q":"Gher & Dunlap 1985 指出，水平附連喪失達多少時，研究中的上顎第一大臼齒全部成為 Grade III？","o":["2 mm","4 mm","6 mm","8 mm"],"a":2,"e":"所有牙根都在 6 mm 內分離，所以水平附連喪失達 6 mm 以上就會貫穿。"},{"q":"下顎大臼齒頰側根岔入口 0.6 mm，用刃寬 0.9 mm 的 Gracey 刮匙怎麼刮都改善不了。最合適的做法是？","o":["換更大的刮匙","改用細超音波頭；手術中可做 odontoplasty 擴大入口","直接拔牙","延長牙根整平時間"],"a":1,"e":"刮匙比入口寬，物理上進不去（Bower 1979）；改用細超音波頭，或在手術中擴大入口。"},{"q":"CEP 容易成為根岔病灶突破口的主要原因是？","o":["牙釉質表面沒有真正的結締組織附連","CEP 會分泌毒素","CEP 讓牙根變短","CEP 會阻擋唾液"],"a":0,"e":"牙釉質上只能形成上皮附連，沒有結締組織纖維嵌入，發炎時容易形成深囊袋（Masters & Hoskins 1964）。"},{"q":"46 根岔區單獨骨吸收、窄而深的 8 mm 牙周囊袋、牙髓活性測試無反應。第一步應該是？","o":["立刻翻瓣做 GTR","深層牙根整平根岔區","先做根管治療並封好髓腔底，再觀察","拔牙植牙"],"a":2,"e":"疑似牙髓源經副根管造成的病灶，先處理牙髓，觀察 3–6 個月後再評估是否還需要牙周治療。"},{"q":"關於 Nibali 2016 的結論，下列何者最正確？","o":["有根岔侵犯的牙大多數會掉","根岔侵犯讓 10–15 年掉牙相對風險約加倍，但多數牙在 SPT 下仍可保留","根岔侵犯和掉牙無關","Grade III 一律建議拔除植牙"],"a":1,"e":"10–15 年相對風險 2.21，但絕對風險仍低；即使 Grade III，多數牙對牙周治療反應仍良好，值得盡力保留。"}],"lit":[{"a":"Masters DH & Hoskins SW","y":"1964","t":"Projection of cervical enamel into molar furcations","j":"J Periodontol（PubMed 未收錄，PMID 待確認）","pm":"","r":"classic","s":0,"src":""},{"a":"Gutmann JL","y":"1978","t":"Prevalence, location, and patency of accessory canals in the furcation region of permanent molars","j":"J Periodontol","pm":"271710","r":"classic","s":0,"src":""},{"a":"Bower RC","y":"1979","t":"Furcation morphology relative to periodontal treatment. Furcation entrance architecture","j":"J Periodontol","pm":"283222","r":"classic","s":0,"src":""},{"a":"Hermann DW et al.","y":"1983","t":"The potential attachment area of the maxillary first molar","j":"J Periodontol","pm":"6577179","r":"classic","s":0,"src":""},{"a":"Gher ME & Dunlap RW","y":"1985","t":"Linear variation of the root surface area of the maxillary first molar","j":"J Periodontol","pm":"3882932","r":"classic","s":0,"src":""},{"a":"Hou GL & Tsai CC","y":"1997","t":"Cervical enamel projection and intermediate bifurcational ridge correlated with molar furcation involvements","j":"J Periodontol","pm":"9249641","r":"classic","s":0,"src":""},{"a":"Nibali L et al.","y":"2016","t":"Tooth loss in molars with and without furcation involvement — a systematic review and meta-analysis","j":"J Clin Periodontol","pm":"26932323","r":"new","s":1,"src":"JCP"},{"a":"Scarfe WC et al.","y":"2017","t":"The emerging role of maxillofacial radiology in the diagnosis and management of patients with complex periodontitis","j":"Periodontol 2000","pm":"28429477","r":"new","s":1,"src":"Perio 2000"}]},"4":{"status":"draft","statusNote":"數字與摘要經教師核實，書目依 PubMed 更正（2026-10-22）","oneLine":"菌斑引發牙齦炎、清除後可逆；但牙周炎的進展速率因人、因位點而異，本質是菌群失調與宿主發炎的雙向迴路，所以要用 Staging & Grading 分層，用探診追蹤活性。","takeHome":[{"h":"進展速率因人而異，改用 Grading","b":"Löe 1986 在未接受治療的族群中看到快速、中度、不進展三種軌跡；Needleman 2018 統整全球資料，年附連喪失平均約 0.10 mm，呈連續分布、沒有明確分界。2017 分類因此取消慢性／侵襲性二分，改用 Staging & Grading（Papapanou 2018）。"},{"h":"致病機轉是雙向迴路","b":"Page & Kornman 1997：微生物挑戰引發宿主反應，再由環境與基因因子放大破壞。Curtis 2020 的 PSD 模型補上反方向：發炎產物又滋養失調的菌群。骨吸收的共同路徑是 RANKL/OPG 失衡（Cochran 2008）。治療要同時去除生物膜與控制發炎。"},{"h":"用探診追活性，SPT 有明確標準","b":"附連喪失比 X 光骨吸收早約 6–8 個月出現（Goodson 1984）。穩定的定義是 PPD ≤ 4 mm 且 4 mm 位點不出血、全口 BoP < 10%（Chapple 2018）；殘留 ≥ 5 mm 或 4 mm 出血的位點要局部處理。"}],"compare":[{"c":"Löe 1965","old":"停止潔牙 10–21 天全部出現牙齦炎；恢復潔牙後約 7–10 天消退","v":"cond","now":"需加條件。因果與可逆性仍成立；但 GCF 研究顯示實驗性牙齦炎以嗜中性白血球反應為主，單核球與血管新生相關因子沒有上升，而且個體反應差異大（Hsu 2025，含引述 Leite 2022）。去除菌斑仍是第一步，反應特別強的人要評估全身與環境因子。"},{"c":"Löe 1986","old":"斯里蘭卡茶園工人 15 年：快速進展約 8%、中度約 81%、不進展約 11%","v":"cond","now":"需加條件。宿主易感性決定進展速率的觀念不變；但單一男性族群的比例不能套到全球。Needleman 2018 顯示進展是連續光譜，且受地區與社經條件影響；臨床改用 Grade A/B/C（Papapanou 2018）。"},{"c":"Goodson 1984","old":"破壞呈爆發式，只發生在少數位點；附連喪失領先 X 光骨吸收約 6–8 個月","v":"ok","now":"仍適用。當年 X 光的顯著骨吸收門檻是 0.48 mm，現代影像更敏感，但軟組織變化仍先於硬組織。SPT 以全口探診為第一線，X 光作輔助（Bosshardt 2017）。"},{"c":"Van Winkelhoff & Boutaga 2005","old":"A. actinomycetemcomitans、P. gingivalis 可在家人與配偶之間傳播","v":"upd","now":"已更新。傳播屬實，但依 PSD 模型，會不會發病取決於受者口內環境是否失調（Curtis 2020；Antezack 2023）。家人不需預防性抗生素，建議做牙周檢查、維持口腔衛生。"},{"c":"Cochran 2008","old":"發炎前線擴散到骨，促發炎細胞激素使 RANKL/OPG 上升，驅動骨吸收","v":"ok","now":"仍適用，並有延伸。RANKL/OPG 仍是骨吸收的共同路徑；現代再補上：發炎消退是由 SPMs（如 resolvins）主動調控的過程，消退失敗也會造成持續破壞（Curtis 2020）。"}],"numbers":[{"k":"10–21 天","d":"Löe 1965：12 位受試者停止潔牙，3 位在 10 天內、9 位在 15–21 天出現牙齦炎；恢復潔牙 7–10 天消退"},{"k":"8% / 81% / 11%","d":"Löe 1986：480 位斯里蘭卡男性茶園工人，快速進展、中度進展、不進展三群的比例"},{"k":"~9 / ~4 / < 1 mm","d":"Löe 1986：35 歲時三群的平均附連喪失；快速進展群 45 歲時牙齒幾乎全部掉光，中度群平均掉 7 顆"},{"k":"5.7% / 6.1%","d":"Goodson 1984：22 位未治療患者追蹤 1 年，出現顯著附連喪失與顯著骨吸收的位點比例"},{"k":"6–8 個月","d":"Goodson 1984：附連喪失領先 X 光骨吸收的時間；以 4 mm 為切點，真陽性 0.60、偽陽性 0.05"},{"k":"60%","d":"Cochran 2008 引述 Assuma 1998 靈長類實驗：局部阻斷 IL-1 與 TNF-α，骨吸收減少 60%、破骨細胞減少 67%"},{"k":"30–75%","d":"Van Winkelhoff & Boutaga 2005：P. gingivalis 在配偶間的水平傳播率；A. actinomycetemcomitans 的家族垂直傳播率 30–60%"},{"k":"0.10 mm／年","d":"Needleman 2018（16 篇、> 8,600 人）：成人平均年附連喪失；最高五分之一約 0.45 mm／年（依常態分布推算）"},{"k":"0.20 vs 0.056 mm","d":"Needleman 2018：開發中國家與已開發國家的年附連喪失（p < 0.001）"},{"k":"~1,000 倍","d":"Curtis 2020：牙周炎位點的總菌量約為健康位點的 1,000 倍；牙周炎相關菌的比例由約 5% 增加到接近 50%"},{"k":"OR 7.88","d":"Antezack 2023：Filifactor alocis 與牙周炎的勝算比；Fretibacterium sp. HMT 362 為 20.72；S. sanguinis、S. mitis 與健康相關（OR 約 0.35）"},{"k":"30 篇／594 人","d":"Hsu 2025：實驗性牙齦炎的 GCF 研究；MPO、IL-1α、IL-1β 上升，MCP-1、VEGF、FGF 沒有上升"},{"k":"0.5–2.7 mm","d":"生物膜前緣到骨吸收面之間維持的發炎擴散距離（Bosshardt 2017 引述 Waerhaug），與垂直或水平骨缺損的型態有關"},{"k":"12 個模型","d":"Du 2018：牙周炎預測模型多數偏差風險高、少有外部驗證；一致的預測因子是吸菸、糖尿病、基線附連喪失、失牙數與年齡"},{"k":"< 10%","d":"Chapple 2018：臨床健康的全口 BoP；BoP ≥ 10% 且無附連喪失為牙齦炎，10–30% 為局部、> 30% 為廣泛（Trombelli 2018）"},{"k":"0.25 / 1.0","d":"Papapanou 2018：骨吸收百分比 ÷ 年齡 < 0.25 為 Grade A、0.25–1.0 為 B、> 1.0 為 C"}],"clinical":{"steps":["全口 6 點探診：PPD、CAL、BoP","Staging：依附連喪失、骨吸收、失牙數與處置複雜度判定 Stage I–IV","Grading：取骨吸收最嚴重位點，骨吸收百分比 ÷ 年齡（< 0.25 A、0.25–1.0 B、> 1.0 C）","修飾因子：吸菸 < 10 支／日至少 B、≥ 10 支為 C；HbA1c < 7% 至少 B、≥ 7% 為 C","非手術治療去除生物膜，同步處理吸菸、血糖等全身因子","再評估與 SPT：PPD ≤ 4 mm 且 4 mm 位點不出血、全口 BoP < 10% 為穩定","殘留 ≥ 5 mm 或 4 mm 出血的位點做局部再治療或手術，不必全口重做"],"cases":[{"h":"35 歲重度吸菸、快速附連喪失（教學模擬）","b":"每天 1.5 包菸，多處 PPD 6–8 mm，第一大臼齒骨吸收達根長 60%。60 ÷ 35 = 1.71，加上吸菸，判定 Stage III、Grade C。轉介戒菸、全口非手術治療，SPT 間隔縮短到約 2 個月（Papapanou 2018；Löe 1986）。"},{"h":"SPT 中出現單一 5 mm 出血囊袋（教學模擬）","b":"50 歲 Stage III，SPT 2 年後全口 BoP 8%，但 16 近心 PPD 5 mm 且出血。全口數字達標不代表這個位點穩定；局部再做牙根整平，3 個月後再評估，仍 ≥ 5 mm 且出血就考慮手術（Chapple 2018；Goodson 1984）。"},{"h":"擔心把牙周病傳染給家人（教學模擬）","b":"28 歲 Stage IV Grade C，要求全家吃抗生素。說明細菌會交換，但發病取決於宿主與口內環境；不對無症狀家人開預防性抗生素，建議伴侶做牙周檢查、加強口腔衛生（Van Winkelhoff 2005；Curtis 2020）。"}]},"debates":["Needleman 2018 的分位組數字是依常態分布推算的，研究間異質性極高（I² = 99%），只適合說明「進展是連續光譜」。","Löe 1986 是單一男性族群，完成第 1 與第 6 次檢查的只有 161 人，比例不宜直接外推。","預測模型多數偏差風險高、缺乏外部驗證，只能當衛教與溝通的輔助工具（Du 2018）。","Cochran 2008 引述的阻斷實驗是靈長類短期模型；宿主調控在人身上仍屬輔助角色。","實驗性牙齦炎是約 21 天的可逆模型，不宜直接外推到長期牙周炎的骨吸收進展（Hsu 2025）。","蛋白質組學標記（如 S100A8/A9、MMP-9）仍在研究階段，尚未成為臨床常規檢驗（Ahmad 2024）。"],"quiz":[{"q":"Löe 1986 斯里蘭卡研究中，快速進展群約占多少？","o":["約 2%","約 8%","約 30%","約 81%"],"a":1,"e":"快速進展約 8%、中度約 81%、不進展約 11%；這個比例只代表該族群，不能套用到全球。"},{"q":"依 Goodson 1984，為什麼 SPT 不能只拍 X 光、不做探診？","o":["X 光輻射太高","附連喪失通常比 X 光看得到的骨吸收早 6–8 個月","X 光無法看到牙結石","探診比較便宜"],"a":1,"e":"爆發期先破壞軟組織與髓腔骨，皮質骨還沒改變前 X 光看不出來；等 X 光看到時，爆發期多半已經結束。"},{"q":"40 歲、不吸菸、無糖尿病，最嚴重位點骨吸收達根長 60%。Grade 應為？","o":["Grade A","Grade B","Grade C","無法判定"],"a":2,"e":"60 ÷ 40 = 1.5，大於 1.0 即為 Grade C；沒有修飾因子也一樣（Papapanou 2018）。"},{"q":"治療後全口 BoP 11.9%，最深 PPD 4 mm 但該位點出血。是否達到 periodontal stability？","o":["達到，因為 PPD ≤ 4 mm","達到，因為 BoP 只略高於 10%","未達到，全口 BoP ≥ 10% 且 4 mm 位點出血","要拍 X 光才能判斷"],"a":2,"e":"穩定需要全口 BoP < 10%，而且 4 mm 位點不能出血（Chapple 2018）；這個位點應加強口腔衛生並局部再治療。"},{"q":"Curtis 2020 的 PSD 模型相對於 Page & Kornman 1997，最主要的補充是？","o":["牙周炎是單一細菌感染","發炎產物會反過來滋養失調菌群，形成雙向迴路","宿主反應與破壞無關","只要用抗生素就能治癒"],"a":1,"e":"Page & Kornman 是「微生物 → 宿主反應 → 破壞」；PSD 強調發炎與菌群失調互為因果，所以要同時清創與控制發炎。"},{"q":"重度牙周炎患者問要不要讓配偶與小孩一起吃抗生素，最恰當的回答是？","o":["要，避免傳染","只有小孩需要","不需要；建議伴侶做牙周檢查並維持口腔衛生","全家都要做 SRP"],"a":2,"e":"細菌可能傳播，但發病取決於宿主與口內環境；預防性抗生素反而可能破壞健康共生菌（Van Winkelhoff 2005；Curtis 2020）。"},{"q":"Needleman 2018 統整的成人平均年附連喪失約為？","o":["0.01 mm","0.10 mm","0.5 mm","1.0 mm"],"a":1,"e":"約 0.10 mm／年，但地區與社經差異很大，開發中國家約 0.20 mm／年。"}],"lit":[{"a":"Löe H, Theilade E & Jensen SB","y":"1965","t":"Experimental gingivitis in man","j":"J Periodontol","pm":"14296927","r":"classic","s":0,"src":""},{"a":"Goodson JM et al.","y":"1984","t":"The relationship between attachment level loss and alveolar bone loss","j":"J Clin Periodontol","pm":"6585374","r":"classic","s":0,"src":""},{"a":"Löe H et al.","y":"1986","t":"Natural history of periodontal disease in man. Rapid, moderate and no loss of attachment in Sri Lankan laborers 14 to 46 years of age","j":"J Clin Periodontol","pm":"3487557","r":"classic","s":0,"src":""},{"a":"Van Winkelhoff AJ & Boutaga F","y":"2005","t":"Transmission of periodontal bacteria and models of infection","j":"J Clin Periodontol","pm":"16128826","r":"classic","s":0,"src":""},{"a":"Cochran DL","y":"2008","t":"Inflammation and bone loss in periodontal disease","j":"J Periodontol","pm":"18673012","r":"classic","s":0,"src":""},{"a":"Page RC & Kornman KS","y":"1997","t":"The pathogenesis of human periodontitis: an introduction","j":"Periodontol 2000","pm":"9567963","r":"new","s":1,"src":"Perio 2000"},{"a":"Needleman I et al.","y":"2018","t":"Mean annual attachment, bone level, and tooth loss: A systematic review","j":"J Clin Periodontol","pm":"29926483","r":"new","s":1,"src":"JCP"},{"a":"Bosshardt DD","y":"2017","t":"The periodontal pocket: pathogenesis, histopathology and consequences","j":"Periodontol 2000","pm":"29194796","r":"new","s":0,"src":"Perio 2000"},{"a":"Du M et al.","y":"2018","t":"Prediction models for the incidence and progression of periodontitis: A systematic review","j":"J Clin Periodontol","pm":"30394558","r":"new","s":0,"src":"JCP"},{"a":"Curtis MA, Diaz PI & Van Dyke TE","y":"2020","t":"The role of the microbiota in periodontal disease","j":"Periodontol 2000","pm":"32385883","r":"new","s":0,"src":"Perio 2000"},{"a":"Antezack A et al.","y":"2023","t":"New putative periodontopathogens and periodontal health-associated species: A systematic review and meta-analysis","j":"J Periodontal Res","pm":"37572051","r":"new","s":0,"src":"JPR"},{"a":"Ahmad P et al.","y":"2024","t":"Progression from healthy periodontium to gingivitis and periodontitis: Insights from bioinformatics-driven proteomics — A systematic review with meta-analysis","j":"J Periodontal Res","pm":"38873831","r":"new","s":0,"src":"JPR"},{"a":"Hsu YT et al.","y":"2025","t":"Gingival crevicular fluid during experimental gingivitis: A review of immune and tissue regulation","j":"J Periodontol","pm":"40099937","r":"new","s":0,"src":"JP"},{"a":"Sanz M et al.","y":"2017","t":"Role of microbial biofilms in the maintenance of oral health and in the development of dental caries and periodontal diseases. Consensus report of group 1 of the Joint EFP/ORCA workshop","j":"J Clin Periodontol","pm":"28266109","r":"cons","s":0,"src":""},{"a":"Chapple ILC et al.","y":"2018","t":"Periodontal health and gingival diseases and conditions on an intact and a reduced periodontium: Consensus report of workgroup 1 of the 2017 World Workshop","j":"J Clin Periodontol","pm":"29926499","r":"cons","s":0,"src":""},{"a":"Lang NP & Bartold PM","y":"2018","t":"Periodontal health","j":"J Clin Periodontol","pm":"29926485","r":"cons","s":0,"src":""},{"a":"Caton JG et al.","y":"2018","t":"A new classification scheme for periodontal and peri-implant diseases and conditions — Introduction and key changes from the 1999 classification","j":"J Clin Periodontol","pm":"29926489","r":"rel","s":0,"src":"","at":8},{"a":"Papapanou PN et al.","y":"2018","t":"Periodontitis: Consensus report of workgroup 2 of the 2017 World Workshop","j":"J Clin Periodontol","pm":"29926490","r":"rel","s":0,"src":"","at":8},{"a":"Trombelli L et al.","y":"2018","t":"Plaque-induced gingivitis: Case definition and diagnostic considerations","j":"J Clin Periodontol","pm":"29926492","r":"rel","s":0,"src":"","at":9}]},"5":{"status":"draft","statusNote":"數字與摘要經教師核實，書目依 PubMed 更正（2026-10-22）","oneLine":"結石、溝槽、撕裂片、懸突都只是生物膜的藏身處；治療重點是清掉活的生物膜、消除滯留結構，不是把牙骨質刨光。遇到孤立性深囊袋，要想到腭齦溝與牙骨質撕裂。","takeHome":[{"h":"結石是鈣化的生物膜","b":"結石表面永遠覆蓋一層活的生物膜，這層才是發炎的直接原因（Akcalı & Lang 2017）；細菌不會侵入健康牙骨質（Canis 1979）。根面的目標是生物相容，不是鏡面光滑。"},{"h":"孤立性深囊袋先想解剖因素","b":"上顎側門牙想到腭齦溝，93.8% 的腭齦溝在側門牙（Withers 1981）；中老年單根牙突然出現深囊袋，想到牙骨質撕裂（Leknes 1996）。2017 分類把這類解剖異常列為牙齒相關因子（Jepsen 2018）。"},{"h":"鄰接區看食物嵌塞與可清潔性","b":"接觸點鬆緊本身與 PPD 無關，有食物嵌塞時才有關（Hancock 1980）；固定矯正器會增加牙齦發炎、拆除後可逆（Gosset 2026）。修復時要尊重 STA，做出容易清潔的外形（Gracis 2023）。"}],"compare":[{"c":"Zander 1953","old":"結石有四種附著方式，包括細菌侵入牙骨質，所以要刮除受感染的牙骨質","v":"upd","now":"已更新。所謂細菌侵入是切片重疊造成的假象，健康牙骨質不會被侵入（Canis 1979）；改以超音波溫和清創，保留原生牙骨質（Akcalı & Lang 2017）。"},{"c":"Allen & Kerr 1965","old":"滅菌結石只引起輕微異物反應，含活菌的結石引起持續化膿與膿瘍","v":"cond","now":"需加條件。天竺鼠腹腔不等於牙周囊袋；但結論與現代觀點一致：結晶本身毒性低，結石表面的活生物膜才是主因，單純粗糙表面不會引發牙周炎（Akcalı & Lang 2017 引述 Waerhaug 1956）。"},{"c":"Canis 1979","old":"電子顯微鏡下結石與牙骨質緊密貼合，健康牙骨質內沒有細菌","v":"ok","now":"仍適用。這是現代「生物相容性根面」目標的基礎：治療後若已不出血，根面細微不平整不需要再用力刮。"},{"c":"Hancock 1980","old":"接觸點鬆緊與 GI、PPD 無關；有食物嵌塞的位點 PPD 較深","v":"cond","now":"需加條件。結論仍可用，但這是橫斷面研究，只能說相關。修復時不要為了極緊的接觸而壓迫牙間乳突；有垂直食物嵌塞時，檢查並調整對咬的 plunger cusp。"},{"c":"Withers 1981","old":"腭齦溝個人盛行率 8.5%，多在上顎側門牙，與局部牙周破壞相關","v":"upd","now":"已更新。流行病學數據仍可參考（受試者是年輕新兵）；過去深溝多半拔牙，內文建議現在以小視野 CBCT 評估溝槽與牙髓，淺溝修磨，深溝合併根管治療、手術清創、封填與再生。2017 列為牙齒相關因子（Jepsen 2018）。"},{"c":"Leknes 1996","old":"牙骨質撕裂側的附連喪失顯著較多，斷裂發生在牙骨質與牙本質交界","v":"upd","now":"已更新。過去常被誤判為根裂而拔除；內文建議現在用 CBCT 找根側游離的片狀影，翻瓣取出碎片、修整根面並做再生。原研究只有 17 顆終末期拔除牙。"}],"numbers":[{"k":"50 顆","d":"Zander 1953：光學顯微鏡觀察結石附著；只靠細菌侵入方式附著的 5 顆（10%），只靠 Sharpey's fibers 凹陷的 10 顆（20%）"},{"k":"70 隻","d":"Allen & Kerr 1965：天竺鼠腹腔植入滅菌或含菌結石（各 30 隻，對照 10 隻），觀察 7–90 天"},{"k":"63 顆","d":"Canis 1979：以光學、掃描與穿透式電子顯微鏡觀察新拔除牙的結石介面"},{"k":"1,040 個","d":"Hancock 1980：40 位 17–19 歲海軍新兵的鄰接區；80.9% 為 GI 2–3，72.5% 的人有 ≥ 4 mm 牙周囊袋"},{"k":"2.89 / 2.68 / 2.64 mm","d":"Hancock 1980：緊、鬆、開放接觸點的平均 PPD，彼此沒有顯著差異"},{"k":"3.67 mm","d":"Hancock 1980：開放接觸點合併食物嵌塞時的平均 PPD（p < 0.01）"},{"k":"8.5% / 2.33%","d":"Withers 1981：531 位新兵、2,099 顆上顎門牙，腭齦溝的個人與牙齒盛行率"},{"k":"93.8%","d":"Withers 1981：腭齦溝位於上顎側門牙的比例；側門牙盛行率 4.40%，正中門牙 0.28%"},{"k":"GI 2.31 vs 1.37","d":"Withers 1981：有與沒有腭齦溝的側門牙；PDI 2.88 vs 1.51（p < 0.001）"},{"k":"9.73 vs 6.13 mm","d":"Leknes 1996：17 顆單根牙（患者 53–79 歲），撕裂側與對側的附連喪失（p < 0.0001）"},{"k":"約 512 µm","d":"Leknes 1996：唯一做組織切片的撕裂碎片厚度"},{"k":"> 800 種","d":"Akcalı & Lang 2017：結石中封存的口腔微生物種類"},{"k":"0.1–0.5 mm","d":"Akcalı & Lang 2017：結石最根尖端與囊袋底之間的無結石區，只有活的生物膜"}],"clinical":{"steps":["孤立性深囊袋：先找局部原因（腭齦溝、撕裂片、懸突、CEP）","上顎側門牙：探針沿舌側找溝槽，並測牙髓活性","中老年單根牙突然深囊袋或膿瘍：考慮牙骨質撕裂，與根裂鑑別，需要時用小視野 CBCT","清除巨觀結石並徹底破壞生物膜，袋底的無結石區也要清到","根面終點：無結石、無生物膜、不再出血，不追求鏡面光滑","鄰接區：問有無食物嵌塞，檢查 plunger cusp、懸突，以及牙間刷能否通過","修復邊緣：不侵犯 STA，外形自然、容易清潔"],"cases":[{"h":"上顎側門牙腭齦溝合併牙髓壞死（教學模擬）","b":"28 歲，12 舌側 PPD 9 mm，牙髓無反應，CBCT 見溝槽延伸到根中 1/3、無根裂。先做根管治療，再翻瓣清除溝內肉芽、封填溝槽並做再生（Withers 1981；Jepsen 2018）。"},{"h":"老年下顎門牙突發膿瘍（教學模擬）","b":"68 歲，41 唇側突然腫痛，PPD 8 mm，CBCT 見根側游離片狀影。不要直接當根裂拔牙；翻瓣取出撕裂碎片、修整根面，再做再生（Leknes 1996）。"},{"h":"懸突修復物合併食物嵌塞（教學模擬）","b":"35 歲，35/36 吃肉就塞、牙齦出血，35 遠心有懸突，PPD 5 mm。移除懸突並重做自然外形，調整對咬 plunger cusp，教牙間刷，3 個月後複查（Hancock 1980；Gracis 2023）。"}]},"debates":["Allen & Kerr 1965 是天竺鼠腹腔模型，組織防禦與牙周囊袋不同，不能直接外推。","Hancock 1980 與 Withers 1981 都是年輕軍人的橫斷面研究，只能說相關，代表性有限。","Leknes 1996 只有 17 顆終末期拔除牙，其中僅 1 顆做組織切片。","腭齦溝封填、撕裂片取出合併再生等現代處置，內文沒有引用臨床試驗，屬臨床經驗與專家意見。","Gosset 2026：拆除矯正器後發炎下降的證據較一致；懸突精修後發炎可逆屬引述資料，研究數較少。","修復邊緣不可侵犯 STA，但 STA 個體差異大、沒有通用的安全距離，要個別評估（見 S02，Schmidt 2013）。"],"quiz":[{"q":"Canis 1979 以電子顯微鏡否定了哪一種結石附著方式？","o":["次生皮膜附著","卡入凹陷的機械鎖結","細菌侵入健康牙骨質","結石基質直接貼合牙骨質"],"a":2,"e":"Zander 看到的細菌侵入是切片重疊的假象；細菌只會進入齲蝕等結構受損的區域。"},{"q":"依 Akcalı & Lang 2017，直接引發牙齦發炎的是？","o":["結石的鈣磷結晶","結石表面未鈣化的活生物膜","結石的粗糙度本身","結石的顏色"],"a":1,"e":"結石內部細菌鈣化後已失去活性；表面永遠有一層活的生物膜，結石是次要的滯留因子。"},{"q":"Hancock 1980 發現，與 PPD 加深顯著相關的是？","o":["接觸點過緊","接觸點鬆","開放接觸點本身","食物嵌塞"],"a":3,"e":"三種接觸型態的平均 PPD 沒有差異；鬆或開放接觸合併食物嵌塞時，PPD 才顯著較深。"},{"q":"腭齦溝最常出現在哪一顆牙？","o":["上顎正中門牙","上顎側門牙","上顎犬齒","下顎門牙"],"a":1,"e":"Withers 1981：93.8% 在上顎側門牙，側門牙盛行率 4.40%，正中門牙只有 0.28%。"},{"q":"Leknes 1996 的組織切片顯示，牙骨質撕裂的斷裂位置在？","o":["牙骨質表層","牙骨質與牙本質交界","牙本質與牙髓交界","牙周韌帶中間"],"a":1,"e":"斷裂沿著牙骨質與牙本質交界發生，碎片外側仍帶有牙周韌帶殘餘。"},{"q":"多處開放接觸點，但沒有食物嵌塞、BoP 陰性、PPD ≤ 3 mm。是否需要做假牙關閉縫隙？","o":["需要，開放接觸一定會造成牙周病","不需要，維持清潔並定期追蹤即可","全部改做牙冠","先做牙周手術"],"a":1,"e":"單純開放接觸若沒有食物嵌塞且能清潔，不必然導致牙周炎；硬把接觸做緊反而可能壓迫牙間乳突（Hancock 1980）。"},{"q":"上顎側門牙腭齦溝延伸到根中段，牙髓壞死、8 mm 牙周囊袋。治療順序應為？","o":["先翻瓣手術，再看要不要根管治療","先根管治療，再翻瓣清創、封填溝槽與再生","直接拔牙","只做深層牙根整平"],"a":1,"e":"先處理根管內的感染源，否則牙周手術容易失敗；之後再處理溝槽這個滯留結構。"}],"lit":[{"a":"Zander HA","y":"1953","t":"The attachment of calculus to root surfaces","j":"J Periodontol（PubMed 未收錄，PMID 待確認）","pm":"","r":"classic","s":0,"src":""},{"a":"Allen DL & Kerr DA","y":"1965","t":"Tissue response in the guinea pig to sterile and non-sterile calculus","j":"J Periodontol","pm":"14261857","r":"classic","s":0,"src":""},{"a":"Canis MF et al.","y":"1979","t":"Calculus attachment. Review of the literature and new findings","j":"J Periodontol","pm":"289756","r":"classic","s":0,"src":""},{"a":"Hancock EB et al.","y":"1980","t":"Influence of interdental contacts on periodontal status","j":"J Periodontol","pm":"6931204","r":"classic","s":0,"src":""},{"a":"Withers JA et al.","y":"1981","t":"The relationship of palato-gingival grooves to localized periodontal disease","j":"J Periodontol","pm":"6937650","r":"classic","s":0,"src":""},{"a":"Leknes KN, Lie T & Selvig KA","y":"1996","t":"Cemental tear: a risk factor in periodontal attachment loss","j":"J Periodontol","pm":"8794968","r":"classic","s":0,"src":""},{"a":"Akcalı A & Lang NP","y":"2017","t":"Dental calculus: the calcified biofilm and its role in disease development","j":"Periodontol 2000","pm":"29194797","r":"new","s":1,"src":"Perio 2000"},{"a":"Gosset M et al.","y":"2026","t":"Local and systemic risk factors of dental biofilm-induced gingivitis and their control: A systematic review","j":"J Clin Periodontol","pm":"42751832","r":"new","s":1,"src":"JCP"},{"a":"Gracis S, Llobell A & Chu SJ","y":"2023","t":"Contemporary concepts on periodontal complications from prosthetic and restorative therapies","j":"Periodontol 2000","pm":"37466152","r":"new","s":0,"src":"Perio 2000"},{"a":"Jepsen S et al.","y":"2018","t":"Periodontal manifestations of systemic diseases and developmental and acquired conditions: Consensus report of workgroup 3 of the 2017 World Workshop","j":"J Clin Periodontol","pm":"29926500","r":"rel","s":0,"src":"","at":13}]},"6":{"status":"draft","statusNote":"數字與摘要經教師核實，書目依 PubMed 更正（2026-10-22）","oneLine":"牙周炎是多因子疾病：吸菸與糖尿病是最值得處理的可改變因子，遺傳只代表易感性；單一基因或單一細菌檢測目前沒有臨床價值，風險評估要回到臨床參數、PRA 與 Grading。","takeHome":[{"h":"先分清楚風險的層級","b":"Bouchard 2016 把風險分成近端的真正風險因子、中間的風險指標與遠端的前置因子；Genco & Borgnakke 2013 再分成可改變與不可改變。臨床上先處理可改變的近端因子：吸菸與血糖。"},{"h":"把吸菸與血糖量化進 Grading","b":"Grossi 1994 的重度吸菸 OR 4.75、糖尿病 OR 2.32，到了 2017 分類變成量化的修飾因子：每天 ≥ 10 支菸或 HbA1c ≥ 7.0% 即為 Grade C（Tonetti 2018）。問診要記包年與 HbA1c，不能只問「有沒有」。"},{"h":"遺傳是易感性，不是宿命","b":"雙胞胎研究顯示 38–82% 的族群變異與遺傳有關（Michalowicz 1991）；但 607 篇研究中找不到有臨床價值的基因檢測（Dommisch 2025）。PRA 用臨床參數就能預測進展與失牙（Lang 2015），不建議常規做 IL-1 檢測。"}],"compare":[{"c":"Bouchard 2016","old":"牙周風險是多層次的因果網絡：近端真正因子、中間指標、遠端前置因子","v":"ok","now":"仍適用。可直接用來安排處置順序：近端因子（吸菸、血糖）直接介入，遠端因子（社經、教育）以衛教與支持提高配合度。勝算比是群體數字，不等於個人發病機率。"},{"c":"Grossi 1994、1995","old":"Erie County 研究：吸菸、糖尿病、P. gingivalis、B. forsythus 與附連喪失及骨吸收相關","v":"cond","now":"需加條件。橫斷面設計只能稱為風險指標，無法確立先後順序；單次檢出菌也不等於菌群失調。2017 分類把吸菸量與 HbA1c 量化為 Grade 修飾因子（Tonetti 2018）。"},{"c":"Kornman 1997","old":"IL-1 複合基因型是重度成人牙周炎的嚴重度因子（40–60 歲不吸菸者 OR 18.9）","v":"upd","now":"已更新。OR 18.9 來自很小的次群組，信賴區間極寬；IL-1 關聯研究方法品質中等、統合分析偏誤風險高（Citterio 2019）；系統性回顧找不到有臨床價值的基因檢測（Dommisch 2025）。不建議常規 IL-1 檢測。"},{"c":"Michalowicz 1991","old":"110 對成人雙胞胎：38–82% 的族群變異可歸因於遺傳","v":"cond","now":"需加條件。這是族群變異的比例，不是個人宿命；分開撫養同卵雙胞胎的 CAL 遺傳率為 0.38，82% 是牙齦指數。現代再加上表觀遺傳：吸菸與發炎可經 DNA 甲基化改變基因表現（Loos & Van Dyke 2020）。"}],"numbers":[{"k":"1,426 人","d":"Grossi 1994：Erie County 25–74 歲居民，以順序邏輯迴歸校正年齡、性別、社經等因素"},{"k":"OR 4.75","d":"Grossi 1994：重度吸菸（> 30 包年）與附連喪失；輕度 2.05、中度 2.77，呈劑量效應"},{"k":"OR 2.32","d":"Grossi 1994：糖尿病與附連喪失，是唯一顯著相關的全身疾病"},{"k":"OR 7.28","d":"Grossi 1995（1,361 人）：重度吸菸與 X 光骨吸收，高於附連喪失的 OR；骨吸收與附連喪失 r² = 0.69"},{"k":"OR 18.9","d":"Kornman 1997：40–60 歲不吸菸者，IL-1 基因型陽性與重度（相對輕度）牙周炎；信賴區間 1.04–343（內文）"},{"k":"86%","d":"Kornman 1997：重度牙周炎病例中，可由吸菸或 IL-1 基因型解釋的比例"},{"k":"38–82%","d":"Michalowicz 1991：110 對雙胞胎（含 14 對分開撫養的同卵雙胞胎），牙周指標族群變異中可歸因於遺傳的比例"},{"k":"19 篇／2,110 人","d":"Lang 2015：10 篇隊列研究中 9 篇顯示風險工具能區分進展與失牙風險；PRC 與 PRA 證據最多"},{"k":"49.2%","d":"PRA 高風險者在 SPT 期間的復發比例，中風險 42.2%、低風險 18.2%（Lang 2015 引述 Matuliene 2010）"},{"k":"607 篇","d":"Dommisch 2025：基因標記的敏感度、特異度只有低到中等，沒有可用於診斷或預測的基因檢測"},{"k":"52 篇","d":"Citterio 2019：IL-1 −889 與 +3953/4 關聯研究方法品質中等，常未校正口腔衛生、社經與壓力"},{"k":"33 篇","d":"Zhang 2018：IL-10 −1082A>G 在白人與拉丁裔有保護效果，在亞洲人各模型都無關聯"},{"k":"AUC > 0.90","d":"Bostanci 2025（31 篇）：複合菌群失調指數的診斷準確度最高，但方法異質大，尚不足以臨床使用"}],"clinical":{"steps":["問診量化：每日支數與包年、3 個月內 HbA1c、家族牙周病史","Staging + Grading：最嚴重位點骨吸收百分比 ÷ 年齡，再套吸菸與 HbA1c 修飾因子","列出可改變因子並介入：戒菸諮詢、轉介控糖","非手術治療","再評估時畫 PRA：BoP%、≥ 5 mm 殘留囊袋數、失牙數、骨吸收／年齡、吸菸、全身與遺傳因子","依風險訂 SPT 間隔（內文建議：低風險 12、中 6、高 3 個月）","不建議常規做基因或單一細菌檢測"],"cases":[{"h":"重度吸菸合併未控制糖尿病（教學模擬）","b":"50 歲，每天 20 支菸、HbA1c 8.8%，骨吸收／年齡 0.8。原本是 Grade B，兩個修飾因子使其成為 Stage III Grade C。全口非手術治療，同時戒菸諮詢與轉介控糖；血糖未改善前不做複雜再生手術，SPT 每 3 個月（Tonetti 2018）。"},{"h":"早發重度破壞、想自費做 IL-1 檢測（教學模擬）","b":"35 歲、不吸菸無糖尿病，骨吸收／年齡 1.2，母親 40 歲全口假牙。診斷 Stage III Grade C。說明基因檢測沒有臨床診斷價值（Dommisch 2025），結果也不會改變治療計畫；把資源用在積極治療，並建議兄弟姊妹及子女做牙周篩檢。"},{"h":"非手術治療後殘留深囊袋（教學模擬）","b":"45 歲，治療後 6 週全口 BoP 35%、8 個 ≥ 5 mm 殘留囊袋（含 Grade II 根岔）。PRA 在 BoP 與殘留囊袋兩軸屬高風險；針對根岔與垂直骨缺損評估手術，SPT 設 3 個月（Lang 2015）。"}]},"debates":["Kornman 1997 的 OR 18.9 來自 18 人的次群組，信賴區間 1.04–343，統計不確定性極大。","候選基因研究多無法在大族群重複；GWAS 與多基因風險分數（PRS）是方向，但尚未臨床化，且多以白人資料為主（Schaefer 2018；Loos & Van Dyke 2020）。","風險評估工具只有隊列研究支持，沒有 RCT 證明使用工具能減少失牙（Lang 2015）。","菌群失調指數準確度高，但取樣與定義不一，目前證據不足以臨床使用（Bostanci 2025）。","遺傳因子在植體周圍炎的證據比牙周炎更弱，不建議植牙前做基因檢測（Darby 2022）。","IL-1 基因型的族群限制：白人 minor allele 頻率約 30–40%，亞洲人 < 5–10%，西方開發的 IL-1 檢測在臺灣幾乎沒有篩檢價值（Shaddox 2020）；且 PRA 移除 IL-1 後預測力不變（Lang 2015 引述 Matuliene 2010）。"],"quiz":[{"q":"骨吸收／年齡 0.8、每天抽 20 支菸、HbA1c 8.8%。Grade 應為？","o":["Grade A","Grade B","Grade C","因有糖尿病而無法分級"],"a":2,"e":"0.8 原屬 Grade B，但每天 ≥ 10 支菸或 HbA1c ≥ 7.0% 都會升為 Grade C（Tonetti 2018）。"},{"q":"Grossi 1994 屬於橫斷面研究，其發現最恰當的稱呼是？","o":["病因","風險指標","預後因子","診斷標準"],"a":1,"e":"單一時間點的量測無法確立暴露先於疾病，只能稱為風險指標。"},{"q":"Michalowicz 1991 的「38–82% 遺傳」最正確的解讀是？","o":["每個人有 38–82% 的機率會得牙周炎","族群中牙周指標的變異有 38–82% 可歸因於遺傳","有家族史就一定會發病","牙周炎是單一基因疾病"],"a":1,"e":"遺傳率描述的是族群變異，不是個人的發病機率；遺傳代表易感性，可以透過治療與維護控制。"},{"q":"Dommisch 2025 系統性回顧（607 篇）的結論是？","o":["IL-1 檢測應列為常規","沒有任何具臨床價值的基因診斷或預測檢測","IL-10 檢測可取代臨床檢查","基因檢測只在亞洲人有用"],"a":1,"e":"敏感度與特異度都只有低到中等，找不到可用於診斷、預防或預測的基因檢測。"},{"q":"下列何者不是 PRA 的六個參數之一？","o":["全口 BoP%","≥ 5 mm 殘留囊袋數","失牙數","牙齦厚度"],"a":3,"e":"PRA 包含 BoP%、殘留囊袋數、失牙數、骨吸收／年齡、吸菸與全身／遺傳因子，沒有牙齦厚度。"},{"q":"病人自費檢測齦下 P. gingivalis 陽性，下一步最恰當的是？","o":["立刻開全身抗生素","依臨床診斷做機械清創，單一細菌陽性不作為給藥依據","重複檢測到陰性為止","建議全家一起檢測"],"a":1,"e":"單一致病菌的診斷價值有限，健康人也可能檢出；治療核心仍是機械清創（Bostanci 2025）。"}],"lit":[{"a":"Michalowicz et al.","y":"1991","t":"Periodontal findings in adult twins","j":"J Periodontol","pm":"2072240","r":"classic","s":0,"src":""},{"a":"Grossi et al.","y":"1994","t":"Assessment of risk for periodontal disease. I. Risk indicators for attachment loss","j":"J Periodontol","pm":"8164120","r":"classic","s":0,"src":""},{"a":"Grossi et al.","y":"1995","t":"Assessment of risk for periodontal disease. II. Risk indicators for alveolar bone loss","j":"J Periodontol","pm":"7891246","r":"classic","s":0,"src":""},{"a":"Kornman et al.","y":"1997","t":"The interleukin-1 genotype as a severity factor in adult periodontal disease","j":"J Clin Periodontol","pm":"9049801","r":"classic","s":0,"src":""},{"a":"Bouchard et al.","y":"2016","t":"Risk factors in periodontology: a conceptual framework","j":"J Clin Periodontol","pm":"27862138","r":"classic","s":0,"src":""},{"a":"Genco & Borgnakke","y":"2013","t":"Risk factors for periodontal disease","j":"Periodontol 2000","pm":"23574464","r":"new","s":1,"src":"Perio 2000"},{"a":"Lang et al.","y":"2015","t":"Risk factor assessment tools for the prevention of periodontitis progression a systematic review","j":"J Clin Periodontol","pm":"25496279","r":"new","s":1,"src":"JCP"},{"a":"Nibali et al.","y":"2016","t":"Periodontal infectogenomics: systematic review of associations between host genetic variants and subgingival microbial detection","j":"J Clin Periodontol","pm":"27440507","r":"new","s":0,"src":"JCP"},{"a":"Schaefer","y":"2018","t":"Genetics of periodontitis: Discovery, biology, and clinical impact","j":"Periodontol 2000","pm":"30198130","r":"new","s":0,"src":"Perio 2000"},{"a":"Zhang et al.","y":"2018","t":"Interleukin-10 gene polymorphisms and chronic periodontitis susceptibility: Evidence based on 33 studies","j":"J Periodontal Res","pm":"30295312","r":"new","s":0,"src":"JPR"},{"a":"Citterio et al.","y":"2019","t":"Quality of methods and reporting in association studies of chronic periodontitis and IL1A -889 and IL1B +3953/4 SNPs: A systematic review","j":"J Periodontal Res","pm":"30982982","r":"new","s":0,"src":"JPR"},{"a":"Loos & Van Dyke","y":"2020","t":"The role of inflammation and genetics in periodontal disease","j":"Periodontol 2000","pm":"32385877","r":"new","s":0,"src":"Perio 2000"},{"a":"Shaddox et al.","y":"2020","t":"Periodontal health and disease: The contribution of genetics","j":"Periodontol 2000","pm":"33226705","r":"new","s":0,"src":"Perio 2000"},{"a":"Darby","y":"2022","t":"Risk factors for periodontitis & peri-implantitis","j":"Periodontol 2000","pm":"35913624","r":"new","s":0,"src":"Perio 2000"},{"a":"Dommisch et al.","y":"2025","t":"Genetic Biomarkers for Periodontal Diseases: A Systematic Review","j":"J Clin Periodontol","pm":"40197750","r":"new","s":0,"src":"JCP"},{"a":"Bostanci et al.","y":"2025","t":"Microbial Markers for Diagnosis and Risk Assessment for Periodontal Diseases: A Systematic Literature Search and Narrative Synthesis","j":"J Clin Periodontol","pm":"40414257","r":"new","s":0,"src":"JCP"},{"a":"Tonetti et al.","y":"2015","t":"Principles in prevention of periodontal diseases: Consensus report of group 1 of the 11th European Workshop on Periodontology on effective prevention of periodontal and peri-implant diseases","j":"J Clin Periodontol","pm":"25639948","r":"rel","s":0,"src":"","at":15},{"a":"Chapple et al.","y":"2017","t":"Interaction of lifestyle, behaviour or systemic diseases with dental caries and periodontal diseases: consensus report of group 2 of the joint EFP/ORCA workshop on the boundaries between caries and periodontal diseases","j":"J Clin Periodontol","pm":"28266114","r":"rel","s":0,"src":"","at":7},{"a":"Tonetti et al.","y":"2018","t":"Staging and grading of periodontitis: Framework and proposal of a new classification and case definition","j":"J Clin Periodontol","pm":"29926495","r":"rel","s":0,"src":"","at":8}]},"7":{"status":"draft","statusNote":"數字與摘要經教師核實，書目依 PubMed 更正（2026-10-22）","oneLine":"吸菸與高血糖是驅動牙周破壞最關鍵的可改變因子，要量化並寫進 Grading；牙周治療能小幅改善血糖，但對心血管只改善替代指標，不能宣稱可以預防心臟病。","takeHome":[{"h":"吸菸與血糖要量化","b":"NHANES III 中現吸菸者罹患牙周炎的機會約為不吸菸者的 4 倍，約一半的牙周炎可歸因於吸菸（Tomar & Asma 2000）。電子煙、加熱菸不是安全替代品（Chaffee 2021）。每天 ≥ 10 支菸或 HbA1c ≥ 7.0% 即為 Grade C。"},{"h":"牙周治療對血糖有幫助，但只是輔助","b":"Cochrane 回顧顯示，治療牙周炎後 3–4 個月 HbA1c 平均下降 0.43%，6 個月 0.30%（Simpson 2022，中等確定性）。效果要靠持續 SPT 維持，也不能取代降血糖藥。"},{"h":"心血管：守住實證邊界","b":"牙周治療可改善 CRP、內皮功能等替代指標，但目前沒有可靠證據能減少心肌梗塞、中風或心血管死亡（Ye 2022）。跨科合作與溝通依 EFP/WONCA 共識（Herrera 2023）。"}],"compare":[{"c":"Tomar & Asma 2000","old":"NHANES III：現吸菸者牙周炎 OR 約 4，約 52.8% 的牙周炎歸因於吸菸","v":"cond","now":"需加條件。結論仍成立，但這是半口檢查、自填菸量；現代要把電子煙、加熱菸（Chaffee 2021）與無煙菸草（Quadri 2024）一起納入問診。"},{"c":"Grossi 1997","old":"SRP 合併全身性 doxycycline，3 個月後 HbA1c 約下降 10%","v":"upd","now":"已更新。當年合併抗生素、族群單一（皮馬印第安人）；Simpson 2022 Cochrane 顯示單純齦下清創，3–4 個月 HbA1c 平均下降 0.43%。"},{"c":"Gorman 2011","old":"1,038 名男性追蹤近 30 年，肥胖者牙周惡化的風險高 40–60%（HR 1.40–1.60）","v":"cond","now":"需加條件。全為白人男性；後續統合分析支持肥胖與牙周炎有關，但強度不一（Barbato 2026：肥胖 RR 1.30，次群組分析未確認）。初診記錄 BMI 與腰圍即可。"},{"c":"Wang 2016","old":"飲酒最高 vs 最低 RR 1.59；每天多 1 g 酒精，風險增加 0.4%","v":"ok","now":"仍適用，但多為觀察性研究、異質性高，吸菸與口腔衛生的殘餘干擾難排除；重度飲酒者還要考慮配合度與傷口癒合（Ryder 2018）。"},{"c":"Genco 1999","old":"財務壓力加上情緒導向的因應方式，附連喪失與骨吸收較嚴重","v":"cond","now":"需加條件。橫斷面設計、自填問卷；現代以 allostatic load（多系統生理指標）描述長期壓力負荷（Sabbah 2018）。"},{"c":"Tonetti & Van Dyke 2013","old":"牙周炎與動脈粥樣硬化心血管疾病獨立相關；治療可降 CRP、改善內皮功能","v":"upd","now":"已更新。Ye 2022 Cochrane：初級預防只有極低確定性證據，次級預防沒有可靠證據。不能宣稱牙周治療可預防心肌梗塞或中風。"}],"numbers":[{"k":"OR 3.97","d":"Tomar & Asma 2000（12,329 人）：現吸菸者牙周炎勝算；每天 ≥ 31 支 OR 5.88，戒菸 ≥ 11 年降至 1.15（內文）"},{"k":"52.8%","d":"Tomar & Asma 2000：美國成人牙周炎可歸因於吸菸的比例（現吸菸 41.9%、曾吸菸 10.9%）"},{"k":"0.94%","d":"Grossi 1997（113 人）：SRP 合併 doxycycline 組 3 個月 HbA1c 下降幅度"},{"k":"−0.43%","d":"Simpson 2022 Cochrane（35 篇 RCT、3,249 人）：治療後 3–4 個月 HbA1c 平均下降（95% CI 0.28–0.59），6 個月 −0.30%"},{"k":"HR 1.40–1.60","d":"Gorman 2011：肥胖（BMI ≥ 30）男性牙周惡化風險（PPD 1.40、CAL 1.52、ABL 1.60）；腰圍身高比每增加 1%，HR 1.03"},{"k":"RR 1.59","d":"Wang 2016（18 篇）：飲酒最高 vs 最低；女性 2.15、男性 1.25；每天多 1 g 酒精風險 +0.4%"},{"k":"OR 2.24","d":"Genco 1999（1,426 人）：高財務壓力且情緒導向因應者的附連喪失；問題導向因應者則無顯著增加"},{"k":"OR 2.99","d":"Quadri 2024（19 篇統合）：無煙菸草使用者的牙周炎勝算；低收入國家更高（3.91）"},{"k":"PR 1.12","d":"Chisini 2019（13,491 人）：大麻使用者的牙周炎盛行率比"},{"k":"OR 1.70","d":"Ding 2022：重度牙周炎與頸動脈內中膜增厚；介入研究只有 4 篇、186 人，短期可能改善"},{"k":"OR 0.40","d":"Elena 2026：吸菸者的植體存活勝算（植體層級），骨吸收多 0.64 mm；新型菸品資料不足"},{"k":"2 篇","d":"Ye 2022 Cochrane：牙周治療預防心血管疾病，符合條件的 RCT 只有 2 篇，無法下結論"},{"k":"≥ 10 支／≥ 7.0%","d":"2017 分類：每天吸菸支數或 HbA1c 達此值即為 Grade C（Albandar 2018；Tonetti 2018）"}],"clinical":{"steps":["菸品：每日支數與包年，並問電子煙、加熱菸、無煙菸草","血糖：3 個月內 HbA1c；不知道的人轉介檢測","BMI、腰圍、飲酒量、壓力，以及心血管病史與用藥","Grading：每天 ≥ 10 支菸或 HbA1c ≥ 7.0% 為 Grade C","治療第一步：戒菸諮詢、轉介控糖、口腔衛生與生活型態衛教（Sanz 2020 EFP S3）","服抗血小板藥者做非手術治療：不常規停藥，備妥局部止血（內文引 Sanz 2020 EFP/WHF）","向病人與內科溝通：可改善血糖與全身發炎，但不宣稱能預防心臟病"],"cases":[{"h":"重度吸菸合併 HbA1c 9.2%（教學模擬）","b":"52 歲，每天 15 支菸，PPD 6–8 mm、BoP 65%。診斷 Stage III Grade C；全口非手術治療，同時戒菸諮詢與轉介控糖，暫緩再生與植牙手術。告知治療可輔助降低 HbA1c 約 0.4%，3 個月後再評估（Simpson 2022）。"},{"h":"肥胖、代謝症候群，計畫植牙（教學模擬）","b":"58 歲 SPT 期間，BMI 32、腰圍 88 cm。先確認牙周發炎已控制，給予飲食與減重衛教；植牙完成後 SPT 每 3 個月，追蹤 BoP 與骨吸收（Heitz-Mayfield 2018；Lv 2022）。"},{"h":"半年前放心臟支架、服雙重抗血小板藥（教學模擬）","b":"46 歲，高壓工作、每天飲酒 > 40 g，PPD 5–7 mm。不自行停藥，分區溫和 SRP 並做好局部止血；建議飲酒減量。給心臟科的信說明可降低口腔發炎負擔，但不宣稱能預防再梗塞（Sanz 2020；Ye 2022）。"}]},"debates":["Simpson 2022：HbA1c 平均下降 0.43%，證據確定性為中等；6 個月時降幅縮小為 0.30%，要靠持續 SPT 維持。","Hsu 2019：HbA1c ≤ 8.5% 的病人，非手術治療短期效果與非糖尿病者無顯著差異；控制不佳（> 8%）者療效較差。","Luo 2021 Cochrane：多數比較看不到血壓差異，僅一篇高血壓合併牙周炎研究短期收縮壓降 11.2 mmHg，證據確定性低。","Pinto 2018：維生素 D 與牙周病的關聯目前無定論。","Elena 2026：新型菸品對植體的資料仍不足，目前只有傳統菸有明確數據。","Barbato 2026：肥胖與牙周炎 RR 1.30，但次群組分析未進一步確認；Gorman 2011 只有男性退伍軍人。","電子煙與加熱菸缺乏長期研究，使用者常合併傳統菸（Chaffee 2021）。"],"quiz":[{"q":"35 歲、每天抽 15 支菸、骨吸收／年齡 0.3、無糖尿病。Grade 應為？","o":["Grade A","Grade B","Grade C","吸菸不影響分級"],"a":2,"e":"0.3 原屬 Grade B，但每天 ≥ 10 支菸直接升為 Grade C，並在治療第一步做戒菸諮詢。"},{"q":"病人問：「做完牙周治療，糖尿病就好了、可以停藥嗎？」最恰當的回答是？","o":["可以停藥","牙周治療可讓 HbA1c 平均降約 0.4%，是輔助，不能取代藥物","牙周治療對血糖沒有影響","要先停藥才能做牙周治療"],"a":1,"e":"Simpson 2022：3–4 個月平均降 0.43%，具臨床意義但屬輔助；仍需內科治療與持續 SPT。"},{"q":"心臟科醫師問牙周治療能否降低支架病人再次心肌梗塞的風險，依 Ye 2022 應如何回覆？","o":["可以，證據等級高","目前沒有可靠證據證明能預防心血管事件，但可降低口腔與全身發炎負擔","會增加心肌梗塞風險","只要用抗生素就可以"],"a":1,"e":"符合條件的 RCT 只有 2 篇，次級預防沒有可靠證據；溝通時說明替代指標的改善，但不宣稱預防效果。"},{"q":"Wang 2016 統合分析中，每天多攝取 1 g 酒精，牙周炎風險約增加多少？","o":["0.04%","0.4%","4%","40%"],"a":1,"e":"呈線性劑量效應，每 1 g/天約增加 0.4%；最高 vs 最低攝取 RR 1.59。"},{"q":"服雙重抗血小板藥、半年前放支架的病人要做 SRP，最恰當的做法是？","o":["停藥一週後再做","不常規停藥，分區治療並做好局部止血","拒絕治療","改用全身抗 :"Badersten 1984","old":"約 90% 的重複量測差異在 ±1 mm 內；深囊袋、鄰接面再現性較差，治療後改善","v":"ok","now":"仍適用。±1 mm 視為量測噪音；判斷疾病進展要結合 BoP 與 ≥ 2 mm 的變化。團隊校正可降低檢查者之間的差異。"},{"c":"Isidor 1984","old":"彈性咬合導板：約 95% 重複量測在 ±1 mm 內；經牙齦探骨與術中骨高度 90% 在 ±1 mm 內","v":"upd","now":"已更新。導板主要用於研究，臨床日常以 CEJ 等解剖標記為準；經牙齦探骨（sounding）仍可在局麻下用於術前評估骨缺損型態。"},{"c":"Garnick & Silverstein 2000","old":"需要約 0.6 mm 針尖與輕力道，才能量到接近囊袋底的深度","v":"upd","now":"已更新。現今建議使用標準規格的手動探針：0.5 mm 針尖、0.25 N 力道（內文引 Stødle 2025）。重點是針尖與力道標準化，並定期做力道校正。"},{"c":"Ainamo 1982（CPITN）","old":"WHO 探針（0.5 mm 球端）、6 分區、代表牙最高分，對應治療需求","v":"cond","now":"需加條件。只用於篩檢：不量 CAL，在流行病學屬低信任度定義（Trindade 2023）。已確診的病人要做全口 6 點 PPD、CAL、BoP 才能分期分級。"}],"numbers":[{"k":"0.45 / 0.73 mm","d":"Fowler 1982：0.50 N 探測，未治療時針尖越過接合上皮底部 0.45 mm；治療後停在其冠側 0.73 mm"},{"k":"1.6 mm","d":"Listgarten 1976：未治療發炎囊袋中針尖位於接合上皮冠端根方的平均距離，並侵入結締組織 0.3 mm（內文；原文無摘要）"},{"k":"約 90%","d":"Badersten 1984：重症患者重複探測，檢查者自身與彼此之間的差異都約 90% 在 ±1 mm 內"},{"k":"95% / 90%","d":"Isidor 1984：使用導板重複探測 ±1 mm 內的比例；經牙齦探骨與翻瓣實測骨高度 ±1 mm 內的比例"},{"k":"0.5 mm / 0.25 N","d":"現今建議的手動探針針尖直徑與探測力道（內文引 Stødle 2025）"},{"k":"26 篇","d":"Stødle 2025：手動探針量到的 PPD 通常較高，電子探針再現性略好，但沒有明確優勢"},{"k":"42.2%","d":"Eke 2020：NHANES 2009–2014 全口 6 點探測，美國 30–79 歲成人牙周炎盛行率（重度 7.8%）（內文）"},{"k":"61.6% vs 38.5%","d":"Trindade 2023（55 篇）：高信任度病例定義的盛行率約為低信任度定義的兩倍"},{"k":"35%","d":"Nath 2021（19 篇）：原住民族群牙周炎盛行率比非原住民高 35%"},{"k":"< 10%","d":"2017 病例定義：牙周健康為全口 BoP < 10%、PPD ≤ 3 mm、無 CAL；BoP ≥ 10% 且無 CAL 為牙齦炎（Heitz-Mayfield 2024）"},{"k":"≥ 2 顆","d":"牙周炎病例定義：≥ 2 顆非相鄰牙有鄰接面 CAL，或 ≥ 2 顆牙頰／舌側 CAL ≥ 3 mm 且 PPD > 3 mm（Papapanou 2018）"}],"clinical":{"steps":["使用標準探針（0.5 mm 針尖），力道約 0.25 N；定期用指甲或電子秤做力道校正","一般門診可用 CPITN 或 PSR 篩檢","確診時做全口 6 點 PPD、CAL、BoP","依 2017 病例定義診斷，完成 Staging 與 Grading","再評估：PPD 減少、CAL 改善解讀為發炎消退與組織阻力恢復","SPT：1 mm 的波動屬誤差，結合 BoP 與 ≥ 2 mm 的變化再升級處置","兒少：先以代表牙篩檢，有異常再全口檢查（Chapple 2026）"],"cases":[{"h":"SRP 後 CAL 改善 1 mm 是骨頭長回來嗎？（教學模擬）","b":"45 歲，16 近頰 PPD 7 → 4 mm、CAL 6 → 5 mm、BoP 轉陰。這是發炎消退、組織阻力恢復，不是組織再生（Fowler 1982）。屬良好治療反應，進入 SPT。"},{"h":"SPT 中單一位點 4 → 5 mm 且出血（教學模擬）","b":"52 歲 Stage II，26 遠頰 4 mm 變 5 mm、BoP 陽性。1 mm 可能在誤差範圍內，但出血代表有發炎。先確認探測力道、找局部原因，局部再做牙根整平並加強衛教，3 個月後再評估；CAL 累積 ≥ 2 mm 且持續出血再升級處理（Badersten 1984）。"},{"h":"15 歲牙齦紅腫、大臼齒 5 mm（教學模擬）","b":"先確認是否有真正的 CAL：沒有的話多半是假性囊袋（青春期牙齦炎）；若第一大臼齒與門牙有鄰接面 CAL，要懷疑 Grade C 牙周炎並安排全身評估（Chapple 2026）。"}]},"debates":["電子或恆壓探針再現性略好，但在診斷與療效監測上沒有明確優勢（Stødle 2025）。","乳牙與混合齒列的探測有困難，兒少缺乏各年齡的 PPD 參考值（Chapple 2026）。","只用 PPD 與 CAL 定義牙周炎，可能低估疾病對病人生活與全身的影響，有學者主張多維度定義（Papapanou & Susin 2017）。","盛行率高度取決於病例定義：CDC/AAP 2012 定義為 68.1%，2007 定義為 48.8%（Trindade 2023）。","Listgarten 1976 的樣本是待拔除的重度病牙，探針超過 JE 的數字反映未治療的發炎囊袋，不能套用到治療後的位點。"],"quiz":[{"q":"SRP 後 6 週，某位點 CAL 改善 1 mm，最正確的解讀是？","o":["骨頭長回來了","結締組織新附連","發炎消退、組織阻力增加，探針不再穿入結締組織","量測錯誤，應重測"],"a":2,"e":"Fowler 1982：治療後針尖停在接合上皮底部冠側，臨床 CAL 改善不代表組織學上的新附連。"},{"q":"SPT 時單一位點 PPD 由 4 mm 變 5 mm、BoP 陽性，最恰當的處置是？","o":["立即翻瓣手術","1 mm 可能是誤差；局部再處理，3 個月後再評估","完全不用理會","全口重新 SRP"],"a":1,"e":"約 90% 的重複量測差異在 ±1 mm 內（Badersten 1984）；但出血代表發炎，仍應局部處理並追蹤。"},{"q":"門診病人 CPITN Code 3，可以直接診斷為 Stage II 牙周炎嗎？","o":["可以","不行，CPITN 不量 CAL、只看代表牙，需補做全口 6 點檢查","只要有 X 光就可以","Code 3 一定是 Stage III"],"a":1,"e":"CPITN 是篩檢工具；Staging 需要 CAL、骨吸收等資訊，必須做全口檢查。"},{"q":"Stødle 2025 系統性回顧對電子／恆壓探針的結論是？","o":["明顯優於手動探針","沒有明確優勢，手動探針仍是臨床標準","已取代手動探針","只適合兒童"],"a":1,"e":"26 篇研究中，電子探針再現性略好，但看不出明確優勢。"},{"q":"Trindade 2023 發現，高信任度與低信任度病例定義得到的牙周炎盛行率約為？","o":["幾乎相同","61.6% vs 38.5%","20% vs 80%","低信任度定義較高"],"a":1,"e":"採用全口檢查與明確 CAL／PPD 組合的定義，盛行率約為 CPI 等定義的兩倍。"},{"q":"依 2017 病例定義，完整牙周組織的「牙周健康」需符合？","o":["BoP < 30%","BoP < 10%、PPD ≤ 3 mm、無 CAL","PPD ≤ 5 mm","沒有牙結石"],"a":1,"e":"全口 BoP ≥ 10% 但沒有 CAL 為牙齦炎；健康需 BoP < 10%、PPD ≤ 3 mm 且無附連喪失。"}],"lit":[{"a":"Listgarten et al.","y":"1976","t":"Periodontal probing and the relationship of the probe tip to periodontal tissues","j":"J Periodontol","pm":"1067404","r":"classic","s":0,"src":""},{"a":"Fowler et al.","y":"1982","t":"Histologic probe position in treated and untreated human periodontal tissues","j":"J Clin Periodontol","pm":"6754765","r":"classic","s":0,"src":""}, s and periodontitis)","j":"Periodontol 2000","pm":"38831568","r":"new","s":0,"src":"Perio 2000"},{"a":"Caton et al.","y":"2018","t":"A new classification scheme for periodontal and peri-implant diseases and conditions - Introduction and key changes from the 1999 classification","j":"J Clin Periodontol","pm":"29926489","r":"cons","s":0,"src":""},{"a":"Papapanou et al.","y":"2018","t":"Periodontitis: Consensus report of workgroup 2 of the 2017 World Workshop on the Classification of Periodontal and Peri-Implant Diseases and Conditions","j":"J Clin Periodontol","pm":"29926490","r":"cons","s":0,"src":""},{"a":"Tonetti et al.","y":"2018","t":"Staging and grading of periodontitis: Framework and proposal of a new classification and case definition","j":"J Clin Periodontol","pm":"29926495","r":"cons","s":0,"src":""},{"a":"Herrera et al.","y":"2025","t":"Consensus Report of the 20th European Workshop on Periodontology: Contemporary and Emerging Technologies in Periodontal Diagnosis","j":"J Clin Periodontol","pm":"40320757","r":"rel","s":0,"src":"","at":9},{"a":"Chapple et al.","y":"2026","t":"Gingival and Periodontal Diseases and Conditions in Children and Adolescents: Consensus Report","j":"J Clin Periodontol","pm":"41983269","r":"rel","s":0,"src":"","at":21}]},"9":{"status":"draft","statusNote":"數字與摘要經教師核實，書目依 PubMed 更正（2026-10-22）","oneLine":"持續不出血是牙周穩定最可靠的指標（NPV 約 98%），但出血本身預測破壞的能力很低；影像以 2D 數位片配合探針為主，CBCT 只用於特定複雜情況，AI 與生物標記目前只是輔助。","takeHome":[{"h":"BoP 要看陰性，不要過度解讀陽性","b":"每次回診都出血的位點，日後附連喪失的機會約 30%（Lang 1986）；持續不出血的 NPV 達 98%，PPV 卻只有 6%（Lang 1990）。PPD 增加合併頻繁出血，預測力最好（Claffey 1990）。"},{"h":"影像以 2D 為主，CBCT 有適應症","b":"2D 片看不清骨缺損的立體型態；有結石的根面 X 光只偵測到 44%（Buchanan et al. 1987）；furcation arrow 敏感度不到 40%（Deas 2006）。CBCT 不作常規，只在複雜骨缺損、根岔或再生手術規劃時考慮（Mandelaris 2017；Jacobs 2024）。"},{"h":"AI 與生物標記目前只是輔助","b":"AI 偵測根岔、骨吸收準確度高，但多為單中心、缺乏外部驗證（Atieh 2025；Tichy 2026）；MMP-8 等標記有輔助潛力。手動探測仍是參考標準（Herrera 2025）。"}],"compare":[{"c":"Lang 1986","old":"4 次回診都出血的位點，日後附連喪失約 30%；全口 BoP ≥ 16% 的病人風險較高","v":"cond","now":"需加條件。這是位點層級分析，未校正吸菸、糖尿病等病人因素；出血代表發炎，不等於正在破壞，要結合 PPD 變化與病人風險評估。"},{"c":"Lang 1990","old":"持續不出血是牙周穩定的指標：NPV 98%，PPV 僅 6%","v":"ok","now":"仍適用。SPT 中持續不出血的位點可視為穩定，不需要再深層牙根整平。"},{"c":"Claffey 1990","old":"治療後追蹤 3.5 年：PPD 增加合併頻繁出血，預測附連喪失最好","v":"ok","now":"仍適用。單一參數預測力有限；Renvert & Persson 2002 也指出殘留 PPD 有預測力。"},{"c":"Rees 1971","old":"2D X 光無法準確呈現頰舌側骨板與骨缺損壁數","v":"cond","now":"需加條件。2D 的重疊限制仍在；計畫再生手術的複雜骨缺損，才考慮小視野 CBCT（Mandelaris 2017；Herrera 2025）。"},{"c":"Buchanan et al. 1987","old":"有結石的根面，X 光只偵測到 44%；偽陽性 7.5%","v":"ok","now":"仍適用。X 光上看不到結石，不代表根面乾淨，仍要靠探針觸覺檢查；深囊袋單純牙根整平也常有殘留，必要時翻瓣（Buchanan & Robertson 1987）。"},{"c":"Chen 2004","old":"數位 X 光以投影長度或面積估算支持根比例","v":"cond","now":"需加條件。線性與面積估算都無法可靠估計支持根比例，骨破壞超過 2 mm 時面積估算才較接近；不宜當作精確的預後工具。"},{"c":"Deas 2006","old":"furcation arrow 敏感度 38.7%、特異度 92.2%，判讀一致性低","v":"upd","now":"已更新。根岔診斷以 Nabers 探針為主，X 光箭號只當提醒；複雜病例需要時再用 CBCT（Jacobs 2024）。"}],"numbers":[{"k":"30%","d":"Lang 1986：4/4 回診出血位點日後附連喪失（≥ 2 mm）的機會；3/4 為 14%、2/4 為 6%、1/4 為 3%、0/4 為 1.5%"},{"k":"NPV 98%","d":"Lang 1990：持續不出血預測穩定（NPV 98.1%）；以頻繁出血（≥ 5/6 次）為門檻，特異度 88.4%、PPV 僅 5.8%"},{"k":"44%","d":"Buchanan et al. 1987：18 位病人、275 個鄰接面，顯微鏡下有結石的牙面，X 光能偵測到的比例；偽陽性 7.5%"},{"k":"38.7%","d":"Deas 2006：furcation arrow 的敏感度；特異度 92.2%、PPV 71.7%、檢查者間 κ 0.489"},{"k":"1 篇／16 人","d":"Renvert & Persson 2002：符合病人層級分析的研究只有 1 篇（16 人、42 個月）"},{"k":"10% / 30%","d":"Trombelli 2018：BoP ≥ 10% 為牙齦炎；10–30% 為局部、> 30% 為廣泛"},{"k":"6 篇","d":"de Morais 2017：牙周病患者 MMP-8 濃度顯著較高，可作輔助診斷"},{"k":"AUC 0.864","d":"Dong 2025：微生物來源生物標記整體診斷準確度"},{"k":"> 7,800 張","d":"Atieh 2025（8 篇）：深度學習偵測根岔侵犯，納入的 X 光片數量；表現與專家相近"},{"k":"AUROC 0.84–0.93","d":"Tichy 2026：AI 在 X 光上偵測骨吸收；多為單中心資料，外部測試很少"},{"k":"0.82","d":"2D 口內 X 光診斷牙周炎的整體準確度（Herrera 2025 彙整 Discepoli 2025）"},{"k":"≥ 3 mm","d":"Renvert 2018：沒有舊片時，骨高度 ≥ 3 mm 加上 BoP 與 PD ≥ 6 mm 提示植體周圍炎"}],"clinical":{"steps":["每次記錄全口 BoP%，並追蹤個別位點的出血頻率","PPD ≤ 4 mm 且不出血：常規維護，不深層牙根整平","殘留囊袋合併反覆出血：局部再處理，看 PPD 是否增加","初診與追蹤：2D 數位根尖片或咬翼片，採平行技術","根岔：以 Nabers 探針為主，X 光箭號只當提醒","CBCT：計畫再生或根岔手術、複雜骨缺損時才用小視野","AI 與生物標記當作第二意見，不取代臨床探測"],"cases":[{"h":"再評估時殘留 6 mm 且出血（教學模擬）","b":"45 歲 Stage III Grade B，治療後 3 個月 16 遠心 PPD 6 mm、BoP 陽性。其他不出血位點維持 SPT；這個位點先拍 2D 片評估骨缺損型態，懷疑深骨內缺損時再考慮小視野 CBCT 規劃再生手術（Claffey 1990；Mandelaris 2017）。"},{"h":"X 光疑似 furcation arrow（教學模擬）","b":"50 歲，上顎第一大臼齒近心根岔區有模糊箭號影像。不能單憑 X 光確診；用 Nabers 探針測得 Class II，因計畫根岔再生或切根手術，才符合 CBCT 適應症（Deas 2006；Jacobs 2024）。"},{"h":"Grade C 病人的 SPT 監測（教學模擬）","b":"35 歲快速進展型，術後進入 SPT。以 BoP 與 PPD 為主，AI 量化骨高度變化、MMP-8 檢測當作輔助；SPT 間隔縮短到 2–3 個月（Herrera 2025）。"}]},"debates":["Renvert & Persson 2002 符合病人層級分析的研究只有 1 篇（16 人、42 個月）：殘留 PPD ≥ 6 mm 有預測力，單純持續 BoP 沒有獨立預測力；吸菸與糖尿病屬全口風險評估的考量，不是這篇 SR 的數據。","植體周圍炎的 X 光門檻分兩種：有基線片時看骨吸收是否增加；沒有基線片時，骨高度 ≥ 3 mm 加 PD ≥ 6 mm 與 BoP／化膿（Renvert 2018）。","Chen 2004 只有 8 顆離體牙；線性與面積估算都不完全可靠，骨破壞 > 2 mm 時面積估算才較接近實際。","AI 研究多以醫師判讀 X 光為參考標準，且多為單中心資料，外部測試很少（Atieh 2025；Tichy 2026）。","生物標記研究方法不一：Baima 2021 的 GCF 代謝體研究中，只有 1 篇報告診斷準確度。","MRI、超音波仍在概念驗證階段，日常診斷仍以 X 光與 CBCT 為主（Yeung 2024）。","矩形準直器可降低 ≥ 40% 劑量，是 Jacobs 2024 引述的數據。"],"quiz":[{"q":"Lang 1990 中，「持續不出血」最主要的臨床意義是？","o":["表示正在破壞","陰性預測值約 98%，可視為穩定","陽性預測值很高","一定需要深層牙根整平"],"a":1,"e":"不出血的 NPV 達 98%；出血的 PPV 只有 6%。"},{"q":"Lang 1986 中，4 次回診都出血的位點，日後發生附連喪失的機會約為？","o":["約 3%","約 30%","約 70%","100%"],"a":1,"e":"約 30%；也就是說，約七成反覆出血的位點並沒有發生附連喪失。"},{"q":"X 光上出現疑似 furcation arrow，最恰當的處置是？","o":["直接診斷 Class III","以 Nabers 探針實際探測確認","箭號沒出現就排除根岔侵犯","立即拍全口 CBCT"],"a":1,"e":"Deas 2006：箭號敏感度只有 38.7%，判讀一致性也低，不能單憑影像診斷。"},{"q":"住院醫師想替所有 Class I 與 Class II 根岔病人拍 CBCT，是否符合共識？","o":["符合","不符合，CBCT 不作常規，只在計畫再生或切根等複雜手術時考慮","只要病人同意就可以","Class I 一定要拍"],"a":1,"e":"Mandelaris 2017 與 Herrera 2025 都不支持常規使用 CBCT。"},{"q":"X 光上沒看到牙結石，代表？","o":["根面一定乾淨","不一定；X 光只能偵測到約 44% 有結石的根面","結石已經鈣化完全","不需要探查"],"a":1,"e":"Buchanan et al. 1987：X 光敏感度低，仍要靠探針觸覺檢查。"},{"q":"廠商宣稱 AI 對根岔診斷準確率達 99%，引進前最該確認的是？","o":["軟體價格","是否有多中心外部驗證，以及參考標準是否為手術實測","介面是否中文","訓練資料是否越少越好"],"a":1,"e":"多數 AI 研究為單中心、以醫師看 X 光為參考標準，泛用性是主要限制（Atieh 2025；Tichy 2026）。"}],"lit":[{"a":"Rees et al.","y":"1971","t":"Radiographic interpretation of periodontal osseous lesions","j":"Oral Surg Oral Med Oral Pathol","pm":"5281547","r":"classic","s":0,"src":""},{"a":"Lang et al.","y":"1986","t":"Bleeding on probing. A predictor for the progression of periodontal disease?","j":"J Clin Periodontol","pm":"3489010","r":"classic","s":0,"src":""},{"a":"Buchanan et al.","y":"1987","t":"Radiographic detection of dental calculus","j":"J Periodontol","pm":"3480347","r":"classic","s":0,"src":""},{"a":"Claffey et al.","y":"1990","t":"Diagnostic predictability of scores of plaque, bleeding, suppuration and probing depth for probing attachment loss. 3 1/2 years of observation following initial periodontal therapy","j":"J Clin Periodontol","pm":"2406292","r":"classic","s":0,"src":""},{"a":"Lang et al.","y":"1990","t":"Absence of bleeding on probing. An indicator of periodontal stability","j":"J Clin Periodontol","pm":"2262585","r":"classic","s":0,"src":""},{"a":"Chen et al.","y":"2004","t":"Accuracy of supported root ratio estimation from projected length and area using digital radiographs","j":"J Periodontol","pm":"15295954","r":"classic","s":0,"src":""},{"a":"Deas et al.","y":"2006","t":"Clinical reliability of the \"furcation arrow\" as a diagnostic marker","j":"J Periodontol","pm":"16881813","r":"classic","s":0,"src":""},{"a":"Renvert & Persson","y":"2002","t":"A systematic review on the use of residual probing depth, bleeding on probing and furcation status following initial periodontal therapy to predict further attachment and tooth loss","j":"J Clin Periodontol","pm":"12787209","r":"new","s":1,"src":"JCP"},{"a":"Jacobs et al.","y":"2024","t":"Radiographic diagnosis of periodontal diseases - Current evidence versus innovations","j":"Periodontol 2000","pm":"38831570","r":"new","s":1,"src":"Perio 2000"},{"a":"Barros et al.","y":"2016","t":"Gingival crevicular fluid as a source of biomarkers for periodontitis","j":"Periodontol 2000","pm":"26662482","r":"new","s":0,"src":"Perio 2000"},{"a":"Zhang et al.","y":"2016", "r":"cons","s":0,"src":""},{"a":"Herrera et al.","y":"2025","t":"Consensus Report of the 20th European Workshop on Periodontology: Contemporary and Emerging Technologies in Periodontal Diagnosis","j":"J Clin Periodontol","pm":"40320757","r":"cons","s":0,"src":""},{"a":"Chapple et al.","y":"2018","t":"Periodontal health and gingival diseases and conditions on an intact and a reduced periodontium: Consensus report of workgroup 1 of the 2017 World Workshop on the Classification of Periodontal and Peri-Implant Diseases and Conditions","j":"J Clin Periodontol","pm":"29926499","r":"rel","s":0,"src":"","at":4},{"a":"Lang & Bartold","y":"2018","t":"Periodontal health","j":"J Clin Periodontol","pm":"29926485","r":"rel","s":0,"src":"","at":4},{"a":"Renvert et al.","y":"2018","t":"Peri-implant health, peri-implant mucositis, and peri-implantitis: Case definitions and diagnostic considerations","j":"J Clin Periodontol","pm":"29926496","r":"rel","s":0,"src":"","at":51},{"a":"Buchanan & Robertson","y":"1987","t":"Calculus removal by scaling/root planing with and without surgical access","j":"J Periodontol","pm":"3550036","r":"rel","s":0,"src":"","at":17}]},"10":{"status":"draft","statusNote":"數字與摘要經教師核實，書目依 PubMed 更正（2026-10-23）","oneLine":"傳統預後分類只對「良好」預測準確；現代預後以牙周穩定（PPD ≤ 4 mm、不出血）為終點，在初診、再評估、維護期三個階段動態調整，大臼齒與非大臼齒分開評估，並把吸菸、糖尿病與維護依從性納入加權。","takeHome":[{"h":"預後要動態調整，終點是牙周穩定","b":"McGuire 1991 的傳統分類只有 Good 預測準確（5 年、8 年都有 > 84% 維持或改善），Questionable 5 年後沒有一顆留在原分類。Kwok & Caton 2007 改以牙周支持組織穩定為終點，分 Favorable、Questionable、Unfavorable、Hopeless 四級，初診、再評估、維護期都要重新判定。"},{"h":"大臼齒與非大臼齒分開看","b":"Nunn 2012 的 CART 存活樹：大臼齒首要因子是冠根比與根岔侵犯，非大臼齒首要是 PPD > 5 mm 與動搖度。Helal 2019 統合：大臼齒 OR 4.22、動搖度 3.71、深囊袋 3.19、根岔侵犯 2.68。"},{"h":"病人層級因子要加權，但不要過度推論","b":"Helal 2019：吸菸 OR 1.98、糖尿病 1.80、不依從維護 1.51。McGuire & Nunn 1996：吸菸 RR 2.06、未戴咬合板的磨牙 RR 2.17。Chen 2026：現吸菸 RR 1.41、前吸菸 RR 1.21，但輕度與重度吸菸風險相近，劑量反應尚未確立，證據確定性極低。"}],"compare":[{"c":"McGuire 1991","old":"傳統五級預後對 Good 預測準確，對 Poor、Questionable 預測差；病人堅持保留的 14 顆 Hopeless 中，6 顆 5 年後仍存留","v":"cond","now":"需加條件。單一診所、單一醫師、高依從病人，未獨立分析吸菸與糖尿病；Helal 2019 顯示這些病人層級因子都會增加拔牙風險。初診 Hopeless 不急著拔，再評估後再判定。"},{"c":"McGuire & Nunn 1996","old":"以初診臨床參數建立 Cox 模型：PPD、根岔侵犯、動搖度、骨喪失、吸菸（RR 2.06）、未戴咬合板的磨牙（RR 2.17）增加拔牙風險","v":"upd","now":"已更新。模型只用初診單點數值；Carvalho 2021 統合迴歸顯示吸菸、糖尿病、根岔病變等基線特徵都無法穩定預測長期維護期拔牙，預後要在維護期動態重新評估。"},{"c":"McGuire & Nunn 1996（終點）","old":"牙齒喪失是評估預後的真實終點","v":"upd","now":"已更新。Kwok & Caton 2007 指出拔牙常受醫師治療哲學、補綴規劃、齲齒與牙根斷裂等非牙周因素影響；外部驗證研究也改以「牙周相關拔牙」為終點（Saleh 2021，Orishko 2024 轉述）。"},{"c":"Kwok & Caton 2007","old":"以牙周支持組織穩定取代牙齒喪失作為終點；四級預後依風險因子是否可控而動態調整","v":"ok","now":"仍適用。符合現代以控制發炎為目標的觀念；同一架構已延伸到植體預後（Kwok 等 2023，Orishko 2024 轉述）。"},{"c":"Nunn et al. 2012","old":"CART 存活樹：大臼齒與非大臼齒的預後決定因子不同","v":"cond","now":"需加條件。外部驗證中 Nunn 系統鑑別力名列前茅（Saleh 2021，Orishko 2024 轉述），但單一診所導出的具體切點（如大臼齒 PPD 7 或 9 mm）尚未獨立驗證。"}],"numbers":[{"k":"0.12 顆/人/年","d":"Helal 2019：20 篇、15,422 位病人、平均追蹤 12 年，維護期平均每人每年喪失的牙數（範圍 0.01–0.36）"},{"k":"0.1 顆/人/年","d":"Carvalho 2021：追蹤 ≥ 5 年的長期維護，約每 10 年喪失 1 顆；因牙周原因拔牙占 0.45–14.4%"},{"k":"> 84%","d":"McGuire 1991：初診 Good 的牙齒 5 年（84.6%）、8 年（84.7%）後維持或改善"},{"k":"6／14 顆","d":"McGuire 1991：病人堅持保留的 Hopeless 牙 5 年後仍存留（42.9%）；全部 Hopeless 牙中 25% 重新歸類為 Good 或 Fair"},{"k":"131／2,509 顆","d":"McGuire & Nunn 1996：100 位病人追蹤至 16 年（平均 9.97 年）共拔除 131 顆（5.2%）"},{"k":"RR 2.06／2.17","d":"McGuire & Nunn 1996 Cox 模型：吸菸、未戴咬合板的磨牙；動搖度 RR 2.05、PPD 每增加 1 mm RR 1.39"},{"k":"OR 4.22","d":"Helal 2019 牙齒層級：大臼齒；動搖度 3.71、深囊袋 3.19、根岔侵犯 2.68、骨喪失每 1% 為 1.04"},{"k":"OR 1.98","d":"Helal 2019 病人層級：吸菸；糖尿病 1.80、不依從維護 1.51、年齡每歲 1.05；性別與牙髓病變不顯著"},{"k":"RR 1.41","d":"Chen 2026：現吸菸 vs 非吸菸（5 篇世代研究、64,413 人）；前吸菸 RR 1.21（2 篇）；GRADE 證據確定性極低"},{"k":"RR 1.59／1.57","d":"Chen 2026 子組分析：輕度與重度吸菸者風險相近，劑量反應尚未確立"}],"clinical":{"steps":["初診逐顆給初步預後（Favorable、Questionable、Unfavorable、Hopeless），寫出理由與可控因子","大臼齒先看冠根比、根岔侵犯分級（Nabers 探針）、根形與磨牙習慣","非大臼齒先看 PPD > 5 mm、動搖度、是否為活動假牙支台齒","記錄吸菸支數與包年數、HbA1c、維護依從性；所有吸菸者都做戒菸諮詢","初診 Questionable 或 Hopeless 先不拔，非手術治療後 6–8 週再評估重新判定","維護期每次比對六點探測，PPD 增加合併出血就調降預後並局部處理","有
