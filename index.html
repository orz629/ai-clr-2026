<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15262E">
<title>牙周經典文獻複習手冊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* Layout: one phone-width column; home = module index, #sNN = one session's review card stack. */
:root{
  --bg:#F3F5F2; --card:#FFFFFF; --ink:#1B2A31; --muted:#56656B; --line:#D7DFDC;
  --deep:#15262E; --deep-ink:#F3F5F2; --teal:#1F7A72; --teal-soft:#E2EFEC; --amber:#A8650F; --amber-soft:#FBEFD9;
  --good:#2E6B3A; --good-soft:#E3F0E2; --bad:#9B2C2C; --bad-soft:#F8E4E2;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10191D; --card:#18242A; --ink:#E6ECEA; --muted:#9AAAAE; --line:#2A3A40;
  --deep:#0B1316; --deep-ink:#E6ECEA; --teal:#5FB8AE; --teal-soft:#1C3532; --amber:#E2A35A; --amber-soft:#33281A;
  --good:#8FCB8A; --good-soft:#1E3020; --bad:#F09A90; --bad-soft:#3A2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10191D; --card:#18242A; --ink:#E6ECEA; --muted:#9AAAAE; --line:#2A3A40;
  --deep:#0B1316; --deep-ink:#E6ECEA; --teal:#5FB8AE; --teal-soft:#1C3532; --amber:#E2A35A; --amber-soft:#33281A;
  --good:#8FCB8A; --good-soft:#1E3020; --bad:#F09A90; --bad-soft:#3A2220; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--teal)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
.hero{background:var(--deep);color:var(--deep-ink);padding-block:28px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero .in{max-width:720px;margin:0 auto;display:grid;gap:10px}
.eyebrow{font-size:.78rem;letter-spacing:.12em;color:#8FCFC6;font-weight:500}
.hero h1{font-family:var(--serif);font-size:1.75rem;line-height:1.3}
.hero p{margin:0;color:#BFD0D3;font-size:.92rem}
.prog{display:flex;align-items:center;gap:10px;font-size:.85rem;color:#BFD0D3;font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;background:#2C4048;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:#8FCFC6;border-radius:99px}
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:12px 8px}
.search input{width:100%;font:16px var(--sans);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.hint{color:var(--muted);font-size:.85rem;margin:6px 2px 0}
.mod{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mod>button{width:100%;display:flex;gap:12px;align-items:center;background:none;border:0;padding:14px 16px;text-align:left;cursor:pointer}
.mcode{font-family:var(--serif);font-weight:700;font-size:1.15rem;color:var(--teal);width:1.4em;flex:none}
.mname{flex:1;font-weight:700;min-width:0}
.mcount{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s;flex:none;margin-right:4px}
.mod.open .chev{transform:rotate(45deg)}
.slist{display:none;border-top:1px solid var(--line)}
.mod.open .slist{display:block}
.srow{display:flex;gap:12px;align-items:center;padding:12px 16px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.snum{font:500 .8rem var(--sans);color:var(--muted);font-variant-numeric:tabular-nums;width:2.4em;flex:none}
.stitle{flex:1;min-width:0;font-size:.95rem}
.tag{font-size:.7rem;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.ready{background:var(--teal-soft);color:var(--teal)}
.tag.done{background:var(--good-soft);color:var(--good)}
.empty{padding:24px;text-align:center;color:var(--muted)}
/* session */
.top{position:sticky;top:0;z-index:6;background:var(--deep);color:var(--deep-ink);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--deep)}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top a{color:var(--deep-ink);text-decoration:none;font-size:.9rem;display:flex;align-items:center;gap:4px}
.top .where{font-size:.8rem;color:#9FB6BA;margin-left:auto;text-align:right}
.shead{padding-block:22px 6px;display:grid;gap:8px}
.shead .eyebrow{color:var(--teal)}
.shead h1{font-family:var(--serif);font-size:1.6rem;line-height:1.35;text-wrap:pretty}
.status{font-size:.8rem;border-radius:8px;padding:6px 10px;background:var(--amber-soft);color:var(--amber);justify-self:start}
.status.ok{background:var(--good-soft);color:var(--good)}
.jump{position:sticky;top:40px;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:.82rem;cursor:pointer}
section.blk{margin-top:18px;display:grid;gap:10px;scroll-margin-top:110px}
section.blk>h2{font-size:1.05rem;display:flex;align-items:center;gap:8px}
section.blk>h2::before{content:"";width:4px;height:1.1em;background:var(--teal);border-radius:2px}
.one{background:var(--deep);color:var(--deep-ink);border-radius:12px;padding:18px;font-family:var(--serif);font-size:1.15rem;line-height:1.6}
.th{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.th b.n{font-family:var(--serif);color:var(--teal);font-size:1.3rem;line-height:1.2;grid-row:span 2}
.th h3{font-size:1rem}
.th p{margin:0;color:var(--muted);font-size:.92rem}
.cmp{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cmp .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.cmp .hd b{font-size:.95rem}
.v{font-size:.75rem;padding:2px 10px;border-radius:99px;white-space:nowrap}
.v.ok{background:var(--good-soft);color:var(--good)}
.v.cond{background:var(--amber-soft);color:var(--amber)}
.cmp .row{display:grid;grid-template-columns:3.2em 1fr;gap:8px;padding:10px 14px;font-size:.92rem}
.cmp .row+.row{border-top:1px dashed var(--line)}
.cmp .lab{font-size:.75rem;color:var(--muted);padding-top:3px}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.num{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;min-width:0}
.num b{font-family:var(--serif);font-size:1.25rem;color:var(--teal);font-variant-numeric:tabular-nums;line-height:1.25}
.num span{font-size:.82rem;color:var(--muted)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:6px}
ol.steps li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 44px;position:relative;font-size:.93rem}
ol.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--teal);color:var(--card);font-size:.75rem;display:grid;place-items:center;font-weight:700}
.case{background:var(--teal-soft);border-radius:12px;padding:12px 14px}
.case h3{font-size:.95rem;margin-bottom:2px}
.case p{margin:0;font-size:.92rem}
ul.deb{margin:0;padding:0;list-style:none;display:grid;gap:6px}
ul.deb li{background:var(--amber-soft);border-radius:10px;padding:10px 12px;font-size:.92rem}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.q .qq{font-weight:700;font-size:.97rem}
.q button.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:.93rem}
.q button.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.q button.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.q .exp{font-size:.9rem;color:var(--muted);border-left:3px solid var(--teal);padding-left:10px}
.score{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.litg h3{font-size:.85rem;color:var(--muted);font-weight:500;margin:6px 2px 4px}
.lit{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px;font-size:.88rem;margin-bottom:6px}
.lit .au{font-weight:700}
.lit .ti{color:var(--ink)}
.lit .mt{color:var(--muted);font-size:.8rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:.7rem;padding:1px 8px;border-radius:99px;background:var(--teal-soft);color:var(--teal)}
.pill.star{background:var(--amber-soft);color:var(--amber)}
.pill.cl{background:var(--deep);color:var(--deep-ink)}
details.more summary{cursor:pointer;color:var(--teal);font-size:.88rem;padding:6px 2px}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel a{text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:.85rem;color:var(--ink)}
.todo{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);font-size:.92rem}
.foot{margin-top:28px;display:grid;gap:10px}
.mark{width:100%;border:1px solid var(--teal);background:var(--teal);color:var(--card);border-radius:12px;padding:13px;font-weight:700;cursor:pointer}
.mark.on{background:transparent;color:var(--teal)}
.pn{display:flex;gap:8px}
.pn a{flex:1;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font-size:.85rem;min-width:0}
.pn a small{display:block;color:var(--muted)}
.pn a.nx{text-align:right}
.note{font-size:.78rem;color:var(--muted);margin-top:24px;text-align:center}
.report{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.report h2{font-size:.95rem}
.report p{margin:0;font-size:.85rem;color:var(--muted)}
.report .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.report a.btn{background:var(--teal);color:var(--card);text-decoration:none;border-radius:10px;padding:9px 14px;font-weight:700;font-size:.9rem}
.report .mail{font-size:.85rem;user-select:all;color:var(--ink)}
.report textarea{width:100%;font:13px/1.5 var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
.report .fallback{display:grid;gap:8px}
.report .fallback[hidden]{display:none}
.report button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-size:.85rem;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script id="review-data" type="application/json">{"1":{"status":"draft","statusNote":"依教師完成之大綱與內文（第二版及 2026-10-19 補充）整理；待負責住院醫師核對","oneLine":"正常牙齦的外觀要合併判讀；「2 mm 角化牙齦」已從手術門檻變成情境判斷，牙齦厚度與菌斑控制同樣重要。","takeHome":[{"h":"外觀特徵要合併判讀","b":"stippling、MGJ 的凹溝都可能缺席。牙齦健康要看探測深度與出血，MGJ 要用 roll test 或染色確認。"},{"h":"「2 mm」是情境判斷，不是手術門檻","b":"菌斑控制好時，有無足夠角化組織的牙周健康差異不大；即將矯正或修復時，KTW 與 GT 都要評估，KTW < 2 mm 且 GT < 1 mm 時考慮表型改造。"},{"h":"表型可以被改變，術後越厚越寬越穩定","b":"術後 GT 每多 1 mm，未來退縮少 0.71 mm；自體軟組織移植的長期效果最好。"}],"compare":[{"c":"Greene 1962","old":"stippling 不能單獨當健康指標","v":"ok","now":"仍適用。2017 年把健康的判準放在探測出血：0.25 N 探測不出血，預測穩定的陰性預測值 98–99%（Lang & Bartold 2018 引述）。"},{"c":"Holmes 1965","old":"齒間頂端多為非角化的 col；乳頭切除後長不回原樣","v":"ok","now":"仍適用。癒合快、少疤不等於恢復原本立體形態（Bartold 2000）；EFP S3 R3.9（A 級）建議再生手術用最大程度保存齒間軟組織的翻瓣（Sanz 2020）。"},{"c":"Lozdan & Squier 1969","old":"MGJ 以彈性纖維定義，兩側組織本質不同","v":"ok","now":"仍適用。彈性蛋白在可移動的齒槽黏膜較多；手術後牙齦少疤、齒槽黏膜會留疤（Bartold 2000）。"},{"c":"Lang & Löe 1972","old":"角化牙齦 < 2 mm，即使沒有菌斑仍會發炎","v":"cond","now":"需加條件。菌斑控制理想時，有無移植的牙周健康沒有差別（Barootchi 2020 引述）；要同時看 GT 與齦緣穩定，KTW < 2 mm 且 GT < 1 mm 才強烈考慮改造（Carbone 2023）。"},{"c":"Perlmutter & Tal 1986","old":"去色素後回色的時程不可預測","v":"ok","now":"仍適用，但缺乏新證據；只能用黑色素細胞的生物學解釋（Bartold 2000）。"}],"numbers":[{"k":"< 2 mm","d":"Lang & Löe 1972：32 位牙科學生、1406 個面、監督潔牙 6 週；角化牙齦 < 2 mm 的面全部有臨床發炎"},{"k":"22 / 30","d":"Holmes 1965：再生乳頭中 22 個沒長回原高度，留下 0.5–2.0 mm 空隙；沒有一個回到原本輪廓"},{"k":"19 / 20","d":"Greene 1962：接受治療的患者中，19 位在牙齦恢復健康後重新出現 stippling"},{"k":"5 天／7 天","d":"Bartold 2000：齦切傷口第 5 天完全被上皮覆蓋，第 7 天出現新的角質層"},{"k":"≤ 1.0 mm","d":"常用的薄型牙齦厚度分界；薄型盛行率在各研究從 12% 到 81%，差異主要來自評估方法（Zweers 2014）"},{"k":"−0.71 mm","d":"Barootchi 2020（105 篇 RCT）：術後 GT 每多 1 mm，未來退縮少 0.71 mm"},{"k":"+4.72 mm","d":"Barootchi 2020：游離牙齦移植（FGG）增加角化組織最多；CTG 增加 GT 最多（0.66 mm）"},{"k":"0.8–1.3 mm","d":"Carbone 2023：追蹤超過 10 年的 FGG 研究可見的爬行附著"},{"k":"67–75%","d":"Lin 2025 引述：與卡尺量測相比，探針透視法把薄型誤判為厚型的機率"},{"k":"0.3–0.5 mm","d":"Schulze 2024：一般情況下，不要期待 CBCT 的準確度高於這個範圍"},{"k":"5–12% → 47%","d":"Tonetti 2025 引述：矯正結束時的退縮盛行率，5 年長     var r=R[s.n], t=[s.topic,MOD[s.mod].name,'S'+pad(s.n)];
    lit(s).forEach(function(x){t.push(x.a,x.t,x.y)});
    if(r){t.push(r.oneLine);(r.takeHome||[]).forEach(function(x){t.push(x.h,x.b)});(r.compare||[]).forEach(function(x){t.push(x.old,x.now)});(r.numbers||[]).forEach(function(x){t.push(x.d)})}
    return t.join(' ').toLowerCase();
  }
  var HAY={}; D.sessions.forEach(function(s){HAY[s.n]=hay(s)});

  var MAIL='chygwu@gmail.com';
  function report(n){
    var s=n?S[n]:null, where=s?('S'+pad(n)+' '+s.topic):'目錄／整體網頁';
    var url='';try{url=location.href}catch(e){} if(!/^https?:/.test(url)) url='';
    var subj='【複習手冊回報】'+where;
    var body='回報堂次：'+where+'\n問題類型（數據不實／疑似捏造／網頁問題／其他）：\n問題所在的段落或文字：\n正確內容或原文出處（頁碼、PMID）：'+(url?'\n\n頁面：'+url:'');
    var href='mailto:'+MAIL+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
    return '<aside class="report"><h2>發現錯誤？請回報</h2><p>數據不實、疑似捏造，或網頁有問題，請寄信告訴我們，並附上段落與原文出處。</p>'+
      '<div class="row"><a class="btn" href="'+href+'" data-mailto="1">寫信回報</a><span class="mail">'+MAIL+'</span><button type="button" data-copy="'+MAIL+'">複製信箱</button></div>'+
      '<div class="fallback" hidden><p>如果沒有跳出郵件 App，請複製下面的內容，自己寄到 '+MAIL+'：</p><textarea readonly rows="7">'+esc('主旨：'+subj+'\n\n'+body)+'</textarea><button type="button" data-copytext="1">複製回報內容</button></div></aside>';
  }
  document.addEventListener('click',function(e){
    var m=e.target.closest&&e.target.closest('a[data-mailto]');
    if(m){ var fb=m.closest('.report').querySelector('.fallback'); setTimeout(function(){fb.hidden=false},600); return }
    var c=e.target.closest&&e.target.closest('button[data-copytext]');
    if(c){ var ta=c.parentNode.querySelector('textarea'); ta.focus(); ta.select();
      try{navigator.clipboard.writeText(ta.value).then(function(){c.textContent='已複製'},function(){c.textContent='已選取，請手動複製'})}catch(err){c.textContent='已選取，請手動複製'}
      return }
    var b=e.target.closest&&e.target.closest('button[data-copy]'); if(!b) return;
    var t=b.getAttribute('data-copy');
    function ok(){b.textContent='已複製'} 
    try{navigator.clipboard.writeText(t).then(ok,function(){sel(b)})}catch(err){sel(b)}
    function sel(b){var m=b.parentNode.querySelector('.mail');var r=document.createRange();r.selectNodeContents(m);var w=window.getSelection();w.removeAllRanges();w.addRange(r);b.textContent='已選取，請手動複製'}
  });
  function home(){
    var n=D.sessions.length, c=Object.keys(done).length;
    var h='<header class="hero"><div class="in"><span class="eyebrow">牙周病科 住院醫師課程</span><h1>牙周經典文獻複習手冊</h1>'+
      '<p>18 模組 · 52 堂｜經典 → 新證據 → 回扣經典 → 臨床</p>'+
      '<div class="prog"><div class="bar"><i style="width:'+(c/n*100).toFixed(1)+'%"></i></div><span>已複習 '+c+' / '+n+'</span></div></div></header>'+
      '<div class="wrap"><div class="search"><input id="q" type="search" placeholder="搜尋主題、作者、關鍵字（例如 stippling、Lang）" value="'+esc(query)+'" autocomplete="off"></div><div id="list"></div>'+
      report(0)+'<p class="note">內容整理自課程大綱與內文，僅供課程成員複習；數據與結論請以原文為準。</p></div>';
    app.innerHTML=h;
    var q=document.getElementById('q');
    q.addEventListener('input',function(){query=q.value;renderList()});
    renderList();
  }
  function renderList(){
    var box=document.getElementById('list'), ql=query.trim().toLowerCase(), h='', any=false;
    D.modules.forEach(function(m){
      var ss=m.sessions.filter(function(n){return !ql||HAY[n].indexOf(ql)>=0});
      if(!ss.length) return; any=true;
      var open=ql||openMods[m.code];
      var dc=m.sessions.filter(function(n){return done[n]}).length;
      h+='<div class="mod'+(open?' open':'')+'" data-m="'+m.code+'"><button aria-expanded="'+(open?'true':'false')+'"><span class="mcode">'+m.code+'</span><span class="mname">'+esc(m.name)+'</span><span class="mcount">'+dc+'/'+m.sessions.length+' 堂</span><span class="chev" aria-hidden="true"></span></button><div class="slist">';
      ss.forEach(function(n){var s=S[n];
        h+='<a class="srow" href="#s'+pad(n)+'"><span class="snum">S'+pad(n)+'</span><span class="stitle">'+esc(s.topic)+'</span>'+
          (R[n]?'<span class="tag ready">重點</span>':'')+(done[n]?'<span class="tag done">已複習</span>':'')+'</a>';
      });
      h+='</div></div>';
    });
    box.innerHTML=any?h:'<div class="empty">找不到符合「'+esc(query)+'」的堂次</div>';
    box.querySelectorAll('.mod>button').forEach(function(b){b.addEventListener('click',function(){
      var el=b.parentNode, k=el.getAttribute('data-m'); el.classList.toggle('open');
      b.setAttribute('aria-expanded',el.classList.contains('open'));
      if(el.classList.contains('open'))openMods[k]=1;else delete openMods[k]; save(KEYO,openMods);
    })});
  }

  function litBlock(s){
    var L=lit(s), g={classic:[],new:[],cons:[],rel:[]};
    L.forEach(function(x){(g[x.r]||g.new).push(x)});
    function item(x){
      var pills=(x.s?'<span class="pill star">★ 首選</span>':'')+(x.src?'<span class="pill">'+esc(x.src)+'</span>':'')+
        (x.r==='rel'&&x.at?'<a href="#s'+pad(x.at)+'">主要在 S'+pad(x.at)+'</a>':'');
      return '<div class="lit"><span class="au">'+esc(x.a)+' ('+esc(x.y)+')</span><span class="ti">'+esc(x.t)+'</span><span class="mt">'+esc(x.j)+(x.pm?' · <a href="https://pubmed.ncbi.nlm.nih.gov/'+x.pm+'/" target="_blank" rel="noopener">PubMed</a>':'')+pills+'</span></div>';
    }
    function grp(title,arr,limit){
      if(!arr.length) return '';
      var h='<div class="litg"><h3>'+title+'（'+arr.length+'）</h3>';
      var a=arr.slice(0,limit||arr.length), b=limit?arr.slice(limit):[];
      h+=a.map(item).join('');
      if(b.length) h+='<details class="more"><summary>顯示其餘 '+b.length+' 篇</summary>'+b.map(item).join('')+'</details>';
      return h+'</div>';
    }
    var nw=g.new.slice().sort(function(a,b){return b.s-a.s});
    return grp('經典文獻',g.classic)+grp('近期文獻',nw,R[s.n]?0:4)+grp('共識與指引',g.cons)+grp('相關文獻（主題在其他堂）',g.rel);
  }

  function session(n){
    var s=S[n]; if(!s){home();return}
    var r=R[n], m=MOD[s.mod], idx=D.sessions.indexOf(s), pv=D.sessions[idx-1], nx=D.sessions[idx+1];
    var h='<div class="top"><div class="in"><a href="#">‹ 目錄</a><span class="where">'+m.code+' '+esc(m.name)+'</span></div></div><div class="wrap">'+
      '<div class="shead"><span class="eyebrow">第 '+pad(n)+' 堂</span><h1>'+esc(s.topic)+'</h1>';
    var secs=[];
    if(r){
      h+='<span class="status'+(r.status==='verified'?' ok':'')+'">'+(r.status==='verified'?'已核對':'草稿・待核對')+(r.statusNote?'｜'+esc(r.statusNote):'')+'</span></div>';
      secs=[['k','重點'],['c','新舊對照'],['n','關鍵數字'],['p','臨床應用'],['d','仍有爭議'],['qz','自我測驗'],['l','文獻']];
      h+='<nav class="jump" aria-label="本頁段落">'+secs.map(function(x){return '<button data-t="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</nav>';
      h+='<section class="blk" id="b-k"><h2>一句話重點</h2><div class="one">'+esc(r.oneLine)+'</div>'+
        (r.takeHome||[]).map(function(x,i){return '<div class="th"><b class="n">'+(i+1)+'</b><h3>'+esc(x.h)+'</h3><p>'+esc(x.b)+'</p></div>'}).join('')+'</section>';
      h+='<section class="blk" id="b-c"><h2>新舊對照</h2>'+(r.compare||[]).map(function(x){
        return '<div class="cmp"><div class="hd"><b>'+esc(x.c)+'</b><span class="v '+x.v+'">'+(x.v==='ok'?'仍適用':'需加條件')+'</span></div>'+
          '<div class="row"><span class="lab">經典</span><span>'+esc(x.old)+'</span></div><div class="row"><span class="lab">現在</span><span>'+esc(x.now)+'</span></div></div>'}).join('')+'</section>';
      h+='<section class="blk" id="b-n"><h2>關鍵數字</h2><div class="nums">'+(r.numbers||[]).map(function(x){return '<div class="num"><b>'+esc(x.k)+'</b><span>'+esc(x.d)+'</span></div>'}).join('')+'</div></section>';
      h+='<section class="blk" id="b-p"><h2>臨床應用</h2><ol class="steps">'+((r.clinical&&r.clinical.steps)||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol>'+
        ((r.clinical&&r.clinical.cases)||[]).map(function(x){return '<div class="case"><h3>'+esc(x.h)+'</h3><p>'+esc(x.b)+'</p></div>'}).join('')+'</section>';
      h+='<section class="blk" id="b-d"><h2>仍有爭議</h2><ul class="deb">'+(r.debates||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></section>';
      h+='<section class="blk" id="b-qz"><h2>自我測驗</h2><span class="score" id="score">0 / '+(r.quiz||[]).length+' 題答對</span>'+(r.quiz||[]).map(function(x,i){
        return '<div class="q" data-i="'+i+'"><span class="qq">'+(i+1)+'. '+esc(x.q)+'</span>'+x.o.map(function(o,j){return '<button class="opt" data-j="'+j+'">'+'ABCDE'[j]+'. '+esc(o)+'</button>'}).join('')+'</div>'}).join('')+'</section>';
    } else {
      h+='</div><section class="blk"><div class="todo">本堂重點整理中。上完課、大綱與內文定稿後，會補上重點、新舊對照、臨床應用與自我測驗。先從下方文獻清單開始預習。</div></section>';
    }
    h+='<section class="blk" id="b-l"><h2>文獻清單</h2>'+litBlock(s)+'</section>';
    if(s.related&&s.related.length) h+='<section class="blk"><h2>相關堂次</h2><div class="rel">'+s.related.map(function(k){return '<a href="#s'+pad(k)+'">S'+pad(k)+' '+esc(S[k].topic)+'</a>'}).join('')+'</div></section>';
    h+='<div class="foot"><button class="mark'+(done[n]?' on':'')+'" id="mark">'+(done[n]?'✓ 已複習（點一下取消）':'標記為已複習')+'</button><div class="pn">'+
      (pv?'<a href="#s'+pad(pv.n)+'"><small>‹ 上一堂</small>S'+pad(pv.n)+' '+esc(pv.topic)+'</a>':'<span style="flex:1"></span>')+
      (nx?'<a class="nx" href="#s'+pad(nx.n)+'"><small>下一堂 ›</small>S'+pad(nx.n)+' '+esc(nx.topic)+'</a>':'<span style="flex:1"></span>')+'</div></div>';
    h+=report(n)+'<p class="note">內容整理自課程大綱與內文，僅供課程成員複習；數據與結論請以原文為準。</p></div>';
    app.innerHTML=h; window.scrollTo(0,0);
    document.getElementById('mark').addEventListener('click',function(){if(done[n])delete done[n];else done[n]=1;save(KEY,done);session(n)});
    app.querySelectorAll('.jump button').forEach(function(b){b.addEventListener('click',function(){var el=document.getElementById('b-'+b.getAttribute('data-t'));if(el)el.scrollIntoView({behavior:'smooth',block:'start'})})});
    var right=0;
    app.querySelectorAll('.q').forEach(function(q){
      var i=+q.getAttribute('data-i'), x=r.quiz[i], answered=false;
      q.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){
        if(answered) return; answered=true; var j=+b.getAttribute('data-j');
        if(j===x.a){b.classList.add('right');right++}else{b.classList.add('wrong');q.querySelector('[data-j="'+x.a+'"]').classList.add('right')}
        var e=document.createElement('p');e.className='exp';e.textContent=(j===x.a?'答對了。':'正確答案是 '+'ABCDE'[x.a]+'。')+x.e;q.appendChild(e);
        document.getElementById('score').textContent=right+' / '+r.quiz.length+' 題答對';
      })});
    });
  }
  // Navigation works even where the page cannot change its own URL (previews, sandboxed viewers):
  // internal links are intercepted and rendered directly; the URL hash is updated only when allowed.
  var cur='';
  function show(h){cur=h||'';var m=cur.match(/^#s(\d{1,2})$/);if(m&&S[+m[1]])session(+m[1]);else home()}
  function go(h){
    try{ if(location.hash!==h){ history.pushState(null,'',h||location.pathname+location.search) } }catch(e){}
    show(h);
  }
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href^="#"]'); if(!a) return;
    e.preventDefault(); go(a.getAttribute('href')==='#'?'':a.getAttribute('href'));
  });
  window.addEventListener('popstate',function(){var h='';try{h=location.hash}catch(e){}show(h)});
  window.addEventListener('hashchange',function(){var h='';try{h=location.hash}catch(e){}if(h!==cur)show(h)});
  var h0='';try{h0=location.hash}catch(e){} show(h0);
})();
</script>
</body>
</html>
