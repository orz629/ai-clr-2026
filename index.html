<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15262E">
<title>牙周經典文獻複習手冊｜三軍總醫院牙周病科</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
/* Layout: one phone-width column; home = module index, #sNN = one session's review card stack. */
:root{
  --bg:#F3F5F2; --card:#FFFFFF; --ink:#1B2A31; --muted:#56656B; --line:#D7DFDC;
  --deep:#15262E; --deep-ink:#F3F5F2; --teal:#1F7A72; --teal-soft:#E2EFEC; --amber:#A8650F; --amber-soft:#FBEFD9;
  --good:#2E6B3A; --good-soft:#E3F0E2; --bad:#9B2C2C; --bad-soft:#F8E4E2;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10191D; --card:#18242A; --ink:#E6ECEA; --muted:#9AAAAE; --line:#2A3A40;
  --deep:#0B1316; --deep-ink:#E6ECEA; --teal:#5FB8AE; --teal-soft:#1C3532; --amber:#E2A35A; --amber-soft:#33281A;
  --good:#8FCB8A; --good-soft:#1E3020; --bad:#F09A90; --bad-soft:#3A2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10191D; --card:#18242A; --ink:#E6ECEA; --muted:#9AAAAE; --line:#2A3A40;
  --deep:#0B1316; --deep-ink:#E6ECEA; --teal:#5FB8AE; --teal-soft:#1C3532; --amber:#E2A35A; --amber-soft:#33281A;
  --good:#8FCB8A; --good-soft:#1E3020; --bad:#F09A90; --bad-soft:#3A2220; color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--teal)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{text-wrap:balance;margin:0}
.hero{background:var(--deep);color:var(--deep-ink);padding-block:28px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero .in{max-width:720px;margin:0 auto;display:grid;gap:10px}
.eyebrow{font-size:.78rem;letter-spacing:.12em;color:#8FCFC6;font-weight:500}
.hero h1{font-family:var(--serif);font-size:1.75rem;line-height:1.3}
.hero p{margin:0;color:#BFD0D3;font-size:.92rem}
.prog{display:flex;align-items:center;gap:10px;font-size:.85rem;color:#BFD0D3;font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;background:#2C4048;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:#8FCFC6;border-radius:99px}
.search{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:12px 8px}
.search input{width:100%;font:16px var(--sans);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 14px}
.hint{color:var(--muted);font-size:.85rem;margin:6px 2px 0}
.mod{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mod>button{width:100%;display:flex;gap:12px;align-items:center;background:none;border:0;padding:14px 16px;text-align:left;cursor:pointer}
.mcode{font-family:var(--serif);font-weight:700;font-size:1.15rem;color:var(--teal);width:1.4em;flex:none}
.mname{flex:1;font-weight:700;min-width:0}
.mcount{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{width:9px;height:9px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .2s;flex:none;margin-right:4px}
.mod.open .chev{transform:rotate(45deg)}
.slist{display:none;border-top:1px solid var(--line)}
.mod.open .slist{display:block}
.srow{display:flex;gap:12px;align-items:center;padding:12px 16px;text-decoration:none;color:var(--ink);border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.snum{font:500 .8rem var(--sans);color:var(--muted);font-variant-numeric:tabular-nums;width:2.4em;flex:none}
.stitle{flex:1;min-width:0;font-size:.95rem}
.tag{font-size:.7rem;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.ready{background:var(--teal-soft);color:var(--teal)}
.tag.done{background:var(--good-soft);color:var(--good)}
.empty{padding:24px;text-align:center;color:var(--muted)}
/* session */
.top{position:sticky;top:0;z-index:6;background:var(--deep);color:var(--deep-ink);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--deep)}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.top a{color:var(--deep-ink);text-decoration:none;font-size:.9rem;display:flex;align-items:center;gap:4px}
.top .where{font-size:.8rem;color:#9FB6BA;margin-left:auto;text-align:right}
.shead{padding-block:22px 6px;display:grid;gap:8px}
.shead .eyebrow{color:var(--teal)}
.shead h1{font-family:var(--serif);font-size:1.6rem;line-height:1.35;text-wrap:pretty}
.status{font-size:.8rem;border-radius:8px;padding:6px 10px;background:var(--amber-soft);color:var(--amber);justify-self:start}
.status.ok{background:var(--good-soft);color:var(--good)}
.jump{position:sticky;top:40px;z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 12px;font-size:.82rem;cursor:pointer}
section.blk{margin-top:18px;display:grid;gap:10px;scroll-margin-top:110px}
section.blk>h2{font-size:1.05rem;display:flex;align-items:center;gap:8px}
section.blk>h2::before{content:"";width:4px;height:1.1em;background:var(--teal);border-radius:2px}
.one{background:var(--deep);color:var(--deep-ink);border-radius:12px;padding:18px;font-family:var(--serif);font-size:1.15rem;line-height:1.6}
.th{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.th b.n{font-family:var(--serif);color:var(--teal);font-size:1.3rem;line-height:1.2;grid-row:span 2}
.th h3{font-size:1rem}
.th p{margin:0;color:var(--muted);font-size:.92rem}
.cmp{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cmp .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.cmp .hd b{font-size:.95rem}
.v{font-size:.75rem;padding:2px 10px;border-radius:99px;white-space:nowrap}
.v.ok{background:var(--good-soft);color:var(--good)}
.v.cond{background:var(--amber-soft);color:var(--amber)}
.v.upd{background:var(--teal-soft);color:var(--teal)}
.cmp .row{display:grid;grid-template-columns:3.2em 1fr;gap:8px;padding:10px 14px;font-size:.92rem}
.cmp .row+.row{border-top:1px dashed var(--line)}
.cmp .lab{font-size:.75rem;color:var(--muted);padding-top:3px}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.num{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:4px;min-width:0}
.num b{font-family:var(--serif);font-size:1.25rem;color:var(--teal);font-variant-numeric:tabular-nums;line-height:1.25}
.num span{font-size:.82rem;color:var(--muted)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:6px}
ol.steps li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px 10px 44px;position:relative;font-size:.93rem}
ol.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--teal);color:var(--card);font-size:.75rem;display:grid;place-items:center;font-weight:700}
.case{background:var(--teal-soft);border-radius:12px;padding:12px 14px}
.case h3{font-size:.95rem;margin-bottom:2px}
.case p{margin:0;font-size:.92rem}
ul.deb{margin:0;padding:0;list-style:none;display:grid;gap:6px}
ul.deb li{background:var(--amber-soft);border-radius:10px;padding:10px 12px;font-size:.92rem}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.q .qq{font-weight:700;font-size:.97rem}
.q button.opt{text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:.93rem}
.q button.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.q button.opt.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.q .exp{font-size:.9rem;color:var(--muted);border-left:3px solid var(--teal);padding-left:10px}
.score{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.litg h3{font-size:.85rem;color:var(--muted);font-weight:500;margin:6px 2px 4px}
.lit{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px;font-size:.88rem;margin-bottom:6px}
.lit .au{font-weight:700}
.lit .ti{color:var(--ink)}
.lit .mt{color:var(--muted);font-size:.8rem;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:.7rem;padding:1px 8px;border-radius:99px;background:var(--teal-soft);color:var(--teal)}
.pill.star{background:var(--amber-soft);color:var(--amber)}
.pill.cl{background:var(--deep);color:var(--deep-ink)}
details.more summary{cursor:pointer;color:var(--teal);font-size:.88rem;padding:6px 2px}
.rel{display:flex;flex-wrap:wrap;gap:6px}
.rel a{text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:.85rem;color:var(--ink)}
.todo{background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);font-size:.92rem}
.foot{margin-top:28px;display:grid;gap:10px}
.mark{width:100%;border:1px solid var(--teal);background:var(--teal);color:var(--card);border-radius:12px;padding:13px;font-weight:700;cursor:pointer}
.mark.on{background:transparent;color:var(--teal)}
.pn{display:flex;gap:8px}
.pn a{flex:1;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font-size:.85rem;min-width:0}
.pn a small{display:block;color:var(--muted)}
.pn a.nx{text-align:right}
.sitefoot{margin-top:32px;padding-top:20px;border-top:1px solid var(--line);text-align:center;color:var(--muted);font-size:.78rem;line-height:1.7;display:grid;gap:8px}
.sitefoot .who{color:var(--ink);font-size:.95rem;font-weight:700;letter-spacing:.04em}
.sitefoot p{margin:0;text-wrap:pretty}
.note{font-size:.78rem;color:var(--muted);margin-top:24px;text-align:center}
.report{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.report h2{font-size:.95rem}
.report p{margin:0;font-size:.85rem;color:var(--muted)}
.report .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.report a.btn{background:var(--teal);color:var(--card);text-decoration:none;border-radius:10px;padding:9px 14px;font-weight:700;font-size:.9rem}
.report .mail{font-size:.85rem;user-select:all;color:var(--ink)}
.report textarea{width:100%;font:13px/1.5 var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
.report .fallback{display:grid;gap:8px}
.report .fallback[hidden]{display:none}
.report button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-size:.85rem;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<script id="review-data" type="application/json">{"1":{"status":"draft","statusNote":"依教師完成之大綱與內文（2026-10-22 版）整理；待負責住院醫師核對","oneLine":"牙齦外觀只能輔助判讀；「2 mm 角化牙齦」已從絕對門檻變成看菌斑控制與跨科需求的情境判斷，而牙周表型可以靠自體移植改變。","takeHome":[{"h":"外觀特徵只是輔助","b":"stippling 會因年齡與表型而缺席（Greene 1962）；MGJ 的組織學界線是結締組織中彈性纖維突然出現的地方，不是表面凹溝或角化邊界（Lozdan & Squier 1969）。判斷健康還是要看 PPD、BoP 與 CAL。"},{"h":"「2 mm」是情境判斷，不是手術門檻","b":"Lang & Löe 1972 的 2 mm 來自短期、嚴格控菌的模型；2017 共識認為口腔衛生良好者沒有最低 KTW 需求（Cortellini & Bissada 2018）。即將唇側矯正移動或做齦下邊緣、又是薄表型時，才考慮表型改造（Kao 2020）。"},{"h":"表型可以被改變","b":"Biotype 改稱 Phenotype，強調可經治療改變。要加厚選 CTG、要加寬角化選 FGG；術後 GT 每多 1 mm，未來退縮少 0.71 mm（Barootchi 2020）；術後 KTW 越寬，齦緣長期越穩定（Carbone 2023）。"}],"compare":[{"c":"Greene 1962","old":"stippling 是附著齦的特徵，發炎擴散時會消失，治療後多數會恢復","v":"cond","now":"需加條件。20 例治療後有 19 例恢復，但也有組織已健康卻始終沒有 stippling 的個案；薄表型者常不明顯。不可單憑 stippling 診斷，要合併 PPD、BoP、CAL 與探針透光法（Greene 1962；Cortellini & Bissada 2018）。"},{"c":"Holmes 1965","old":"牙間乳頭的常態是凹陷的 col；切除後多數長不回原本高度","v":"upd","now":"已更新。col 形態的觀察仍成立，但處置觀念已改：前牙美觀區避免切除乳頭，切線採保留乳頭的翻瓣設計；已出現黑三角時，考慮調整接觸點或做軟組織重建（Cortellini & Bissada 2018）。"},{"c":"Lozdan & Squier 1969","old":"MGJ 以結締組織中彈性纖維的突然出現來定義，凹溝與角化邊界都不可靠","v":"ok","now":"仍適用。臨床上用 roll test，利用齒槽黏膜可移動的特性定位 MGJ；做 CAF 或 APF 時，減張要越過 MGJ 切開深層彈性纖維與骨膜，皮瓣才能無張力移位（Lozdan & Squier 1969；Cortellini & Bissada 2018）。"},{"c":"Lang & Löe 1972","old":"角化牙齦 < 2 mm 的牙面，即使沒有菌斑仍持續發炎，因此需要至少 2 mm","v":"cond","now":"需加條件。長期追蹤研究（Kennedy 1985、Wennström 1987，引述）與 2017 共識顯示，口腔衛生良好時 KTW < 2 mm 也能維持附著穩定（Cortellini & Bissada 2018）；衛生差、要唇側矯正或做齦下邊緣時，再考慮表型改造（Kao 2020）。"},{"c":"Perlmutter & Tal 1986","old":"牙齦去色素後，黑色素可能在數年後自行回來","v":"cond","now":"需加條件。原始證據只有 2 例。內文引述不同去色素方式術後回色比例約 20–80%（Kathariya & Pradeep 2011，引述）；黑色素細胞位於基底層、可從周邊遷移（Bartold 2000）。術前一定要說明回色風險。"}],"numbers":[{"k":"19 / 20","d":"Greene 1962：接受治療的 20 例中 19 例恢復 stippling；另有 1 例術後 93 天組織已健康，仍沒有 stippling"},{"k":"30 / 32","d":"Holmes 1965：16 位牙科學生的 32 個乳頭標本中，30 個呈凹陷的 col；23 個表面上皮未角化"},{"k":"22 / 30","d":"Holmes 1965：切除後再生的乳頭有 22 個長不回原高度，接觸點下留下 0.5–2.0 mm 空隙"},{"k":"10 / 19","d":"Lozdan & Squier 1969：表面膜齦凹溝只在 10 個標本看得到（人 12 例、猴 7 例）"},{"k":"1,406 面","d":"Lang & Löe 1972：32 位牙科學生、監督潔牙 6 週；KTW ≥ 2 mm 的牙面八成以上維持 GI = 0"},{"k":"32 個月","d":"Perlmutter & Tal 1986：病例 A 術後 32 個月開始回色，7 年時手術區幾乎全部回色；病例 B 追蹤 8 年都沒有回色"},{"k":"98–99%","d":"連續多次探測不出血，對牙周穩定的陰性預測值；單次 BoP 陽性的陽性預測值只有約 30%（Lang & Bartold 2018，引述 Lang 1990、1996）"},{"k":"≤ 1.0 mm","d":"探針透光法看得到探針即為薄型；檢查者間一致性 85%（κ = 0.7）（De Rouck 2009，引述於 Cortellini & Bissada 2018）"},{"k":"51.9% / 42.3%","d":"Zweers 2014（12 篇）：厚型與薄型的盛行率；犬齒區 GT 最薄，加權平均 0.80 mm"},{"k":"+0.66 / +4.72 mm","d":"Barootchi 2020（105 篇 RCT）：CTG 增加 GT 最多（0.66 mm）；非根面覆蓋手術中 FGG 增加 KTW 最多（4.72 mm）"},{"k":"−0.71 mm","d":"Barootchi 2020：術後早期 GT 每多 1 mm，未來退縮少 0.71 mm"},{"k":"0.2–0.5 mm","d":"Schulze 2024：臨床 CBCT 的實際解析度大約只能分辨這個大小以上的細節；體素大小不等於解析度"},{"k":"54%","d":"CBCT 判讀 < 1 mm 薄骨板的準確度，常把極薄骨板誤判為骨裂（Schulze 2024 引述）"},{"k":"20–25%","d":"Kao 2020：矯正後 2–5 年出現牙齦退縮的病人比例"},{"k":"40 篇","d":"Carbone 2023：追蹤 5–20 年的研究；術後 6–12 個月的 KTW 越寬，齦緣長期越穩定"}],"clinical":{"steps":["先判斷健康：PPD、BoP（約 0.25 N）、CAL；stippling 只當輔助","找 MGJ：roll test，必要時用碘液染色","量 KTW；附著齦 = KTW − 探測深度","探針透光法評估 GT（看得到 ≤ 1 mm 薄型，看不到 > 1 mm 厚型）；不要看牙冠形狀猜","需要評估骨板時，記得 CBCT 的解析度極限；拍攝時用棉捲拉開嘴唇可改善軟組織對比","問清楚接下來的治療：唇側矯正、齦下邊緣修復、美觀需求","決定是否表型改造：加厚選 CTG，加寬角化選 FGG"],"cases":[{"h":"矯正前的薄表型下顎門牙（教學模擬）","b":"22 歲，準備唇側擴張矯正，探針透光可見、KTW 0.5 mm。依 Kao 2020，矯正前先以 FGG 或 SCTG 改造表型，成熟 2–3 個月後再開始移動牙齒。"},{"h":"薄表型上做齦下邊緣的前牙全瓷冠（教學模擬）","b":"35 歲，上顎正中門牙要做全瓷冠，邊緣預計放在齦溝內、探針透光可見。先做 SCTG 加厚到 GT > 1 mm，成熟 2–3 個月再修邊緣、取模（Barootchi 2020；Kao 2020）。"},{"h":"病人要求牙齦去色素（教學模擬）","b":"28 歲，因笑時牙齦黑色素影響美觀。術前說明可能數年後回色、顏色通常較淡；簽知情同意，吸菸者建議先戒菸（Perlmutter & Tal 1986）。"}]},"debates":["Greene 1962、Holmes 1965、Lozdan & Squier 1969 都是描述性觀察，沒有推論統計，數字只能當描述參考。","Lang & Löe 1972 是短期、嚴格控菌的模型，也沒有提供標準差與信賴區間；2 mm 能否套用到一般病人，已被長期追蹤研究挑戰（Kennedy 1985 等，引述）。","Kao 2020 對矯正與修復前表型改造的建議，內文標示為專家意見。","探針透光法再現性高，但只是以 1 mm 為界的二分法，無法得到實際厚度；IOS 與 CBCT 疊合可量面積與體積，仍屬新興方法（Te Lin 2025）。","CBCT 容易把極薄骨板判讀成骨裂；看不到骨頭，不等於真的沒有骨頭（Schulze 2024）。","去色素後的回色比例差異很大、無法預測，經典證據只有 2 例。"],"quiz":[{"q":"Lozdan & Squier 1969 認為，哪一個特徵最能在組織學上穩定標出 MGJ？","o":["表面膜齦凹溝","上皮由角化轉為非角化的位置","結締組織中彈性纖維突然出現的位置","上皮釘突的形態"],"a":2,"e":"凹溝只在約一半標本看得到，角化也常越過 MGJ；附著齦固有層幾乎沒有彈性纖維，齒槽黏膜則很多，交界是突然改變。"},{"q":"關於 Lang & Löe 1972 的研究設計，下列何者不正確？","o":["受試者是 32 位牙科學生","先監督潔牙 6 週","用 Schiller 碘液標出 MGJ","追蹤了 10 年的附著變化"],"a":3,"e":"這是 6 週嚴格控菌後的短期觀察；長期追蹤是後來 Kennedy 1985 等研究做的，也正是這些研究修正了 2 mm 的觀念。"},{"q":"Holmes 1965 切除牙間乳頭後追蹤再生，結果最接近哪一項？","o":["幾乎全部長回原本高度與形態","多數長不回原高度，形態也常變平或凸起","只有前牙長不回來","再生的乳頭全部完整角化"],"a":1,"e":"30 個中有 22 個留下 0.5–2.0 mm 空隙，形態也改變；這是現代避免切除乳頭、改用保留乳頭翻瓣的歷史起點。"},{"q":"Barootchi 2020 網絡統合分析中，術後牙齦厚度（GT）每多 1 mm，未來退縮如何變化？","o":["增加 0.71 mm","減少 0.71 mm","減少 0.17 mm","沒有關係"],"a":1,"e":"術後早期 GT 越厚，日後退縮越少，每 1 mm 約少 0.71 mm。"},{"q":"用探針透光法評估牙齦表型，下列何者正確？","o":["看得到探針代表厚型","看得到探針代表 GT ≤ 1.0 mm 的薄型","需要局部麻醉","可以直接量出牙齦厚度的數值"],"a":1,"e":"探針放入唇側齦溝，透得出探針影子為薄型（≤ 1.0 mm），看不到為厚型；不需麻醉，但只能二分，量不出實際數值。"},{"q":"KTW 1 mm、無 BoP、口腔衛生極佳、沒有退縮，也沒有矯正或修復計畫。最恰當的處置是？","o":["KTW < 2 mm，一定要做 FGG","定期維護觀察即可","立刻做 CTG 加厚","拔牙後植牙"],"a":1,"e":"衛生良好、無發炎與退縮時不需要手術；若之後要唇側矯正或做齦下邊緣，再評估表型改造（Cortellini & Bissada 2018；Kao 2020）。"},{"q":"CBCT 報告寫「下顎門牙唇側看不到骨板，疑似骨裂」，最恰當的解讀是？","o":["確定有骨裂，需要手術","薄骨板可能低於 CBCT 的實際解析度，看不到不代表沒有","換更小的體素就能精準到 0.1 mm","CBCT 一定會低估骨裂，實際更嚴重"],"a":1,"e":"臨床 CBCT 實際只能分辨約 0.2–0.5 mm 以上的細節，體素大小不等於解析度；極薄骨板容易被誤判為骨裂（Schulze 2024）。"}],"lit":[{"a":"Greene AH","y":"1962","t":"A study of the characteristics of stippling and its relation to gingival health","j":"J Periodontol（PubMed 未收錄，PMID 待確認）","pm":"","r":"classic","s":0,"src":""},{"a":"Holmes CH","y":"1965","t":"Morphology of the interdental papillae","j":"J Periodontol","pm":"5214409","r":"classic","s":0,"src":""},{"a":"Lozdan J & Squier CA","y":"1969","t":"The histology of the muco-gingival junction","j":"J Periodontal Res","pm":"4242747","r":"classic","s":0,"src":""},{"a":"Lang NP & Löe H","y":"1972","t":"The relationship between the width of keratinized gingiva and gingival health","j":"J Periodontol","pm":"4507712","r":"classic","s":0,"src":""},{"a":"Perlmutter S & Tal H","y":"1986","t":"Repigmentation of the gingiva following surgical injury","j":"J Periodontol","pm":"3456040","r":"classic","s":0,"src":""},{"a":"Bartold PM et al.","y":"2000","t":"Molecular and cell biology of the gingiva","j":"Periodontol 2000","pm":"11276872","r":"new","s":1,"src":"Perio 2000"},{"a":"Zweers J et al.","y":"2014","t":"Characteristics of periodontal biotype, its dimensions, associations and prevalence: a systematic review","j":"J Clin Periodontol","pm":"24836578","r":"new","s":1,"src":"JCP"},{"a":"Barootchi S et al.","y":"2020","t":"Gingival phenotype modification therapies on natural teeth: A network meta-analysis","j":"J Periodontol","pm":"32392401","r":"new","s":0,"src":"JP"},{"a":"Carbone AC et al.","y":"2023","t":"Long-term stability of gingival margin and periodontal soft-tissue phenotype achieved after mucogingival therapy: A systematic review","j":"J Clin Periodontol","pm":"37963451","r":"new","s":0,"src":"JCP"},{"a":"Schulze R et al.","y":"2024","t":"Accuracy of cone-beam computed tomography in imaging the components of the periodontal phenotype","j":"Periodontol 2000","pm":"38546140","r":"new","s":0,"src":"Perio 2000"},{"a":"Te Lin Y et al.","y":"2025","t":"Three-dimensional digital quantitative analysis of periodontal and peri-implant phenotype: A narrative review","j":"Periodontol 2000","pm":"40641458","r":"new","s":0,"src":"Perio 2000"},{"a":"Kao RT et al.","y":"2020","t":"American Academy of Periodontology best evidence consensus statement on modifying periodontal phenotype in preparation for orthodontic and restorative treatment","j":"J Periodontol","pm":"31943219","r":"cons","s":0,"src":""},{"a":"Lang NP & Bartold PM","y":"2018","t":"Periodontal health","j":"J Clin Periodontol","pm":"29926485","r":"rel","s":0,"src":"","at":4},{"a":"Cortellini P & Bissada NF","y":"2018","t":"Mucogingival conditions in the natural dentition: Narrative review, case definitions, and diagnostic considerations","j":"J Clin Periodontol","pm":"29926504","r":"rel","s":0,"src":"","at":39}]},"2":{"status":"draft","statusNote":"依教師完成之大綱與內文（EBM 審查校正版 v2）整理；待負責住院醫師核對","oneLine":"生物寬度（現稱 STA）沒有通用數字，要在消炎後個別量；根面清創的目標是去污染，不是把牙骨質刮光；唇側骨板普遍薄於 1 mm，CBCT 看不到不代表沒有。","takeHome":[{"h":"STA 因人而異，沒有神奇數字","b":"Gargiulo 1961 的平均值是 2.04 mm，但 Schmidt 2013 統整後個體範圍為 0.2–6.73 mm；2017 世界研討會改稱 supracrestal tissue attachment（Jepsen 2018）。先消炎，再於局麻下 bone sounding 量出個人值。"},{"h":"清創是去污染，不是刮光牙骨質","b":"內毒素只停留在根面表層約 40–70 µm，而且結合鬆散（Bosshardt & Selvig 1997 引述 Nakib 1982）；頸部負責錨定的 AEFC 只有約 50–100 µm 厚，不要追求「玻璃般平滑」。"},{"h":"骨板薄是常態，影像有盲區","b":"後牙小臼齒有 68% 位點唇側骨板 < 1 mm（Temple 2017），上顎前牙也很少超過 1 mm（Tsigarida 2020）；CBCT 對 < 0.45–0.5 mm 的骨板顯影不到，植體周圍還有金屬假影（Dhondt 2022）。"}],"compare":[{"c":"Gargiulo 1961","old":"結合上皮 0.97 mm + 結締組織附著 1.07 mm ≈ 2.04 mm，結締組織附著最恆定","v":"cond","now":"需加條件。2.04 mm 是屍體切片的群體平均，還有組織收縮誤差；個體範圍 0.2–6.73 mm（Schmidt 2013），2017 改稱 STA（Jepsen 2018）。不要套用固定的 2 mm 或 3 mm 公式。"},{"c":"Listgarten 1972","old":"齦切後 12 天，結合上皮就以半橋粒與內基底膜重新附著","v":"ok","now":"仍適用，但只有 2 隻猴子、無菌斑模型。內文提醒人類 SRP 後組織完全成熟需 4–6 週，第一次再評估排在 4–6 週，術後早期避免反覆探測。"},{"c":"Zander & Hurzeler 1958","old":"牙骨質終生持續沉積，根尖快、頸部慢","v":"ok","now":"仍適用。Bosshardt & Selvig 1997 進一步說明：頸部 AEFC 沉積慢、負責錨定；根尖與分岔區 CIFC 沉積快、負責修復。老年人根尖牙骨質增厚多屬生理代償。"},{"c":"Stahl 1975","old":"病理根面被深層毒化，需要把病變牙骨質刮除","v":"upd","now":"已更新。內毒素只在表層約 40–70 µm 且結合鬆散（Bosshardt & Selvig 1997 引述 Nakib 1982）；改用細超音波頭與甘胺酸噴砂溫和去污染，堅硬結石照樣移除，但保留 AEFC。"},{"c":"Temple 2017","old":"後牙唇側骨板多數 < 1 mm，17.2% 在 CBCT 上看不到骨板","v":"cond","now":"需加條件。CBCT 對 < 0.45–0.5 mm 的骨板顯影不到（Dhondt 2022，體外資料），影像上的「缺失」可能只是很薄。拔牙前搭配 bone sounding；高風險部位考慮齒槽脊保存。"}],"numbers":[{"k":"2.04 mm","d":"Gargiulo 1961：30 例屍體、325 個牙面；結合上皮 0.97 mm + 結締組織附著 1.07 mm（齦溝 0.69 mm）"},{"k":"1.08 → 1.05 mm","d":"Gargiulo 1961：被動萌出四期中結締組織附著幾乎不變，結合上皮則由 1.35 mm 縮短到 0.71 mm"},{"k":"0.2–6.73 mm","d":"Schmidt 2013（14 篇）：生物寬度的個體範圍；兩組統合分析平均 2.15 與 2.30 mm"},{"k":"12 天","d":"Listgarten 1972：猴子齦切後結合上皮重新附著；人類組織成熟約需 4–6 週（內文說明）"},{"k":"約 3 µm／年","d":"Zander & Hurzeler 1958：233 顆單根牙，全根牙骨質平均厚度由 0.076 mm（11–20 歲）增加到 0.215 mm（51–76 歲）"},{"k":"約 5.5 倍","d":"Zander & Hurzeler 1958：根尖的牙骨質沉積速率約為頸部的 5.5 倍"},{"k":"40–70 µm","d":"內毒素在病理根面的滲透深度（Bosshardt & Selvig 1997 引述 Nakib 1982）"},{"k":"約 30,000 / mm²","d":"Bosshardt & Selvig 1997：AEFC 的 Sharpey's fibers 密度；CIFC 沉積可比 AEFC 快約 30 倍"},{"k":"4–8 週","d":"刮除後根面超礦化層重新建立的時間（Bosshardt & Selvig 1997 引述 Selvig & Hals 1977）"},{"k":"68%","d":"Temple 2017（265 人、934 顆後牙）：小臼齒在骨頂下 1、3、5 mm 合計有 68% 位點 BBT < 1 mm"},{"k":"17.2%","d":"Temple 2017：CBCT 上看不到唇側骨板的比例；下顎第一小臼齒 19.4%、上顎第一大臼齒近心根 21.1%，女性較多"},{"k":"+0.32 mm","d":"Tsigarida 2020（50 篇）：以 CEJ 為參考，犬齒冠側骨板比側門牙厚（95% CI 0.11–0.54）；男性根尖區厚 0.21 mm"},{"k":"−0.15 mm","d":"Dhondt 2022：體外研究統合，CBCT 平均低估植體唇側骨板厚度（95% CI −0.26 至 −0.03）"},{"k":"< 0.45–0.5 mm","d":"Dhondt 2022：骨板薄於此值時 CBCT 顯影不到（體外資料）；金屬假影會讓植體影像膨脹 20–25%"}],"clinical":{"steps":["先消炎：完成第一階段治療；發炎時探針會穿透結合上皮，量測不準","探針透光法評估牙齦表型：薄型（≤ 1 mm）或厚型（> 1 mm）","組織健康後，局麻下 bone sounding，扣掉探測深度，算出這個人的 STA","規劃修復邊緣或牙冠增長時，留出這個人的 STA，不套固定 3 mm","根面清創：移除結石與生物膜即可，用細超音波頭、噴砂，保留 AEFC","拔牙或植牙前評估骨板：CBCT 看整體，看不到骨板時用 sounding 確認","第一次再評估排在治療後 4–6 週，早期避免反覆探測"],"cases":[{"h":"前牙深部齒折（教學模擬）","b":"35 歲，#11 斷到唇側 CEJ 下 1.5 mm，薄表型。消炎後 sounding 測得 STA 2.5 mm，直接做牙冠會侵犯 STA；再加上 ferrule 的需求，美觀區優先考慮矯正拉出，最後只做小範圍牙冠增長。"},{"h":"重度牙周炎的根面處理（教學模擬）","b":"50 歲，Stage III Grade B，PPD 6–8 mm。堅硬結石照樣移除，但不追求玻璃般平滑；細超音波頭用中低功率輕刷，配合甘胺酸或赤藻糖醇噴砂去污染，保留 AEFC（Bosshardt & Selvig 1997）。"},{"h":"上顎側門牙即拔即種（教學模擬）","b":"28 歲，#22 垂直根裂，CBCT 上看不到唇側骨板。先用 sounding 確認是否還有極薄骨壁；不翻瓣微創拔牙、植體偏顎側、唇側留 ≥ 2 mm 間隙填 DBBM，必要時加 CTG 加厚（Tsigarida 2020；Dhondt 2022）。"}]},"debates":["Schmidt 2013 納入的研究在量測方法與結果指標上差異很大，平均值只能參考。","修復邊緣侵犯 STA 造成破壞的機轉仍不清楚：菌斑滯留、操作創傷、材料毒性都可能，或是合併作用（Jepsen 2018）。","Listgarten 1972 只有 2 隻猴子，人類的癒合時程屬外推。","內毒素滲透深度、超礦化層重建等數據，多為 Bosshardt & Selvig 1997 引述的早期研究，屬二手資料。","Dhondt 2022 的 CBCT 低估量與 0.45 mm 閾值來自體外研究，納入研究偏差風險高；活體情況可能更差。","超音波量骨板誤差低、沒有輻射，但研究很少、依賴操作者，還不能當常規工具（Dhondt 2022）。"],"quiz":[{"q":"Gargiulo 1961 依被動萌出分四期比較，哪一項維度在各期最穩定？","o":["齦溝深度","結合上皮長度","結締組織附著長度","CEJ 到骨頂的距離"],"a":2,"e":"結締組織附著在四期分別約 1.08、1.07、1.05、1.05 mm，結合上皮則由 1.35 mm 縮到 0.71 mm。"},{"q":"Schmidt 2013 系統性回顧中，生物寬度的個體範圍大約是？","o":["1.8–2.2 mm","2.0–3.0 mm","0.2–6.73 mm","固定 2.04 mm"],"a":2,"e":"統合平均雖在 2.15–2.30 mm，但個體範圍很大，所以作者認為不存在通用的生物寬度數字。"},{"q":"牙冠邊緣距離骨頂 1.8 mm，是否一定侵犯 STA？","o":["一定侵犯，因為小於 2 mm","一定不會","不一定，要在消炎後以 sounding 量出這個人的 STA 再判斷","只要病人沒有不舒服就不用管"],"a":2,"e":"STA 因人而異；若這個位點的 STA 是 1.5 mm 就沒有侵犯，若是 2.5 mm 就有侵犯（Schmidt 2013；Jepsen 2018）。"},{"q":"依 Bosshardt & Selvig 1997，主要負責把牙齒錨定在齒槽骨上的是哪一種牙骨質？","o":["AAC（無細胞無纖維）","AEFC（無細胞外源性纖維）","CIFC（細胞內源性纖維）","反轉線"],"a":1,"e":"AEFC 位於牙根頸側 1/2 至 2/3，有大量 Sharpey's fibers，沉積很慢；CIFC 沉積快，主要負責修復。"},{"q":"SRP 時是否應該把根面刮到像玻璃一樣平滑？","o":["是，才能除去深層毒素","否，內毒素只在表層約 40–70 µm，過度刮會刮光 AEFC","是，牙骨質很快會長回來","否，因為根面完全沒有毒素"],"a":1,"e":"內毒素停在表層且結合鬆散；頸部 AEFC 只有約 50–100 µm，過度刮除會破壞錨定並造成敏感。"},{"q":"植牙後 CBCT 顯示植體唇側看不到骨板，最恰當的處理是？","o":["直接診斷骨裂並翻瓣補骨","立即拔除植體","考慮 CBCT 盲區，結合軟組織表型評估與 sounding 再判斷","加拍一次 CBCT 就能確認"],"a":2,"e":"金屬假影會讓植體影像膨脹，< 0.45–0.5 mm 的骨板也顯影不到（Dhondt 2022）；臨床穩定時貿然翻瓣，反而可能破壞僅存的薄骨板。"},{"q":"Temple 2017 對後牙唇側骨板的主要發現是？","o":["後牙骨板普遍厚於 2 mm","小臼齒有約 68% 位點 < 1 mm，後牙也需要考慮齒槽脊保存","只有女性的骨板會薄","大臼齒完全沒有骨板缺失"],"a":1,"e":"小臼齒唇側骨板普遍 < 1 mm，另有 17.2% 在 CBCT 上看不到骨板，所以後牙拔牙也要評估是否做齒槽脊保存。"}],"lit":[{"a":"Zander HA & Hürzeler B","y":"1958","t":"Continuous cementum apposition","j":"J Dent Res","pm":"13611117","r":"classic","s":0,"src":""},{"a":"Gargiulo AW et al.","y":"1961","t":"Dimensions and relations of the dentogingival junction in humans","j":"J Periodontol（PubMed 未收錄，PMID 待確認）","pm":"","r":"classic","s":0,"src":""},{"a":"Listgarten MA","y":"1972","t":"Ultrastructure of the dento-gingival junction after gingivectomy","j":"J Periodontal Res","pm":"4272041","r":"classic","s":0,"src":""},{"a":"Stahl SS","y":"1975","t":"The nature of healthy and diseased root surfaces","j":"J Periodontol","pm":"1054759","r":"classic","s":0,"src":""},{"a":"Temple KE et al.","y":"2017","t":"Thickness of the buccal plate in posterior teeth: A prospective cone beam computed tomography study","j":"Int J Periodontics Restorative Dent","pm":"29023609","r":"classic","s":0,"src":""},{"a":"Bosshardt DD & Selvig KA","y":"1997","t":"Dental cementum: the dynamic tissue covering of the root","j":"Periodontol 2000","pm":"9567923","r":"new","s":1,"src":"Perio 2000"},{"a":"Schmidt JC et al.","y":"2013","t":"Biologic width dimensions — a systematic review","j":"J Clin Periodontol","pm":"23461747","r":"new","s":1,"src":"JCP"},{"a":"Tsigarida A et al.","y":"2020","t":"Buccal bone thickness of maxillary anterior teeth: A systematic review and meta-analysis","j":"J Clin Periodontol","pm":"32691437","r":"new","s":0,"src":"JCP"},{"a":"Dhondt R et al.","y":"2022","t":"The accuracy of probing, ultrasound and cone-beam CT scans for determining the buccal bone plate dimensions around oral implants — A systematic review","j":"J Periodontal Res","pm":"35612409","r":"new","s":0,"src":"JPR"},{"a":"Jepsen S et al.","y":"2018","t":"Periodontal manifestations of systemic diseases and developmental and acquired conditions: Consensus report of workgroup 3 of the 2017 World Workshop","j":"J Clin Periodontol","pm":"29926500","r":"rel","s":0,"src":"","at":13}]},"3":{"status":"draft","statusNote":"依教師完成之大綱與內文（校正優化版）整理；待負責住院醫師核對","oneLine":"大臼齒分岔的解剖限制（根幹、窄入口、CEP／IBR、副根管）是可以修整、可以維護的風險因子；有分岔侵犯的大臼齒掉牙風險約加倍，但規律 SPT 下多數仍能保留。","takeHome":[{"h":"記住幾個解剖數字","b":"上顎第一大臼齒根幹約占牙根表面積 32%（Hermann 1983）；水平附著喪失達 6 mm 時，研究中的牙全部成為 Grade III（Gher & Dunlap 1985）；58% 的分岔入口窄於 Gracey 刮匙刃寬（Bower 1979）。"},{"h":"用工具與修整克服解剖","b":"非手術時改用細超音波頭進分岔；手術中依序磨除 CEP（enameloplasty）、擴大入口（odontoplasty）、磨平 IBR（Masters & Hoskins 1964；Hou & Tsai 1997）。"},{"h":"預後不要太悲觀","b":"分岔侵犯使大臼齒 10–15 年掉牙相對風險為 2.21，但絕對風險仍低，多數 Grade III 的牙在 SPT 下仍能保留（Nibali 2016）；複雜病例可用小視野 CBCT 輔助診斷（Scarfe 2017）。"}],"compare":[{"c":"Hermann 1983","old":"根幹占 RSA 32%，近心頰根與顎側根面積相當","v":"cond","now":"需加條件。截根時不必一律保留顎側根；但這是離體牙的幾何數據，實際決策仍要看 3D 骨破壞型態與牙髓牙周狀況。"},{"c":"Gher & Dunlap 1985","old":"入口距 CEJ 3.6–4.8 mm；水平附著喪失 6 mm 時全部成 Grade III","v":"ok","now":"仍適用。根幹長度是固定的解剖條件；臨床 CAL 達 5–6 mm 時應警覺貫穿型病灶，需要時以 CBCT 確認剩餘骨量（Scarfe 2017）。"},{"c":"Bower 1979","old":"58% 分岔入口 ≤ 0.75 mm，刮匙單獨使用進不去","v":"upd","now":"已更新。入口窄的事實不變，但工具已改：非手術用細超音波頭，手術中以 odontoplasty 擴大入口。"},{"c":"Masters & Hoskins 1964","old":"CEP 上沒有真正的結締組織附著，和孤立性分岔病灶高度相關","v":"ok","now":"仍適用。翻瓣時要檢查 CEP，用火焰狀鑽石針磨到平滑的牙本質。"},{"c":"Hou & Tsai 1997","old":"CEP 與 IBR 常同時出現，合併時 PPD 與 CAL 較深","v":"ok","now":"仍適用，但樣本是末期拔除牙的橫斷面觀察，只能說共存、不能說因果；手術中 CEP 與 IBR 一起修平。"},{"c":"Gutmann 1978","old":"28.4% 大臼齒分岔區有通暢的副根管","v":"upd","now":"已更新。通路確實存在，但活體中部分副根管會鈣化；先測牙髓活性分清楚來源，牙髓源先做根管治療、封好髓腔底，觀察 3–6 個月再評估牙周。"}],"numbers":[{"k":"32%","d":"Hermann 1983：20 顆上顎第一大臼齒，根幹占牙根表面積 32%；近心頰根 25%、顎側根 24%、遠心頰根 19%"},{"k":"3.6 / 4.2 / 4.8 mm","d":"Gher & Dunlap 1985：近心、頰側、遠心分岔入口到 CEJ 的平均距離"},{"k":"38%","d":"Gher & Dunlap 1985：牙根分離點上下 2 mm 集中的牙根表面積比例"},{"k":"6 mm","d":"Gher & Dunlap 1985：水平附著喪失達 6 mm 以上，研究中的牙全部會成為 Grade III"},{"k":"58% / 81%","d":"Bower 1979：217 顆第一大臼齒，入口 ≤ 0.75 mm 占 58%、≤ 1.0 mm 占 81%；Gracey 刮匙刃寬 0.75–1.10 mm"},{"k":"28.6%","d":"Masters & Hoskins 1964：下顎大臼齒 CEP 盛行率（上顎 17.0%）；下顎孤立性分岔病灶九成以上合併 CEP"},{"k":"63.2%","d":"Hou & Tsai 1997：87 顆分岔侵犯的下顎大臼齒同時有 CEP 與 IBR；合併者 PPD 8.38 mm，未合併者 5.75 mm"},{"k":"28.4%","d":"Gutmann 1978：102 顆大臼齒分岔區有通暢副根管；僅開口於分岔區的比例，PubMed 摘要為 25.5%，內文寫 24.5%，待核對"},{"k":"56–73% → 83–100%","d":"2D 根尖片與 CBCT 診斷分岔侵犯的正確率（內文引 Scarfe 2017，待核對）"},{"k":"75%","d":"臨床判為 Class I 的牙，在 CBCT 下被重新分類（高估 29%、低估 44%）（內文引 Scarfe 2017，待核對）"},{"k":"RR 2.21","d":"Nibali 2016（21 篇）：分岔侵犯使 10–15 年掉牙相對風險（95% CI 1.79–2.74）；10 年內為 1.46（p = 0.06）"},{"k":"約 70%","d":"Grade III 分岔侵犯的牙在規律 SPT 下 5–15 年的保留率（內文標示引述 Nibali 2016，待核對）"}],"clinical":{"steps":["水平探測分岔，判定 Grade；CAL 達 5–6 mm 時提高警覺","2D 影像看不清時（尤其上顎顎側分岔），考慮小視野 CBCT","找解剖風險：根幹長短、入口寬度、CEP、IBR","分岔區單獨骨吸收時，先測牙髓活性（冷測、EPT）","非手術：用細超音波頭進入分岔，搭配放大設備","手術：enameloplasty → odontoplasty → 磨平 IBR；視情況做 GTR、截根或隧道化","術後衛教單束刷與牙間刷，規律 SPT"],"cases":[{"h":"下顎第一大臼齒 Grade II 合併 CEP（教學模擬）","b":"#36 頰側 PPD 6 mm、BoP 陽性、Grade II。翻瓣後磨除 CEP，用鑽石超音波頭清溝槽，再做 GTR；CEP 處理好是再生成功的前提（Masters & Hoskins 1964）。"},{"h":"上顎大臼齒顎側根嚴重骨吸收（教學模擬）","b":"#16 顎側根骨吸收到根尖 1/3，兩個頰側根還有一半骨支持。先做根管治療，再截除顎側根並修整外形；近心頰根面積與顎側根相當，保留頰側根可行（Hermann 1983）。"},{"h":"分岔區窄深袋、牙髓沒有反應（教學模擬）","b":"#46 分岔區單獨骨吸收、PPD 8 mm 窄而深，牙髓活性測試無反應。判斷為牙髓源，先做高品質根管治療並封好髓腔底，不急著刮治或做牙周手術（Gutmann 1978）。"}]},"debates":["約 70% 的 Grade III 保留率來自高度配合 SPT 的病人，一般門診病人能否達到不確定；內文標示為引述，需對照原文。","Hou & Tsai 1997 是末期拔除牙的橫斷面觀察，CEP、IBR 與分岔病灶只能說共存，不能證明因果。","副根管在解剖上通暢，不等於臨床上一定會傳導病變；活體中部分會鈣化封閉（Gutmann 1978）。","經典研究多為離體牙量測，無法反映宿主反應、癒合能力與現代維護的效果。","「優先保留自然牙」的指引精神，內文標示為專家意見，沒有列出具體文獻。","CBCT 能提升分岔診斷，但要考慮輻射，依 ALADA 原則選小視野（Scarfe 2017）。"],"quiz":[{"q":"Hermann 1983 量測上顎第一大臼齒，牙根表面積最大的是哪一部分？","o":["顎側根","近心頰根","遠心頰根","根幹"],"a":3,"e":"根幹約占 32%，比任何單一牙根都大；近心頰根（25%）與顎側根（24%）沒有顯著差異。"},{"q":"Gher & Dunlap 1985 指出，水平附著喪失達多少時，研究中的上顎第一大臼齒全部成為 Grade III？","o":["2 mm","4 mm","6 mm","8 mm"],"a":2,"e":"所有牙根都在 6 mm 內分離，所以水平附著喪失達 6 mm 以上就會貫穿。"},{"q":"下顎大臼齒頰側分岔入口 0.6 mm，用刃寬 0.9 mm 的 Gracey 刮匙怎麼刮都改善不了。最合適的做法是？","o":["換更大的刮匙","改用細超音波頭；手術中可做 odontoplasty 擴大入口","直接拔牙","延長刮治時間"],"a":1,"e":"刮匙比入口寬，物理上進不去（Bower 1979）；改用細超音波頭，或在手術中擴大入口。"},{"q":"CEP 容易成為分岔病灶突破口的主要原因是？","o":["釉質表面沒有真正的結締組織附著","CEP 會分泌毒素","CEP 讓牙根變短","CEP 會阻擋唾液"],"a":0,"e":"釉質上只能形成上皮附著，沒有結締組織纖維嵌入，發炎時容易形成深袋（Masters & Hoskins 1964）。"},{"q":"#46 分岔區單獨骨吸收、窄而深的 8 mm 牙周囊袋、牙髓活性測試無反應。第一步應該是？","o":["立刻翻瓣做 GTR","深層刮治分岔區","先做根管治療並封好髓腔底，再觀察","拔牙植牙"],"a":2,"e":"疑似牙髓源經副根管造成的病灶，先處理牙髓，觀察 3–6 個月後再評估是否還需要牙周治療。"},{"q":"關於 Nibali 2016 的結論，下列何者最正確？","o":["有分岔侵犯的牙大多數會掉","分岔侵犯讓 10–15 年掉牙相對風險約加倍，但多數牙在 SPT 下仍可保留","分岔侵犯和掉牙無關","Grade III 一律建議拔除植牙"],"a":1,"e":"10–15 年相對風險 2.21，但絕對風險仍低；即使 Grade III，多數牙對牙周治療反應仍良好，值得盡力保留。"}],"lit":[{"a":"Masters DH & Hoskins SW","y":"1964","t":"Projection of cervical enamel into molar furcations","j":"J Periodontol（PubMed 未收錄，PMID 待確認）","pm":"","r":"classic","s":0,"src":""},{"a":"Gutmann JL","y":"1978","t":"Prevalence, location, and patency of accessory canals in the furcation region of permanent molars","j":"J Periodontol","pm":"271710","r":"classic","s":0,"src":""},{"a":"Bower RC","y":"1979","t":"Furcation morphology relative to periodontal treatment. Furcation entrance architecture","j":"J Periodontol","pm":"283222","r":"classic","s":0,"src":""},{"a":"Hermann DW et al.","y":"1983","t":"The potential attachment area of the maxillary first molar","j":"J Periodontol","pm":"6577179","r":"classic","s":0,"src":""},{"a":"Gher ME & Dunlap RW","y":"1985","t":"Linear variation of the root surface area of the maxillary first molar","j":"J Periodontol","pm":"3882932","r":"classic","s":0,"src":""},{"a":"Hou GL & Tsai CC","y":"1997","t":"Cervical enamel projection and intermediate bifurcational ridge correlated with molar furcation involvements","j":"J Periodontol","pm":"9249641","r":"classic","s":0,"src":""},{"a":"Nibali L et al.","y":"2016","t":"Tooth loss in molars with and without furcation involvement — a systematic review and meta-analysis","j":"J Clin Periodontol","pm":"26932323","r":"new","s":1,"src":"JCP"},{"a":"Scarfe WC et al.","y":"2017","t":"The emerging role of maxillofacial radiology in the diagnosis and management of patients with complex periodontitis","j":"Periodontol 2000","pm":"28429477","r":"new","s":1,"src":"Perio 2000"}]}}</script>
<script>
(function(){
  var D=JSON.parse(document.getElementById('course-data').textContent);
  var R=JSON.parse(document.getElementById('review-data').textContent);
  var S={}; D.sessions.forEach(function(s){S[s.n]=s});
  var MOD={}; D.modules.forEach(function(m){MOD[m.code]=m});
  var KEY='perioReview.done', KEYO='perioReview.open';
  function load(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
  function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
  var done=load(KEY,{}), openMods=load(KEYO,{});
  var app=document.getElementById('app'), query='';
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function pad(n){return (n<10?'0':'')+n}
  function lit(s){return R[s.n]&&R[s.n].lit?R[s.n].lit:s.lit}
  function hay(s){
    var r=R[s.n], t=[s.topic,MOD[s.mod].name,'S'+pad(s.n)];
    lit(s).forEach(function(x){t.push(x.a,x.t,x.y)});
    if(r){t.push(r.oneLine);(r.takeHome||[]).forEach(function(x){t.push(x.h,x.b)});(r.compare||[]).forEach(function(x){t.push(x.old,x.now)});(r.numbers||[]).forEach(function(x){t.push(x.d)})}
    return t.join(' ').toLowerCase();
  }
  var HAY={}; D.sessions.forEach(function(s){HAY[s.n]=hay(s)});

  var MAIL='chygwu@gmail.com';
  function report(n){
    var s=n?S[n]:null, where=s?('S'+pad(n)+' '+s.topic):'目錄／整體網頁';
    var url='';try{url=location.href}catch(e){} if(!/^https?:/.test(url)) url='';
    var subj='【複習手冊回報】'+where;
    var body='回報堂次：'+where+'\n問題類型（數據不實／疑似捏造／網頁問題／其他）：\n問題所在的段落或文字：\n正確內容或原文出處（頁碼、PMID）：'+(url?'\n\n頁面：'+url:'');
    var href='mailto:'+MAIL+'?subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body);
    return '<aside class="report"><h2>發現錯誤？請回報</h2><p>數據不實、疑似捏造，或網頁有問題，請寄信告訴我們，並附上段落與原文出處。</p>'+
      '<div class="row"><a class="btn" href="'+href+'" data-mailto="1">寫信回報</a><span class="mail">'+MAIL+'</span><button type="button" data-copy="'+MAIL+'">複製信箱</button></div>'+
      '<div class="fallback" hidden><p>如果沒有跳出郵件 App，請複製下面的內容，自己寄到 '+MAIL+'：</p><textarea readonly rows="7">'+esc('主旨：'+subj+'\n\n'+body)+'</textarea><button type="button" data-copytext="1">複製回報內容</button></div></aside>';
  }
  document.addEventListener('click',function(e){
    var m=e.target.closest&&e.target.closest('a[data-mailto]');
    if(m){ var fb=m.closest('.report').querySelector('.fallback'); setTimeout(function(){fb.hidden=false},600); return }
    var c=e.target.closest&&e.target.closest('button[data-copytext]');
    if(c){ var ta=c.parentNode.querySelector('textarea'); ta.focus(); ta.select();
      try{navigator.clipboard.writeText(ta.value).then(function(){c.textContent='已複製'},function(){c.textContent='已選取，請手動複製'})}catch(err){c.textContent='已選取，請手動複製'}
      return }
    var b=e.target.closest&&e.target.closest('button[data-copy]'); if(!b) return;
    var t=b.getAttribute('data-copy');
    function ok(){b.textContent='已複製'} 
    try{navigator.clipboard.writeText(t).then(ok,function(){sel(b)})}catch(err){sel(b)}
    function sel(b){var m=b.parentNode.querySelector('.mail');var r=document.createRange();r.selectNodeContents(m);var w=window.getSelection();w.removeAllRanges();w.addRange(r);b.textContent='已選取，請手動複製'}
  });
  function foot(){
    var y=new Date().getFullYear();
    return '<footer class="sitefoot"><div class="who">三軍總醫院 牙周病科　陳穎吾</div>'+
      '<p>© '+(y>2026?'2026–'+y:'2026')+' 三軍總醫院牙周病科　陳穎吾</p>'+
      '<p>本手冊採 <a href="https://creativecommons.org/licenses/by-nc-nd/4.0/deed.zh-hant" target="_blank" rel="license noopener">CC BY-NC-ND 4.0</a> 授權：歡迎標示出處後原樣分享於學術與教學用途，不得商業使用或改作。</p>'+
      '<p>所引用文獻之內容、圖表與數據，著作權屬原作者及出版者所有，本手冊僅摘要並註明出處；數據與結論請以原文為準。</p>'+
      '<p>本手冊內容由 AI 協助整理，經作者與住院醫師對照原文核對；如有錯誤，歡迎回報。</p>'+'<p>本手冊為教學用途，不構成個別病人之診療建議。</p></footer>';
  }
  function home(){
    var n=D.sessions.length, c=Object.keys(done).length;
    var h='<header class="hero"><div class="in"><span class="eyebrow">三軍總醫院 牙周病科 住院醫師課程</span><h1>牙周經典文獻複習手冊</h1>'+
      '<p>18 模組 · 52 堂｜經典 → 新證據 → 回扣經典 → 臨床</p>'+
      '<div class="prog"><div class="bar"><i style="width:'+(c/n*100).toFixed(1)+'%"></i></div><span>已複習 '+c+' / '+n+'</span></div></div></header>'+
      '<div class="wrap"><div class="search"><input id="q" type="search" placeholder="搜尋主題、作者、關鍵字（例如 stippling、Lang）" value="'+esc(query)+'" autocomplete="off"></div><div id="list"></div>'+
      report(0)+foot()+'</div>';
    app.innerHTML=h;
    var q=document.getElementById('q');
    q.addEventListener('input',function(){query=q.value;renderList()});
    renderList();
  }
  function renderList(){
    var box=document.getElementById('list'), ql=query.trim().toLowerCase(), h='', any=false;
    D.modules.forEach(function(m){
      var ss=m.sessions.filter(function(n){return !ql||HAY[n].indexOf(ql)>=0});
      if(!ss.length) return; any=true;
      var open=ql||openMods[m.code];
      var dc=m.sessions.filter(function(n){return done[n]}).length;
      h+='<div class="mod'+(open?' open':'')+'" data-m="'+m.code+'"><button aria-expanded="'+(open?'true':'false')+'"><span class="mcode">'+m.code+'</span><span class="mname">'+esc(m.name)+'</span><span class="mcount">'+dc+'/'+m.sessions.length+' 堂</span><span class="chev" aria-hidden="true"></span></button><div class="slist">';
      ss.forEach(function(n){var s=S[n];
        h+='<a class="srow" href="#s'+pad(n)+'"><span class="snum">S'+pad(n)+'</span><span class="stitle">'+esc(s.topic)+'</span>'+
          (R[n]?'<span class="tag ready">重點</span>':'')+(done[n]?'<span class="tag done">已複習</span>':'')+'</a>';
      });
      h+='</div></div>';
    });
    box.innerHTML=any?h:'<div class="empty">找不到符合「'+esc(query)+'」的堂次</div>';
    box.querySelectorAll('.mod>button').forEach(function(b){b.addEventListener('click',function(){
      var el=b.parentNode, k=el.getAttribute('data-m'); el.classList.toggle('open');
      b.setAttribute('aria-expanded',el.classList.contains('open'));
      if(el.classList.contains('open'))openMods[k]=1;else delete openMods[k]; save(KEYO,openMods);
    })});
  }

  function litBlock(s){
    var L=lit(s), g={classic:[],new:[],cons:[],rel:[]};
    L.forEach(function(x){(g[x.r]||g.new).push(x)});
    function item(x){
      var pills=(x.s?'<span class="pill star">★ 首選</span>':'')+(x.src?'<span class="pill">'+esc(x.src)+'</span>':'')+
        (x.r==='rel'&&x.at?'<a href="#s'+pad(x.at)+'">主要在 S'+pad(x.at)+'</a>':'');
      return '<div class="lit"><span class="au">'+esc(x.a)+' ('+esc(x.y)+')</span><span class="ti">'+esc(x.t)+'</span><span class="mt">'+esc(x.j)+(x.pm?' · <a href="https://pubmed.ncbi.nlm.nih.gov/'+x.pm+'/" target="_blank" rel="noopener">PubMed</a>':'')+pills+'</span></div>';
    }
    function grp(title,arr,limit){
      if(!arr.length) return '';
      var h='<div class="litg"><h3>'+title+'（'+arr.length+'）</h3>';
      var a=arr.slice(0,limit||arr.length), b=limit?arr.slice(limit):[];
      h+=a.map(item).join('');
      if(b.length) h+='<details class="more"><summary>顯示其餘 '+b.length+' 篇</summary>'+b.map(item).join('')+'</details>';
      return h+'</div>';
    }
    var nw=g.new.slice().sort(function(a,b){return b.s-a.s});
    return grp('經典文獻',g.classic)+grp('近期文獻',nw,R[s.n]?0:4)+grp('共識與指引',g.cons)+grp('相關文獻（主題在其他堂）',g.rel);
  }

  function session(n){
    var s=S[n]; if(!s){home();return}
    var r=R[n], m=MOD[s.mod], idx=D.sessions.indexOf(s), pv=D.sessions[idx-1], nx=D.sessions[idx+1];
    var h='<div class="top"><div class="in"><a href="#">‹ 目錄</a><span class="where">'+m.code+' '+esc(m.name)+'</span></div></div><div class="wrap">'+
      '<div class="shead"><span class="eyebrow">第 '+pad(n)+' 堂</span><h1>'+esc(s.topic)+'</h1>';
    var secs=[];
    if(r){
      h+='<span class="status'+(r.status==='verified'?' ok':'')+'">'+(r.status==='verified'?'已核對':'草稿・待核對')+(r.statusNote?'｜'+esc(r.statusNote):'')+'</span></div>';
      secs=[['k','重點'],['c','新舊對照'],['n','關鍵數字'],['p','臨床應用'],['d','仍有爭議'],['qz','自我測驗'],['l','文獻']];
      h+='<nav class="jump" aria-label="本頁段落">'+secs.map(function(x){return '<button data-t="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</nav>';
      h+='<section class="blk" id="b-k"><h2>一句話重點</h2><div class="one">'+esc(r.oneLine)+'</div>'+
        (r.takeHome||[]).map(function(x,i){return '<div class="th"><b class="n">'+(i+1)+'</b><h3>'+esc(x.h)+'</h3><p>'+esc(x.b)+'</p></div>'}).join('')+'</section>';
      h+='<section class="blk" id="b-c"><h2>新舊對照</h2>'+(r.compare||[]).map(function(x){
        return '<div class="cmp"><div class="hd"><b>'+esc(x.c)+'</b><span class="v '+x.v+'">'+(x.v==='ok'?'仍適用':x.v==='upd'?'已更新':'需加條件')+'</span></div>'+
          '<div class="row"><span class="lab">經典</span><span>'+esc(x.old)+'</span></div><div class="row"><span class="lab">現在</span><span>'+esc(x.now)+'</span></div></div>'}).join('')+'</section>';
      h+='<section class="blk" id="b-n"><h2>關鍵數字</h2><div class="nums">'+(r.numbers||[]).map(function(x){return '<div class="num"><b>'+esc(x.k)+'</b><span>'+esc(x.d)+'</span></div>'}).join('')+'</div></section>';
      h+='<section class="blk" id="b-p"><h2>臨床應用</h2><ol class="steps">'+((r.clinical&&r.clinical.steps)||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol>'+
        ((r.clinical&&r.clinical.cases)||[]).map(function(x){return '<div class="case"><h3>'+esc(x.h)+'</h3><p>'+esc(x.b)+'</p></div>'}).join('')+'</section>';
      h+='<section class="blk" id="b-d"><h2>仍有爭議</h2><ul class="deb">'+(r.debates||[]).map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul></section>';
      h+='<section class="blk" id="b-qz"><h2>自我測驗</h2><span class="score" id="score">0 / '+(r.quiz||[]).length+' 題答對</span>'+(r.quiz||[]).map(function(x,i){
        return '<div class="q" data-i="'+i+'"><span class="qq">'+(i+1)+'. '+esc(x.q)+'</span>'+x.o.map(function(o,j){return '<button class="opt" data-j="'+j+'">'+'ABCDE'[j]+'. '+esc(o)+'</button>'}).join('')+'</div>'}).join('')+'</section>';
    } else {
      h+='</div><section class="blk"><div class="todo">本堂重點整理中。上完課、大綱與內文定稿後，會補上重點、新舊對照、臨床應用與自我測驗。先從下方文獻清單開始預習。</div></section>';
    }
    h+='<section class="blk" id="b-l"><h2>文獻清單</h2>'+litBlock(s)+'</section>';
    if(s.related&&s.related.length) h+='<section class="blk"><h2>相關堂次</h2><div class="rel">'+s.related.map(function(k){return '<a href="#s'+pad(k)+'">S'+pad(k)+' '+esc(S[k].topic)+'</a>'}).join('')+'</div></section>';
    h+='<div class="foot"><button class="mark'+(done[n]?' on':'')+'" id="mark">'+(done[n]?'✓ 已複習（點一下取消）':'標記為已複習')+'</button><div class="pn">'+
      (pv?'<a href="#s'+pad(pv.n)+'"><small>‹ 上一堂</small>S'+pad(pv.n)+' '+esc(pv.topic)+'</a>':'<span style="flex:1"></span>')+
      (nx?'<a class="nx" href="#s'+pad(nx.n)+'"><small>下一堂 ›</small>S'+pad(nx.n)+' '+esc(nx.topic)+'</a>':'<span style="flex:1"></span>')+'</div></div>';
    h+=report(n)+foot()+'</div>';
    app.innerHTML=h; window.scrollTo(0,0);
    document.getElementById('mark').addEventListener('click',function(){if(done[n])delete done[n];else done[n]=1;save(KEY,done);session(n)});
    app.querySelectorAll('.jump button').forEach(function(b){b.addEventListener('click',function(){var el=document.getElementById('b-'+b.getAttribute('data-t'));if(el)el.scrollIntoView({behavior:'smooth',block:'start'})})});
    var right=0;
    app.querySelectorAll('.q').forEach(function(q){
      var i=+q.getAttribute('data-i'), x=r.quiz[i], answered=false;
      q.querySelectorAll('.opt').forEach(function(b){b.addEventListener('click',function(){
        if(answered) return; answered=true; var j=+b.getAttribute('data-j');
        if(j===x.a){b.classList.add('right');right++}else{b.classList.add('wrong');q.querySelector('[data-j="'+x.a+'"]').classList.add('right')}
        var e=document.createElement('p');e.className='exp';e.textContent=(j===x.a?'答對了。':'正確答案是 '+'ABCDE'[x.a]+'。')+x.e;q.appendChild(e);
        document.getElementById('score').textContent=right+' / '+r.quiz.length+' 題答對';
      })});
    });
  }
  // Navigation works even where the page cannot change its own URL (previews, sandboxed viewers):
  // internal links are intercepted and rendered directly; the URL hash is updated only when allowed.
  var cur='';
  function show(h){cur=h||'';var m=cur.match(/^#s(\d{1,2})$/);if(m&&S[+m[1]])session(+m[1]);else home()}
  function go(h){
    try{ if(location.hash!==h){ history.pushState(null,'',h||location.pathname+location.search) } }catch(e){}
    show(h);
  }
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a[href^="#"]'); if(!a) return;
    e.preventDefault(); go(a.getAttribute('href')==='#'?'':a.getAttribute('href'));
  });
  window.addEventListener('popstate',function(){var h='';try{h=location.hash}catch(e){}show(h)});
  window.addEventListener('hashchange',function(){var h='';try{h=location.hash}catch(e){}if(h!==cur)show(h)});
  var h0='';try{h0=location.hash}catch(e){} show(h0);
})();
</script>
